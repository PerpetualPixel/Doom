<!DOCTYPE html>

<style>

  }
  #game {

    width: 100vw; height: 100vh;
    object-fit: contain;

    image-rendering: crisp-edges;

  }
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;

<body>
<canvas id="game" width="640" height="400"></canvas>
<div id="overlay">
  <h1>DOOM</h1>
  <p>
    <span class="key">CLICK</span> to enter the map (locks mouse)<br>
    <span class="key">WASD</span> move &nbsp; <span class="key">MOUSE / ARROWS</span> turn &nbsp; <span class="key">SHIFT</span> run<br>
    <span class="key">CLICK / SPACE</span> fire &nbsp; <span class="key">E</span> use doors / switches &nbsp; <span class="key">M</span> map<br>
    <span class="key">N</span> music on/off &nbsp; <span class="key">R</span> restart<br><br>
    Three levels. Find the exit switch in each.
  </p>

// ============================================================
// DOOM.html — a single-file Doom-style raycaster.

// the local "SFX/" and "Doom OST/" folders when present and
// falls back to synthesized WebAudio when they are not
// (e.g. on the hosted version, which ships no audio files).
// ============================================================

const zBuffer = new Float64Array(W);

let MAP = [], MAP_W = 0, MAP_H = 0, levelIdx = 0;
const mapAt = (x, y) => (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) ? 1 : MAP[y * MAP_W + x];

// Doors: any tile 4 can be opened with E. Keyed by cell index.
const doors = new Map();
function doorAt(cx, cy) { return doors.get(cy * MAP_W + cx); }
function solidCell(cx, cy) {
  const t = mapAt(cx, cy);
  if (t === 0) return false;
  if (t === 4) {
    const d = doorAt(cx, cy);
    return !(d && d.open > 0.8);
  }
  return true;
}
function cellOccupied(key) {
  const cx = key % MAP_W, cy = (key / MAP_W) | 0;
  if ((player.x | 0) === cx && (player.y | 0) === cy) return true;
  return enemies.some(e => !e.dead && (e.x | 0) === cx && (e.y | 0) === cy);
}

// ---------------------------------------------------------
// Procedural textures (64x64) -> Uint32Array
// ---------------------------------------------------------
const TEX = 64;
function makeTexture(draw) {
  const c = document.createElement("canvas");
  c.width = c.height = TEX;
  const g = c.getContext("2d");
  draw(g);
  return { data: new Uint32Array(g.getImageData(0, 0, TEX, TEX).data.buffer), canvas: c };
}
function noiseOver(g, alpha, n = 300) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = `rgba(0,0,0,${Math.random() * alpha})`;
    g.fillRect(Math.random() * TEX | 0, Math.random() * TEX | 0, 2, 2);
  }
}
const textures = [null,
  // 1: gray stone brick
  makeTexture(g => {
    g.fillStyle = "#5a5a5a"; g.fillRect(0, 0, TEX, TEX);
    g.fillStyle = "#3c3c3c";
    for (let r = 0; r < 4; r++) {
      const off = (r % 2) * 16;
      for (let c = -1; c < 3; c++) g.strokeRect(c * 32 + off + 0.5, r * 16 + 0.5, 32, 16);
    }
    g.strokeStyle = "#2c2c2c"; g.lineWidth = 2;
    for (let r = 0; r < 4; r++) {
      g.beginPath(); g.moveTo(0, r * 16); g.lineTo(TEX, r * 16); g.stroke();
      const off = (r % 2) * 16;
      for (let c = 0; c < 3; c++) { g.beginPath(); g.moveTo(c * 32 + off, r * 16); g.lineTo(c * 32 + off, r * 16 + 16); g.stroke(); }
    }
    noiseOver(g, 0.25);
  }),
  // 2: hell brick (red)
  makeTexture(g => {
    g.fillStyle = "#6e1f14"; g.fillRect(0, 0, TEX, TEX);
    g.strokeStyle = "#38100a"; g.lineWidth = 2;
    for (let r = 0; r < 8; r++) {
      g.beginPath(); g.moveTo(0, r * 8); g.lineTo(TEX, r * 8); g.stroke();
      const off = (r % 2) * 8;
      for (let c = 0; c < 5; c++) { g.beginPath(); g.moveTo(c * 16 + off, r * 8); g.lineTo(c * 16 + off, r * 8 + 8); g.stroke(); }
    }
    g.fillStyle = "rgba(255,120,40,0.15)";
    g.fillRect(8, 20, 10, 6); g.fillRect(40, 44, 12, 5);
    noiseOver(g, 0.3);
  }),
  // 3: tech wall (green-lit panels)
  makeTexture(g => {
    g.fillStyle = "#33383d"; g.fillRect(0, 0, TEX, TEX);
    g.strokeStyle = "#1c1f22"; g.lineWidth = 2;
    g.strokeRect(4, 4, 56, 56); g.strokeRect(12, 12, 40, 40);
    g.fillStyle = "#22262a"; g.fillRect(12, 12, 40, 40);
    g.fillStyle = "#3fda6a";
    for (let i = 0; i < 4; i++) g.fillRect(18, 18 + i * 8, 28, 3);
    g.fillStyle = "#9aa1a8";
    g.fillRect(0, 0, TEX, 3); g.fillRect(0, 61, TEX, 3);
    noiseOver(g, 0.2);
  }),
  // 4: door (metal, warning stripes)
  makeTexture(g => {
    g.fillStyle = "#4a4f55"; g.fillRect(0, 0, TEX, TEX);

    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {

});

  for (let i = 0; i <= 4; i++) {

    g.beginPath(); g.moveTo(0, i * 16); g.lineTo(TEX, i * 16); g.stroke();
  }
  noiseOver(g, 0.3);
});
const ceilTex = makeTexture(g => {
  g.fillStyle = "#22201e"; g.fillRect(0, 0, TEX, TEX);
  g.fillStyle = "#191715";
  for (let i = 0; i < 40; i++) g.fillRect(Math.random() * TEX | 0, Math.random() * TEX | 0, 4, 4);

// ---------------------------------------------------------
// Procedural sprites (imp, pinky, medkit, ammo, fireball)
// ---------------------------------------------------------
const SPR = 64;
function makeSprite(draw) {
  const c = document.createElement("canvas");
  c.width = c.height = SPR;
  const g = c.getContext("2d");
  draw(g);
  return new Uint32Array(g.getImageData(0, 0, SPR, SPR).data.buffer);
}
function drawImp(g, attacking, hurt) {
  const skin = hurt ? "#d06a4a" : "#8b5a3c";
  const dark = hurt ? "#a04830" : "#5e3a24";
  g.fillStyle = dark;
  g.fillRect(22, 46, 7, 16); g.fillRect(35, 46, 7, 16);
  g.fillStyle = skin;
  g.beginPath(); g.ellipse(32, 36, 13, 14, 0, 0, 7); g.fill();
  g.fillStyle = "#e8e0d0";
  g.beginPath(); g.moveTo(18, 30); g.lineTo(14, 22); g.lineTo(22, 27); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(46, 30); g.lineTo(50, 22); g.lineTo(42, 27); g.closePath(); g.fill();
  g.fillStyle = skin;
  if (attacking) {
    g.fillRect(10, 24, 6, 14);
    g.fillStyle = "#ff8c1a";
    g.beginPath(); g.ellipse(13, 20, 6, 6, 0, 0, 7); g.fill();
    g.fillStyle = "#ffd24d";
    g.beginPath(); g.ellipse(13, 20, 3, 3, 0, 0, 7); g.fill();
    g.fillStyle = skin;
    g.fillRect(46, 34, 7, 14);
  } else {
    g.fillRect(12, 34, 7, 14); g.fillRect(45, 34, 7, 14);
  }
  g.fillStyle = skin;
  g.beginPath(); g.ellipse(32, 18, 9, 9, 0, 0, 7); g.fill();
  g.fillStyle = "#e8e0d0";
  g.beginPath(); g.moveTo(24, 14); g.lineTo(20, 5); g.lineTo(27, 10); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(40, 14); g.lineTo(44, 5); g.lineTo(37, 10); g.closePath(); g.fill();
  g.fillStyle = hurt ? "#fff" : "#ffdd33";
  g.fillRect(27, 15, 4, 3); g.fillRect(34, 15, 4, 3);
  g.fillStyle = "#301008"; g.fillRect(28, 22, 9, 3);
  g.fillStyle = "#fff";
  g.fillRect(28, 22, 2, 2); g.fillRect(32, 22, 2, 2); g.fillRect(35, 22, 2, 2);
}
function drawPinky(g, attacking, hurt) {
  const skin = hurt ? "#ff9a9a" : "#d16a86";
  const dark = hurt ? "#d06060" : "#96455e";
  g.fillStyle = dark;
  g.fillRect(18, 48, 9, 14); g.fillRect(37, 48, 9, 14);
  g.fillStyle = skin;
  g.beginPath(); g.ellipse(32, 34, 18, 18, 0, 0, 7); g.fill();
  g.fillStyle = dark;
  g.beginPath(); g.ellipse(32, 40, 13, attacking ? 11 : 8, 0, 0, 7); g.fill();
  g.fillStyle = "#2a0a10";
  g.beginPath(); g.ellipse(32, 40, 10, attacking ? 8 : 5, 0, 0, 7); g.fill();
  g.fillStyle = "#fff";
  for (let i = 0; i < 5; i++) {
    g.beginPath(); g.moveTo(24 + i * 4, 34); g.lineTo(26 + i * 4, 40); g.lineTo(28 + i * 4, 34); g.closePath(); g.fill();
  }
  g.fillStyle = hurt ? "#fff" : "#7fff5a";
  g.fillRect(22, 22, 5, 4); g.fillRect(37, 22, 5, 4);
  g.fillStyle = "#000"; g.fillRect(24, 23, 2, 2); g.fillRect(39, 23, 2, 2);
  g.fillStyle = skin;
  g.fillRect(10, 30, 6, 10); g.fillRect(48, 30, 6, 10);
}
const sprites = {
  impIdle:    makeSprite(g => drawImp(g, false, false)),
  impAttack:  makeSprite(g => drawImp(g, true,  false)),
  impPain:    makeSprite(g => drawImp(g, false, true)),
  pinkyIdle:  makeSprite(g => drawPinky(g, false, false)),
  pinkyAttack:makeSprite(g => drawPinky(g, true,  false)),
  pinkyPain:  makeSprite(g => drawPinky(g, false, true)),
  medkit: makeSprite(g => {
    g.fillStyle = "#e8e8e8"; g.fillRect(16, 36, 32, 22);
    g.fillStyle = "#b8b8b8"; g.fillRect(16, 36, 32, 4);
    g.fillStyle = "#d02020"; g.fillRect(28, 40, 8, 16); g.fillRect(22, 44, 20, 8);
  }),
  ammo: makeSprite(g => {
    g.fillStyle = "#5a6a3a"; g.fillRect(20, 42, 24, 16);
    g.fillStyle = "#3e4a28"; g.fillRect(20, 42, 24, 4);
    g.fillStyle = "#d8c060";
    for (let i = 0; i < 4; i++) g.fillRect(23 + i * 5, 36, 3, 8);
  }),
  fireball: makeSprite(g => {
    g.fillStyle = "#ff8c1a";
    g.beginPath(); g.ellipse(32, 32, 10, 10, 0, 0, 7); g.fill();
    g.fillStyle = "#ffd24d";
    g.beginPath(); g.ellipse(32, 32, 5, 5, 0, 0, 7); g.fill();
  }),
};

// ---------------------------------------------------------
// Audio. Real files from SFX/ and Doom OST/ when available,
// synthesized WebAudio otherwise.
// ---------------------------------------------------------
let audio = null;
function initAudio() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume();
}
function noiseBuffer(dur) {
  const len = Math.max(1, (audio.sampleRate * dur) | 0);
  const buf = audio.createBuffer(1, len, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

const SFX_FILES = {
  shoot: "dspistol.wav",
  impPain: "dspopain.wav",   pinkyPain: "dsdmpain.wav",
  impDie: "dsbgdth1.wav",    pinkyDie: "dssgtdth.wav",
  impSight: "dsbgsit1.wav",  pinkySight: "dssgtsit.wav",
  impAct: "dsbgact.wav",     pinkyAct: "dsdmact.wav",
  bite: "dssgtatk.wav",
  fireball: "dsfirsht.wav",  fireballHit: "dsfirxpl.wav",
  playerPain: "dsplpain.wav", playerDie: "dspldeth.wav",
  pickup: "dsitemup.wav",
  door: "dsdoropn.wav",      doorClose: "dsdorcls.wav",
  switch: "dsswtchn.wav",    noway: "dsnoway.wav",
};
const sfxLib = {};
for (const [k, f] of Object.entries(SFX_FILES)) {
  const a = new Audio("SFX/" + f);
  a.preload = "auto";
  sfxLib[k] = { el: a, ok: false };
  a.addEventListener("canplaythrough", () => { sfxLib[k].ok = true; }, { once: true });
}
function sfx(kind, vol = 1) {
  const s = sfxLib[kind];
  if (s && s.ok) {
    const c = s.el.cloneNode();
    c.volume = Math.max(0.05, Math.min(1, vol * 0.9));
    c.play().catch(() => {});
    return;
  }
  synthSfx(kind, vol);
}

// synthesized fallbacks (used when the wav files aren't present)
const SYNTH_ALIAS = {
  impPain: "hit", pinkyPain: "hit", bite: "hit",
  impDie: "die", pinkyDie: "die", playerDie: "die",
  playerPain: "pain",
  impSight: "sight", pinkySight: "sight",
  impAct: "growl", pinkyAct: "growl",
  fireballHit: "fireball",
  switch: "pickup", noway: "growl",
};
function synthSfx(kind, vol = 1) {
  if (!audio || audio.state !== "running") return;
  kind = SYNTH_ALIAS[kind] || kind;
  const t = audio.currentTime;
  const master = audio.createGain();
  master.gain.value = Math.max(0.05, Math.min(1, vol));
  master.connect(audio.destination);
  const out = audio.createGain();
  out.connect(master);
  if (kind === "shoot") {
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.25);
    const f = audio.createBiquadFilter(); f.type = "lowpass";
    f.frequency.setValueAtTime(3000, t); f.frequency.exponentialRampToValueAtTime(200, t + 0.22);
    src.connect(f); f.connect(out);
    out.gain.setValueAtTime(0.5, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    src.start(t); src.stop(t + 0.25);
  } else if (kind === "hit") {
    const o = audio.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.15);
    o.connect(out);
    out.gain.setValueAtTime(0.25, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o.start(t); o.stop(t + 0.16);
  } else if (kind === "die") {
    const o = audio.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.5);
    o.connect(out);
    out.gain.setValueAtTime(0.3, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.start(t); o.stop(t + 0.5);
  } else if (kind === "pain") {
    const o = audio.createOscillator(); o.type = "square";
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.2);
    o.connect(out);
    out.gain.setValueAtTime(0.2, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.start(t); o.stop(t + 0.21);
  } else if (kind === "pickup") {
    const o = audio.createOscillator(); o.type = "square";
    o.frequency.setValueAtTime(500, t); o.frequency.setValueAtTime(750, t + 0.07);
    o.connect(out);
    out.gain.setValueAtTime(0.15, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.start(t); o.stop(t + 0.18);
  } else if (kind === "fireball") {
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.3);
    const f = audio.createBiquadFilter(); f.type = "bandpass";
    f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(1800, t + 0.25);
    src.connect(f); f.connect(out);
    out.gain.setValueAtTime(0.2, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    src.start(t); src.stop(t + 0.3);
  } else if (kind === "door") {
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.5);
    const f = audio.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 4;
    f.frequency.setValueAtTime(120, t); f.frequency.exponentialRampToValueAtTime(900, t + 0.45);
    src.connect(f); f.connect(out);
    out.gain.setValueAtTime(0.35, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    src.start(t); src.stop(t + 0.5);
  } else if (kind === "doorClose") {
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.4);
    const f = audio.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 4;
    f.frequency.setValueAtTime(800, t); f.frequency.exponentialRampToValueAtTime(110, t + 0.35);
    src.connect(f); f.connect(out);
    out.gain.setValueAtTime(0.3, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    src.start(t); src.stop(t + 0.4);
    const o = audio.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(90, t + 0.35); o.frequency.exponentialRampToValueAtTime(45, t + 0.5);
    const og = audio.createGain(); og.gain.setValueAtTime(0.0001, t);
    og.gain.setValueAtTime(0.5, t + 0.35); og.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
    o.connect(og); og.connect(master);
    o.start(t); o.stop(t + 0.55);
  } else if (kind === "sight") {
    const o = audio.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(420, t + 0.12);
    o.frequency.exponentialRampToValueAtTime(110, t + 0.35);
    o.connect(out);
    out.gain.setValueAtTime(0.22, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    o.start(t); o.stop(t + 0.4);
  } else if (kind === "growl") {
    const o = audio.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(65, t + 0.3);
    const f = audio.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 400;
    o.connect(f); f.connect(out);
    out.gain.setValueAtTime(0.12, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.start(t); o.stop(t + 0.33);
  }
}

// ---------------------------------------------------------
// Music. Plays the local OST mp3s when present; otherwise an
// original synthesized loop (the id Software tracks are
// copyrighted, so the hosted build ships no music files).
// ---------------------------------------------------------
const OST_DIR = "Doom OST/";
const MUSIC_INTER = "14. E2M3; INTER - Intermission From Doom.mp3";
const MUSIC_VICTORY = "23. VICTOR - The End Of Doom.mp3";
let musicOn = true, musicRealOk = true;
const musicEl = new Audio();
musicEl.loop = true;
musicEl.volume = 0.45;
musicEl.addEventListener("error", () => { musicRealOk = false; });
function playMusic(file) {
  if (!musicRealOk) return;   // synth loop covers it
  musicEl.src = encodeURI(OST_DIR + file);
  musicEl.loop = true;
  if (musicOn) musicEl.play().catch(() => { musicRealOk = false; });
}
function toggleMusic() {
  musicOn = !musicOn;
  if (musicRealOk) {
    if (musicOn) musicEl.play().catch(() => {});
    else musicEl.pause();
  }
}

// synth fallback loop: original A-minor chug, not the OST
let musicGain = null, musicNext = 0, musicStep = 0;
const RIFF = [
  110.00, 110.00, 164.81, 110.00, 98.00, 110.00, 130.81, 110.00,
  110.00, 110.00, 146.83, 130.81, 110.00, 98.00, 82.41, 110.00,
];
function musicScheduleStep(step, t) {
  const freq = RIFF[step];
  if (freq) {
    const o = audio.createOscillator(); o.type = "sawtooth";
    o.frequency.value = freq;
    const o2 = audio.createOscillator(); o2.type = "square";
    o2.frequency.value = freq / 2;
    const f = audio.createBiquadFilter(); f.type = "lowpass";
    f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(300, t + 0.16);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.19);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + 0.2); o2.start(t); o2.stop(t + 0.2);
  }
  if (step % 4 === 0) {
    const o = audio.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.1);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + 0.13);
  }
  if (step % 2 === 1) {
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.03);
    const f = audio.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6000;
    const g = audio.createGain();
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    src.connect(f); f.connect(g); g.connect(musicGain);
    src.start(t); src.stop(t + 0.04);
  }
}
setInterval(() => {
  if (!audio || audio.state !== "running" || !musicOn || musicRealOk || gameState !== "play") { musicNext = 0; return; }
  if (!musicGain) {
    musicGain = audio.createGain();
    musicGain.gain.value = 0.35;
    musicGain.connect(audio.destination);
  }
  if (musicNext < audio.currentTime) { musicNext = audio.currentTime + 0.06; }
  while (musicNext < audio.currentTime + 0.25) {
    musicScheduleStep(musicStep, musicNext);
    musicStep = (musicStep + 1) % 16;
    musicNext += 0.214;   // ~140 bpm eighth notes
  }
}, 90);

// ---------------------------------------------------------
// Game state
// ---------------------------------------------------------
const player = { x: 0, y: 0, ang: 0, hp: 100, ammo: 0, kills: 0, hurtFlash: 0, pickFlash: 0, bob: 0 };
let enemies = [], pickups = [], projectiles = [];
let gameState = "title";   // title | play | intermission | dead | victory
let fireCooldown = 0, muzzle = 0, showMap = false, faceTimer = 0, faceLook = 0;
let totalEnemies = 0;

const ENEMY_TYPES = {
  imp:   { hp: 60,  speed: 1.6, dmg: 12, ranged: true,  idle: "impIdle",   attack: "impAttack",   pain: "impPain",   scale: 1.0,
           sfxSight: "impSight", sfxPain: "impPain", sfxDie: "impDie", sfxAct: "impAct" },
  pinky: { hp: 150, speed: 2.6, dmg: 25, ranged: false, idle: "pinkyIdle", attack: "pinkyAttack", pain: "pinkyPain", scale: 1.15,
           sfxSight: "pinkySight", sfxPain: "pinkyPain", sfxDie: "pinkyDie", sfxAct: "pinkyAct" },
};
function makeEnemy(type, x, y) {
  return {
    type, x, y, ...structuredClone(ENEMY_TYPES[type]),
    state: "idle", stateT: 0, attackT: 0, dead: false,
  };
}
function distToPlayer(x, y) { return Math.hypot(x - player.x, y - player.y); }
function volAt(dist) { return Math.max(0.15, Math.min(1, 1.3 - dist / 12)); }

function loadLevel() {
  const L = LEVELS[levelIdx];
  MAP_W = L.rows[0].length;
  MAP_H = L.rows.length;
  MAP = new Array(MAP_W * MAP_H).fill(0);
  enemies = []; pickups = []; projectiles = [];
  doors.clear();
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const ch = L.rows[y][x];
    if (TILE_CHARS[ch]) { MAP[y * MAP_W + x] = TILE_CHARS[ch]; continue; }
    const cx = x + 0.5, cy = y + 0.5;
    if      (ch === "P") { player.x = cx; player.y = cy; player.ang = 0; }
    else if (ch === "i") enemies.push(makeEnemy("imp", cx, cy));
    else if (ch === "p") enemies.push(makeEnemy("pinky", cx, cy));
    else if (ch === "h") pickups.push({ kind: "medkit", x: cx, y: cy });
    else if (ch === "a") pickups.push({ kind: "ammo", x: cx, y: cy });
  }
  player.kills = 0;
  player.hurtFlash = 0; player.pickFlash = 0;
  totalEnemies = enemies.length;
  fireCooldown = 0; muzzle = 0;
}
function startGame() {
  levelIdx = 0;
  player.hp = 100; player.ammo = 48;
  loadLevel();
  gameState = "play";
  playMusic(LEVELS[levelIdx].music);
}
function exitLevel() {
  sfx("switch");
  gameState = "intermission";
  playMusic(MUSIC_INTER);
}
function nextLevel() {
  levelIdx++;
  if (levelIdx >= LEVELS.length) {
    gameState = "victory";
    playMusic(MUSIC_VICTORY);
    return;
  }
  loadLevel();
  gameState = "play";
  playMusic(LEVELS[levelIdx].music);
}

// ---------------------------------------------------------
// Input
// ---------------------------------------------------------
const keys = {};
addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "KeyM") showMap = !showMap;
  if (e.code === "KeyN") toggleMusic();
  if (e.code === "KeyE") {
    if (gameState === "play") tryUse();
    else if (gameState === "intermission") nextLevel();
  }
  if (e.code === "Space" && gameState === "intermission") nextLevel();
  if (e.code === "KeyR") {
    if (gameState === "dead") {
      player.hp = 100; player.ammo = 48;
      loadLevel();
      gameState = "play";
      playMusic(LEVELS[levelIdx].music);
    } else if (gameState === "victory") {
      startGame();
    }
  }
  if (["Space", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", e => keys[e.code] = false);

canvas.addEventListener("click", () => {
  initAudio();
  if (gameState === "title") { startGame(); overlay.classList.add("hidden"); }
  else if (gameState === "intermission") nextLevel();
  if (document.pointerLockElement !== canvas) canvas.requestPointerLock();
});
overlay.addEventListener("click", () => {
  initAudio();
  startGame();
  overlay.classList.add("hidden");
  canvas.requestPointerLock();
});
addEventListener("mousemove", e => {
  if (document.pointerLockElement === canvas && gameState === "play")
    player.ang += e.movementX * 0.0022;
});
let mouseDown = false;
addEventListener("mousedown", e => { if (e.button === 0) mouseDown = true; });
addEventListener("mouseup",   e => { if (e.button === 0) mouseDown = false; });

// ---------------------------------------------------------
// Helpers
// ---------------------------------------------------------
function hasLOS(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const dist = Math.hypot(dx, dy);
  const steps = Math.ceil(dist * 6);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (solidCell((x0 + dx * t) | 0, (y0 + dy * t) | 0)) return false;
  }
  return true;
}
function moveWithCollision(obj, dx, dy, radius) {
  const nx = obj.x + dx, ny = obj.y + dy;
  if (!solidCell((nx + Math.sign(dx) * radius) | 0, obj.y | 0)) obj.x = nx;
  if (!solidCell(obj.x | 0, (ny + Math.sign(dy) * radius) | 0)) obj.y = ny;
}
function tryUse() {
  const cs = Math.cos(player.ang), sn = Math.sin(player.ang);
  for (const reach of [0.6, 1.1]) {
    const cx = (player.x + cs * reach) | 0, cy = (player.y + sn * reach) | 0;
    const t = mapAt(cx, cy);
    if (t === 9) { exitLevel(); return; }
    if (t === 4) {
      const key = cy * MAP_W + cx;
      let d = doors.get(key);
      if (!d) { d = { open: 0, state: "closed", timer: 0 }; doors.set(key, d); }
      if (d.state === "closed" || d.state === "closing") { d.state = "opening"; sfx("door"); }
      else if (d.state === "open") { d.state = "closing"; sfx("doorClose"); }
      return;
    }
    if (t !== 0) { sfx("noway", 0.6); return; }   // a plain wall blocks the reach
  }
  sfx("noway", 0.4);
}
function updateDoors(dt) {
  for (const [key, d] of doors) {
    if (d.state === "opening") {
      d.open += dt * 1.6;
      if (d.open >= 1) { d.open = 1; d.state = "open"; d.timer = 4; }
    } else if (d.state === "open") {
      d.timer -= dt;
      if (d.timer <= 0) {
        if (cellOccupied(key)) d.timer = 1;
        else {
          d.state = "closing";
          const cx = key % MAP_W + 0.5, cy = ((key / MAP_W) | 0) + 0.5;
          sfx("doorClose", volAt(distToPlayer(cx, cy)));
        }
      }
    } else if (d.state === "closing") {
      if (cellOccupied(key)) { d.state = "opening"; continue; }
      d.open -= dt * 1.6;
      if (d.open <= 0) { d.open = 0; d.state = "closed"; }
    }
  }
}

// ---------------------------------------------------------
// Update
// ---------------------------------------------------------
function update(dt) {
  if (gameState !== "play") return;

  updateDoors(dt);

  // --- player movement ---
  const run = keys["ShiftLeft"] || keys["ShiftRight"] ? 1.7 : 1;
  const speed = 3.2 * run * dt;
  const turn = 2.6 * dt;
  if (keys["ArrowLeft"])  player.ang -= turn;
  if (keys["ArrowRight"]) player.ang += turn;
  let mx = 0, my = 0;
  const cos = Math.cos(player.ang), sin = Math.sin(player.ang);
  if (keys["KeyW"] || keys["ArrowUp"])   { mx += cos; my += sin; }
  if (keys["KeyS"] || keys["ArrowDown"]) { mx -= cos; my -= sin; }
  if (keys["KeyA"]) { mx += sin; my -= cos; }
  if (keys["KeyD"]) { mx -= sin; my += cos; }
  const ml = Math.hypot(mx, my);
  if (ml > 0) {
    moveWithCollision(player, mx / ml * speed, my / ml * speed, 0.25);
    player.bob += dt * 9 * run;
  }

  // --- firing (hitscan pistol) ---
  fireCooldown -= dt;
  muzzle -= dt;
  if ((keys["Space"] || mouseDown) && fireCooldown <= 0) {
    if (player.ammo > 0) {
      player.ammo--; fireCooldown = 0.34; muzzle = 0.08;
      sfx("shoot");
      faceTimer = 0.6;
      let best = null, bestDist = Infinity;
      for (const e of enemies) {
        if (e.dead) continue;
        const dx = e.x - player.x, dy = e.y - player.y;
        const dist = Math.hypot(dx, dy);
        let da = Math.atan2(dy, dx) - player.ang;
        while (da >  Math.PI) da -= 2 * Math.PI;
        while (da < -Math.PI) da += 2 * Math.PI;
        const halfWidth = Math.atan2(0.35, dist);
        if (Math.abs(da) < halfWidth && dist < bestDist && hasLOS(player.x, player.y, e.x, e.y)) {
          best = e; bestDist = dist;
        }
      }
      if (best) {
        best.hp -= 20 + (Math.random() * 14 | 0);
        if (best.hp <= 0) {
          best.state = "dying"; best.stateT = 0;
          sfx(best.sfxDie, volAt(bestDist));
        } else {
          best.state = "pain"; best.stateT = 0;
          sfx(best.sfxPain, volAt(bestDist));
        }
      }
    } else {
      fireCooldown = 0.34;
    }
  }

  // --- enemies ---
  for (const e of enemies) {
    if (e.dead) continue;
    e.stateT += dt;
    if (e.state === "dying") {
      if (e.stateT > 0.45) { e.dead = true; player.kills++; }
      continue;
    }
    if (e.state === "pain") {
      if (e.stateT > 0.3) { e.state = "chase"; e.stateT = 0; }
      continue;
    }
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    const los = dist < 14 && hasLOS(e.x, e.y, player.x, player.y);

    if (e.state === "idle") {
      if (los && dist < 10) { e.state = "chase"; e.stateT = 0; sfx(e.sfxSight, volAt(dist)); }
      continue;
    }
    if (e.state === "attack") {
      if (e.stateT > 0.4) { e.state = "chase"; e.stateT = 0; }
      continue;
    }
    // chase
    e.attackT -= dt;
    if (e.ranged && los && dist > 2.5 && e.attackT <= 0) {
      e.state = "attack"; e.stateT = 0; e.attackT = 1.6 + Math.random();
      const pa = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.12;
      projectiles.push({ x: e.x, y: e.y, vx: Math.cos(pa) * 6, vy: Math.sin(pa) * 6, dmg: e.dmg });
      sfx("fireball", volAt(dist));
    } else if (!e.ranged && dist < 1.1 && e.attackT <= 0) {
      e.state = "attack"; e.stateT = 0; e.attackT = 1.0;
      player.hp -= e.dmg;
      player.hurtFlash = 0.35; faceTimer = 0.8;
      sfx("bite");
      sfx("playerPain", 0.9);
    } else if (dist > (e.ranged ? 3.5 : 0.8)) {
      if (dist < 9 && Math.random() < dt * 0.18) sfx(e.sfxAct, volAt(dist) * 0.7);
      const step = e.speed * dt;
      let vx = dx / dist, vy = dy / dist;
      if (!los) {
        const wob = Math.sin(performance.now() / 400 + e.x * 7) * 0.8;
        const tx = vx * Math.cos(wob) - vy * Math.sin(wob);
        vy = vx * Math.sin(wob) + vy * Math.cos(wob);
        vx = tx;
      }
      moveWithCollision(e, vx * step, vy * step, 0.3);
    }
  }

  // --- projectiles ---
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (solidCell(p.x | 0, p.y | 0)) {
      sfx("fireballHit", volAt(distToPlayer(p.x, p.y)) * 0.8);
      projectiles.splice(i, 1);
      continue;
    }
    if (Math.hypot(p.x - player.x, p.y - player.y) < 0.4) {
      player.hp -= p.dmg;
      player.hurtFlash = 0.35; faceTimer = 0.8;
      sfx("fireballHit");
      sfx("playerPain", 0.9);
      projectiles.splice(i, 1);
    }
  }

  // --- pickups ---
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    if (Math.hypot(p.x - player.x, p.y - player.y) < 0.6) {
      if (p.kind === "medkit") {
        if (player.hp >= 100) continue;
        player.hp = Math.min(100, player.hp + 25);
      } else {
        player.ammo = Math.min(200, player.ammo + 20);
      }
      player.pickFlash = 0.25;
      sfx("pickup");
      pickups.splice(i, 1);
    }
  }

  player.hurtFlash = Math.max(0, player.hurtFlash - dt);
  player.pickFlash = Math.max(0, player.pickFlash - dt);
  faceTimer = Math.max(0, faceTimer - dt);

  if (player.hp <= 0) {
    player.hp = 0;
    gameState = "dead";
    sfx("playerDie");
  }
}

// ---------------------------------------------------------
// Render: walls + floor/ceiling into pixel buffer
// ---------------------------------------------------------
function shade(px, f) {
  if (f >= 1) return px;
  const r = (px & 0xff) * f, g = ((px >> 8) & 0xff) * f, b = ((px >> 16) & 0xff) * f;
  return 0xff000000 | (b << 16) | (g << 8) | r;
}

function renderWorld() {
  const dirX = Math.cos(player.ang), dirY = Math.sin(player.ang);
  const planeX = -dirY * Math.tan(FOV / 2), planeY = dirX * Math.tan(FOV / 2);
  const posX = player.x, posY = player.y;
  const half = VIEW_H / 2;
  const bobOff = (gameState === "play" ? Math.sin(player.bob) * 3 : 0) | 0;
  const horizon = half + bobOff;

  // --- floor & ceiling casting (per row) ---
  const fData = floorTex.data, cData = ceilTex.data;
  for (let y = 0; y < VIEW_H; y++) {
    const isFloor = y > horizon;
    const p = isFloor ? (y - horizon) : (horizon - y);
    if (p <= 0) continue;
    const rowDist = half / p;
    const fog = Math.min(1, 2.4 / rowDist) * 0.8;
    const stepX = rowDist * (2 * planeX) / W;
    const stepY = rowDist * (2 * planeY) / W;
    let fx = posX + rowDist * (dirX - planeX);
    let fy = posY + rowDist * (dirY - planeY);
    const rowBase = y * W;
    const tex = isFloor ? fData : cData;
    for (let x = 0; x < W; x++) {
      const tx = ((fx - Math.floor(fx)) * TEX) | 0;
      const ty = ((fy - Math.floor(fy)) * TEX) | 0;
      fb[rowBase + x] = shade(tex[ty * TEX + tx], fog);
      fx += stepX; fy += stepY;
    }
  }

  // --- walls (DDA per column) ---
  for (let x = 0; x < W; x++) {
    const camX = 2 * x / W - 1;
    const rdX = dirX + planeX * camX;
    const rdY = dirY + planeY * camX;
    let mapX = posX | 0, mapY = posY | 0;
    const dX = Math.abs(1 / rdX), dY = Math.abs(1 / rdY);
    let stepX, stepY, sideX, sideY;
    if (rdX < 0) { stepX = -1; sideX = (posX - mapX) * dX; }
    else         { stepX = 1;  sideX = (mapX + 1 - posX) * dX; }
    if (rdY < 0) { stepY = -1; sideY = (posY - mapY) * dY; }
    else         { stepY = 1;  sideY = (mapY + 1 - posY) * dY; }
    let hit = 0, side = 0, doorShift = 0;
    while (!hit) {
      if (sideX < sideY) { sideX += dX; mapX += stepX; side = 0; }
      else               { sideY += dY; mapY += stepY; side = 1; }
      const t = mapAt(mapX, mapY);
      if (!t) continue;
      if (t === 4) {
        // sliding door: the slab covers [0, 1-open) of the cell face
        const d = doors.get(mapY * MAP_W + mapX);
        const openness = d ? d.open : 0;
        if (openness > 0) {
          const pd = side === 0 ? sideX - dX : sideY - dY;
          let wx = side === 0 ? posY + pd * rdY : posX + pd * rdX;
          wx -= Math.floor(wx);
          if (wx + openness >= 1) continue;   // ray passes through the opening
          doorShift = openness;
        }
      }
      hit = t;
    }
    const perpDist = side === 0 ? sideX - dX : sideY - dY;
    zBuffer[x] = perpDist;

    const lineH = (VIEW_H / perpDist) | 0;
    let drawStart = Math.max(0, (horizon - lineH / 2) | 0);
    let drawEnd = Math.min(VIEW_H - 1, (horizon + lineH / 2) | 0);

    let wallX = side === 0 ? posY + perpDist * rdY : posX + perpDist * rdX;
    wallX -= Math.floor(wallX);
    if (doorShift > 0) wallX = Math.min(0.999, wallX + doorShift);   // texture slides with the door
    let texX = (wallX * TEX) | 0;
    if ((side === 0 && rdX > 0) || (side === 1 && rdY < 0)) texX = TEX - texX - 1;

    const tex = textures[hit] ? textures[hit].data : textures[1].data;
    const step = TEX / lineH;
    let texPos = (drawStart - horizon + lineH / 2) * step;
    let fog = Math.min(1, 3.2 / perpDist);
    if (side === 1) fog *= 0.72;
    for (let y = drawStart; y <= drawEnd; y++) {
      const texY = Math.min(TEX - 1, texPos | 0);
      texPos += step;
      fb[y * W + x] = shade(tex[texY * TEX + texX], fog);
    }
  }

  // --- sprites (enemies, pickups, projectiles), far to near ---
  const items = [];
  for (const e of enemies) {
    if (e.dead) continue;
    let img, hScale = e.scale, sink = 0;
    if (e.state === "dying") {
      img = sprites[e.pain];
      const t = Math.min(1, e.stateT / 0.45);
      hScale = e.scale * (1 - t * 0.8);
      sink = t * 0.5;
    }
    else if (e.state === "attack") img = sprites[e.attack];
    else if (e.state === "pain")   img = sprites[e.pain];
    else                           img = sprites[e.idle];
    items.push({ x: e.x, y: e.y, img, hScale, sink });
  }
  for (const p of pickups)     items.push({ x: p.x, y: p.y, img: sprites[p.kind], hScale: 0.7, sink: 0.18 });
  for (const p of projectiles) items.push({ x: p.x, y: p.y, img: sprites.fireball, hScale: 0.5, sink: 0 });

  const invDet = 1 / (planeX * dirY - dirX * planeY);
  for (const s of items) {
    const sx = s.x - posX, sy = s.y - posY;
    s.tY = invDet * (-planeY * sx + planeX * sy);       // depth in camera space
    s.tX = invDet * (dirY * sx - dirX * sy);
    s.d2 = sx * sx + sy * sy;
  }
  items.sort((a, b) => b.d2 - a.d2);

  for (const s of items) {
    const transX = s.tX, transY = s.tY;
    if (transY <= 0.1) continue;
    const screenX = ((W / 2) * (1 + transX / transY)) | 0;
    const baseH = Math.abs((VIEW_H / transY)) | 0;
    const sprH = (baseH * s.hScale) | 0;
    const sprW = sprH;
    const vShift = ((baseH - sprH) / 2 + s.sink * baseH) | 0;
    const drawStartY = Math.max(0, (horizon - sprH / 2 + vShift) | 0);
    const drawEndY = Math.min(VIEW_H - 1, (horizon + sprH / 2 + vShift) | 0);
    const drawStartX = Math.max(0, (screenX - sprW / 2) | 0);
    const drawEndX = Math.min(W - 1, (screenX + sprW / 2) | 0);
    const fog = Math.min(1, 3.2 / transY);
    for (let x = drawStartX; x <= drawEndX; x++) {
      if (transY >= zBuffer[x]) continue;
      const texX = (((x - (screenX - sprW / 2)) * SPR) / sprW) | 0;
      if (texX < 0 || texX >= SPR) continue;
      for (let y = drawStartY; y <= drawEndY; y++) {
        const texY = (((y - (horizon - sprH / 2 + vShift)) * SPR) / sprH) | 0;
        if (texY < 0 || texY >= SPR) continue;
        const px = s.img[texY * SPR + texX];
        if ((px >>> 24) < 128) continue;
        fb[y * W + x] = shade(px, fog);
      }
    }
  }

  ctx.putImageData(frame, 0, 0);
}

// ---------------------------------------------------------
// Render: weapon, HUD, overlays (canvas 2D on top)
// ---------------------------------------------------------
function renderWeapon() {
  const bobX = Math.sin(player.bob) * 8;
  const bobY = Math.abs(Math.cos(player.bob)) * 6;
  const gx = W / 2 + bobX, gy = VIEW_H + bobY - (muzzle > 0 ? 6 : 0);
  ctx.save();
  ctx.translate(gx, gy);
  if (muzzle > 0) {
    ctx.fillStyle = "rgba(255,220,80,0.9)";
    ctx.beginPath(); ctx.ellipse(0, -86, 22, 30, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,255,200,0.9)";
    ctx.beginPath(); ctx.ellipse(0, -84, 10, 16, 0, 0, 7); ctx.fill();
  }
  ctx.fillStyle = "#23262b";
  ctx.fillRect(-9, -80, 18, 46);
  ctx.fillStyle = "#3a3f46";
  ctx.fillRect(-7, -80, 5, 46);
  ctx.fillStyle = "#2e3238";
  ctx.fillRect(-16, -40, 32, 24);
  ctx.fillStyle = "#41464e";
  ctx.fillRect(-16, -40, 32, 6);
  ctx.fillStyle = "#4a3524";
  ctx.beginPath();
  ctx.moveTo(-12, -16); ctx.lineTo(14, -16); ctx.lineTo(24, 4); ctx.lineTo(-2, 4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c8906a";
  ctx.beginPath(); ctx.ellipse(6, -4, 16, 12, -0.4, 0, 7); ctx.fill();
  ctx.restore();
}

function drawDigits(text, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px 'Courier New', monospace`;
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}

function renderFace(cx, cy) {
  const hp = player.hp;
  const pain = faceTimer > 0;
  ctx.fillStyle = hp > 60 ? "#c8906a" : hp > 30 ? "#c07858" : "#a85a48";
  ctx.fillRect(cx - 16, cy - 20, 32, 40);
  ctx.fillStyle = "#6a4a28";
  ctx.fillRect(cx - 16, cy - 20, 32, 8);
  faceLook = pain ? 0 : Math.sin(performance.now() / 900) * 3;
  ctx.fillStyle = "#fff";
  ctx.fillRect(cx - 11, cy - 8, 9, pain ? 8 : 6);
  ctx.fillRect(cx + 2,  cy - 8, 9, pain ? 8 : 6);
  ctx.fillStyle = "#223";
  ctx.fillRect(cx - 8 + faceLook, cy - 7, 3, pain ? 6 : 4);
  ctx.fillRect(cx + 5 + faceLook, cy - 7, 3, pain ? 6 : 4);
  if (hp <= 60) {
    ctx.strokeStyle = "#3a2a18"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 12, cy - 12); ctx.lineTo(cx - 3, cy - 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 12, cy - 12); ctx.lineTo(cx + 3, cy - 9); ctx.stroke();
  }
  ctx.fillStyle = "#502820";
  if (pain)         ctx.fillRect(cx - 6, cy + 8, 12, 7);
  else if (hp > 60) ctx.fillRect(cx - 8, cy + 10, 16, 3);
  else              { ctx.fillRect(cx - 8, cy + 9, 16, 3); ctx.fillRect(cx - 10, cy + 7, 3, 3); }
  if (hp <= 30) {
    ctx.fillStyle = "#a01010";
    ctx.fillRect(cx - 14, cy - 2, 4, 10);
    ctx.fillRect(cx + 8, cy + 4, 4, 12);
  }
}

function renderHUD() {
  ctx.fillStyle = "#2a2a2a";
  ctx.fillRect(0, VIEW_H, W, HUD_H);
  ctx.fillStyle = "#151515";
  ctx.fillRect(0, VIEW_H, W, 3);
  ctx.strokeStyle = "#111";
  for (const x of [150, 280, 360, 500]) {
    ctx.beginPath(); ctx.moveTo(x, VIEW_H + 6); ctx.lineTo(x, H - 6); ctx.stroke();
  }
  const mid = VIEW_H + HUD_H / 2;
  drawDigits("AMMO", 20, mid - 14, 13, "#888");
  drawDigits(String(player.ammo), 20, mid + 10, 30, "#e03030");
  drawDigits("HEALTH", 170, mid - 14, 13, "#888");
  drawDigits(player.hp + "%", 170, mid + 10, 30, player.hp > 30 ? "#e03030" : "#ff6060");
  renderFace(320, mid);
  drawDigits("KILLS", 380, mid - 14, 13, "#888");
  drawDigits(`${player.kills}/${totalEnemies}`, 380, mid + 10, 30, "#e03030");
  drawDigits("LEVEL", 520, mid - 14, 13, "#888");
  drawDigits(LEVELS[levelIdx] ? LEVELS[levelIdx].name.split(":")[0] : "", 520, mid + 10, 26, "#c8a020");

  // crosshair
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.fillRect(W / 2 - 1, VIEW_H / 2 - 6, 2, 4);
  ctx.fillRect(W / 2 - 1, VIEW_H / 2 + 2, 2, 4);
  ctx.fillRect(W / 2 - 6, VIEW_H / 2 - 1, 4, 2);
  ctx.fillRect(W / 2 + 2, VIEW_H / 2 - 1, 4, 2);
}

function renderMinimap() {
  const s = Math.min(6, ((VIEW_H - 20) / MAP_H) | 0), ox = 10, oy = 10;
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(ox - 2, oy - 2, MAP_W * s + 4, MAP_H * s + 4);
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const t = MAP[y * MAP_W + x];
    if (t) {
      const d = t === 4 ? doorAt(x, y) : null;
      ctx.fillStyle =
        t === 4 ? (d && d.open > 0.8 ? "#4a6a30" : "#c8a020") :
        t === 9 ? "#d02020" : "#8a8a8a";
      ctx.fillRect(ox + x * s, oy + y * s, s - 1, s - 1);
    }
  }
  for (const e of enemies) {
    if (e.dead) continue;
    ctx.fillStyle = e.type === "pinky" ? "#e070a0" : "#c06030";
    ctx.fillRect(ox + e.x * s - 2, oy + e.y * s - 2, 4, 4);
  }
  ctx.fillStyle = "#30d030";
  ctx.beginPath();
  ctx.arc(ox + player.x * s, oy + player.y * s, 3, 0, 7);
  ctx.fill();
  ctx.strokeStyle = "#30d030";
  ctx.beginPath();
  ctx.moveTo(ox + player.x * s, oy + player.y * s);
  ctx.lineTo(ox + (player.x + Math.cos(player.ang) * 2) * s, oy + (player.y + Math.sin(player.ang) * 2) * s);
  ctx.stroke();
  ctx.font = "bold 12px 'Courier New', monospace";
  ctx.fillStyle = "#ddd";
  ctx.fillText(LEVELS[levelIdx].name, ox, oy + MAP_H * s + 14);
}

function renderOverlays() {
  if (player.hurtFlash > 0) {
    ctx.fillStyle = `rgba(200,0,0,${player.hurtFlash * 0.9})`;
    ctx.fillRect(0, 0, W, VIEW_H);
  }
  if (player.pickFlash > 0) {
    ctx.fillStyle = `rgba(220,200,60,${player.pickFlash * 0.5})`;
    ctx.fillRect(0, 0, W, VIEW_H);
  }
  if (gameState === "play") return;

  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  if (gameState === "dead") {
    ctx.font = "bold 52px 'Courier New', monospace";
    ctx.fillStyle = "#d01010";
    ctx.fillText("YOU DIED", W / 2, H / 2 - 30);
    ctx.font = "bold 20px 'Courier New', monospace";
    ctx.fillStyle = "#ccc";
    ctx.fillText(LEVELS[levelIdx].name, W / 2, H / 2 + 10);
    ctx.fillText("PRESS R TO RESTART LEVEL", W / 2, H / 2 + 42);
  } else if (gameState === "intermission") {
    ctx.font = "bold 36px 'Courier New', monospace";
    ctx.fillStyle = "#e0a020";
    ctx.fillText(LEVELS[levelIdx].name + " FINISHED", W / 2, H / 2 - 60);
    ctx.font = "bold 22px 'Courier New', monospace";
    ctx.fillStyle = "#ccc";
    ctx.fillText(`KILLS: ${player.kills} / ${totalEnemies}`, W / 2, H / 2 - 10);
    ctx.fillText(`ITEMS LEFT: ${pickups.length}`, W / 2, H / 2 + 22);
    ctx.fillStyle = "#e0a020";
    ctx.fillText(levelIdx + 1 < LEVELS.length
      ? "PRESS SPACE FOR " + LEVELS[levelIdx + 1].name
      : "PRESS SPACE TO FINISH", W / 2, H / 2 + 70);
  } else if (gameState === "victory") {
    ctx.font = "bold 44px 'Courier New', monospace";
    ctx.fillStyle = "#e0a020";
    ctx.fillText("YOU WIN", W / 2, H / 2 - 40);
    ctx.font = "bold 20px 'Courier New', monospace";
    ctx.fillStyle = "#ccc";
    ctx.fillText("KNEE-DEEP HOMAGE COMPLETE", W / 2, H / 2 + 5);
    ctx.fillText("PRESS R TO PLAY AGAIN", W / 2, H / 2 + 40);
  }
  ctx.textAlign = "left";
}

// ---------------------------------------------------------
// Main loop
// ---------------------------------------------------------
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (gameState !== "title") {
    update(dt);
    renderWorld();
    if (gameState === "play") renderWeapon();
    renderHUD();
    if (showMap) renderMinimap();
    renderOverlays();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
