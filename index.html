<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DOOM.html</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #game {
    display: block;
    width: 100vw; height: 100vh;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
  }
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85);
    color: #d00; text-align: center;
    user-select: none;
  }
  #overlay h1 { font-size: 64px; margin: 0 0 10px; letter-spacing: 8px; text-shadow: 4px 4px 0 #400; }
  #overlay p  { color: #aaa; font-size: 18px; line-height: 1.8; }
  #overlay .key { color: #fc0; }
  #overlay.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game" width="640" height="400"></canvas>
<div id="overlay">
  <h1>DOOM</h1>
  <p>
    <span class="key">CLICK</span> to enter the map (locks mouse)<br>
    <span class="key">WASD</span> move &nbsp; <span class="key">MOUSE / ARROWS</span> turn &nbsp; <span class="key">SHIFT</span> run<br>
    <span class="key">CLICK / SPACE</span> fire &nbsp; <span class="key">E</span> use doors / switches &nbsp; <span class="key">M</span> map<br>
    <span class="key">N</span> music on/off &nbsp; <span class="key">R</span> restart<br><br>
    Three levels. Find the exit switch in each.
  </p>
</div>

// ============================================================

let MAP = [], MAP_W = 0, MAP_H = 0, levelIdx = 0;
const mapAt = (x, y) => (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) ? 1 : MAP[y * MAP_W + x];

// Doors: any tile 4 can be opened with E. Keyed by cell index.
const doors = new Map();
function doorAt(cx, cy) { return doors.get(cy * MAP_W + cx); }
function solidCell(cx, cy) {
  const t = mapAt(cx, cy);
  if (t === 0) return false;
  if (DOOR_TILES.has(t)) {
    const d = doorAt(cx, cy);
    return !(d && d.open > 0.8);
  }
  return true;
}
function cellOccupied(key) {
  const cx = key % MAP_W, cy = (key / MAP_W) | 0;
  if ((player.x | 0) === cx && (player.y | 0) === cy) return true;
  return enemies.some(e => !e.dead && (e.x | 0) === cx && (e.y | 0) === cy);
}

  const c = document.createElement("canvas");
  c.width = c.height = TEX;
  const g = c.getContext("2d");
  draw(g);
  return { data: new Uint32Array(g.getImageData(0, 0, TEX, TEX).data.buffer), canvas: c };
}

    g.fillRect(Math.random() * TEX | 0, Math.random() * TEX | 0, 2, 2);
  }
}

const SPR = 64;
// Background keying, tolerant of JPEG noise. Handles: transparent

// and checkerboard "transparency" patterns baked into JPGs — every
// background shade is sampled around the image border, so banded
// checkers key out too without touching interior grays.
function buildBgKeyer(d, w, h) {
  const near = (r, g, b, k) => Math.abs(r - k[0]) < 26 && Math.abs(g - k[1]) < 26 && Math.abs(b - k[2]) < 26;
  const bgKeys = [];
  if (d[3] > 200) {
    bgKeys.push([d[0], d[1], d[2]]);
    const base = bgKeys[0];
    if (Math.max(base[0], base[1], base[2]) - Math.min(base[0], base[1], base[2]) < 16) {
      const sample = (x, y) => {
        const i = (y * w + x) * 4;
        if (d[i + 3] < 200 || bgKeys.length >= 12) return;
        const r = d[i], g2 = d[i + 1], b2 = d[i + 2];
        if (Math.max(r, g2, b2) - Math.min(r, g2, b2) >= 16) return;   // only desaturated shades
        if (!bgKeys.some(k => near(r, g2, b2, k))) bgKeys.push([r, g2, b2]);
      };
      for (let x = 0; x < w; x += 3) { sample(x, 0); sample(x, h - 1); }
      for (let y = 0; y < h; y += 3) { sample(0, y); sample(w - 1, y); }
    }
  }
  const shadowRule = bgKeys.length === 1 && bgKeys[0][0] + bgKeys[0][1] + bgKeys[0][2] > 600;
  return (r, g, b) => {
    if (!bgKeys.length) return false;
    if (bgKeys.some(k => near(r, g, b, k))) return true;
    if (shadowRule) {   // light desaturated gray = drop shadow on white art
      const mx = Math.max(r, g, b), mn = Math.min(r, g, b);

const SHEET_MAP = [];   // every monster now uses the player's own art
function sliceSheet(img) {
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  let data;
  try { data = g.getImageData(0, 0, c.width, c.height); } catch { return null; }
  const d = data.data, w = c.width, h = c.height;
  const isBg = buildBgKeyer(d, w, h);
  const solid = (x, y) => {
    const i = (y * w + x) * 4;
    if (d[i + 3] < 128) return false;
    return !isBg(d[i], d[i + 1], d[i + 2]);
  };
  const rowSolid = new Array(h).fill(false);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (solid(x, y)) { rowSolid[y] = true; break; }
  const bands = [];
  for (let y = 0; y < h; y++) if (rowSolid[y]) {
    if (!bands.length || !rowSolid[y - 1]) bands.push({ y0: y, y1: y });
    bands[bands.length - 1].y1 = y;
  }
  if (!bands.length) return null;
  const band = bands[0];   // first band: front-facing frames
  const colSolid = new Array(w).fill(false);
  for (let x = 0; x < w; x++) for (let y = band.y0; y <= band.y1; y++) if (solid(x, y)) { colSolid[x] = true; break; }
  const cells = [];
  for (let x = 0; x < w; x++) if (colSolid[x]) {
    if (!cells.length || !colSolid[x - 1]) cells.push({ x0: x, x1: x });
    cells[cells.length - 1].x1 = x;
  }
  return cells.filter(cl => cl.x1 - cl.x0 > 4).map(cl => {
    // trim each cell vertically to its own content so short sprites
    // (e.g. corpses) still sit on the floor
    let cy0 = band.y1, cy1 = band.y0;
    for (let y = band.y0; y <= band.y1; y++)
      for (let x = cl.x0; x <= cl.x1; x++)
        if (solid(x, y)) {
          if (y < cy0) cy0 = y;
          if (y > cy1) cy1 = y;
          break;
        }
    if (cy1 < cy0) { cy0 = band.y0; cy1 = band.y1; }
    const cw = cl.x1 - cl.x0 + 1, ch = cy1 - cy0 + 1;
    const oc = document.createElement("canvas");
    oc.width = oc.height = SPR;
    const og = oc.getContext("2d");
    og.imageSmoothingEnabled = false;
    const sc = Math.min(SPR / cw, SPR / ch);
    og.drawImage(c, cl.x0, cy0, cw, ch, (SPR - cw * sc) / 2, SPR - ch * sc, cw * sc, ch * sc);
    const od = og.getImageData(0, 0, SPR, SPR);
    const p = od.data;
    for (let i = 0; i < p.length; i += 4)
      if (p[i + 3] > 0 && isBg(p[i], p[i + 1], p[i + 2])) p[i + 3] = 0;
    return new Uint32Array(od.data.buffer);
  });
}

// Component-based slicing for custom art: flood-fills each sprite as
// its own blob, so frames may overlap in rows or columns. Small
// fragments (blood spray etc.) merge into the nearest large sprite.
// Returns frames sorted left-to-right.
function sliceComponents(img) {
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  let data;
  try { data = g.getImageData(0, 0, c.width, c.height); } catch { return null; }
  const d = data.data, w = c.width, h = c.height;
  const isBg = buildBgKeyer(d, w, h);
  const solid = i => d[i * 4 + 3] >= 128 && !isBg(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]);
  const seen = new Uint8Array(w * h);
  let comps = [];
  for (let start = 0; start < w * h; start++) {
    if (seen[start] || !solid(start)) continue;
    let x0 = start % w, x1 = x0, y0 = (start / w) | 0, y1 = y0, area = 0;
    const q = [start];
    seen[start] = 1;
    while (q.length) {
      const i = q.pop();
      const cx = i % w, cy = (i / w) | 0;
      area++;
      if (cx < x0) x0 = cx; if (cx > x1) x1 = cx;
      if (cy < y0) y0 = cy; if (cy > y1) y1 = cy;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const ni = ny * w + nx;
        if (!seen[ni] && solid(ni)) { seen[ni] = 1; q.push(ni); }
      }
    }
    comps.push({ x0, x1, y0, y1, area });
  }
  if (!comps.length) return null;
  // merge small fragments into overlapping/nearby large components
  const bigArea = Math.max(...comps.map(cp => cp.area));
  const pad = 14;
  let merged = true;
  while (merged) {
    merged = false;
    outer:
    for (let i = 0; i < comps.length; i++) for (let j = 0; j < comps.length; j++) {
      if (i === j) continue;
      const a = comps[i], b = comps[j];
      if (b.area >= bigArea * 0.08) continue;   // only fragments get absorbed
      if (a.x0 - pad < b.x1 && b.x0 - pad < a.x1 && a.y0 - pad < b.y1 && b.y0 - pad < a.y1) {
        a.x0 = Math.min(a.x0, b.x0); a.x1 = Math.max(a.x1, b.x1);
        a.y0 = Math.min(a.y0, b.y0); a.y1 = Math.max(a.y1, b.y1);
        a.area += b.area;
        comps.splice(j, 1);
        merged = true;
        break outer;
      }
    }
  }
  comps = comps.filter(cp => cp.area > 300)
               .sort((a, b) => (a.x0 + a.x1) - (b.x0 + b.x1))
               .slice(0, 4);
  return comps.map(cp => {
    const cw = cp.x1 - cp.x0 + 1, ch = cp.y1 - cp.y0 + 1;
    const oc = document.createElement("canvas");
    oc.width = oc.height = SPR;
    const og = oc.getContext("2d");
    og.imageSmoothingEnabled = false;
    const sc = Math.min(SPR / cw, SPR / ch);
    og.drawImage(c, cp.x0, cp.y0, cw, ch, (SPR - cw * sc) / 2, SPR - ch * sc, cw * sc, ch * sc);
    const od = og.getImageData(0, 0, SPR, SPR);
    const p = od.data;
    for (let i = 0; i < p.length; i += 4)
      if (p[i + 3] > 0 && isBg(p[i], p[i + 1], p[i + 2])) p[i + 3] = 0;
    return new Uint32Array(od.data.buffer);
  });
}

// Key out a weapon frame's background: find the dominant opaque color
// around the frame border and clear everything near it. Works whether
// the corner pixel is transparent or not; frames with genuinely
// transparent backgrounds are left untouched.
function keyOutGunFrame(g, w, h) {
  try {
    const d = g.getImageData(0, 0, w, h);
    const p = d.data;
    // histogram over all opaque pixels; per color bucket track count,
    // border presence, mean color, and bounding box
    const buckets = new Map();
    let opaque = 0, borderOpaque = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const j = (y * w + x) * 4;
      if (p[j + 3] < 200) continue;
      opaque++;
      const border = x === 0 || y === 0 || x === w - 1 || y === h - 1;
      if (border) borderOpaque++;
      const q = ((p[j] >> 4) << 8) | ((p[j + 1] >> 4) << 4) | (p[j + 2] >> 4);
      let e = buckets.get(q);
      if (!e) { e = { n: 0, b: 0, sr: 0, sg: 0, sb: 0, x0: x, x1: x, y0: y, y1: y }; buckets.set(q, e); }
      e.n++;
      if (border) e.b++;
      e.sr += p[j]; e.sg += p[j + 1]; e.sb += p[j + 2];
      if (x < e.x0) e.x0 = x; if (x > e.x1) e.x1 = x;
      if (y < e.y0) e.y0 = y; if (y > e.y1) e.y1 = y;
    }
    if (!opaque) return;
    // background = color dominating the border, OR a large flat color
    // filling its own bounding box like a backdrop rectangle (shaded
    // gun pixels are scattered, so they never satisfy the density bar)
    let bg = null;
    for (const e of buckets.values()) {
      const density = e.n / ((e.x1 - e.x0 + 1) * (e.y1 - e.y0 + 1));
      const mr = e.sr / e.n, mg = e.sg / e.n, mb = e.sb / e.n;
      const dark = Math.max(mr, mg, mb) < 52;
      const borderDominant = borderOpaque > 20 && e.b >= borderOpaque * 0.4;
      const solidBox = e.n >= opaque * 0.25 && density >= (dark ? 0.8 : 0.55);
      if ((borderDominant || solidBox) && (!bg || e.n > bg.n)) bg = { mr, mg, mb, n: e.n };
    }
    if (!bg) return;
    for (let j = 0; j < p.length; j += 4)
      if (p[j + 3] > 0 && Math.abs(p[j] - bg.mr) < 16 && Math.abs(p[j + 1] - bg.mg) < 16 && Math.abs(p[j + 2] - bg.mb) < 16)
        p[j + 3] = 0;
    g.putImageData(d, 0, 0);
  } catch {}   // file://: pixels unreadable, draw the frame as-is
}

// Full GIF firing animations via ImageDecoder (Chromium; needs http).
// Frame 0 is treated as the rest pose; the remaining frames play with
// their own GIF timings each time the weapon fires. Falls back to the
// two-frame idle/fire swap when unavailable.
async function loadGunAnim(file, slot) {
  if (!window.ImageDecoder) return;
  try {
    const resp = await fetch("Guns/gifs/" + file);
    if (!resp.ok) return;
    const dec = new ImageDecoder({ data: await resp.arrayBuffer(), type: "image/gif" });
    await dec.tracks.ready;
    const count = dec.tracks.selectedTrack.frameCount;
    if (count < 2) return;
    const frames = [], durs = [];
    for (let i = 0; i < count; i++) {
      const { image } = await dec.decode({ frameIndex: i });
      const c = document.createElement("canvas");
      c.width = image.displayWidth; c.height = image.displayHeight;
      const g = c.getContext("2d");
      g.drawImage(image, 0, 0);
      keyOutGunFrame(g, c.width, c.height);
      frames.push(c);
      durs.push(image.duration ? Math.max(0.03, image.duration / 1e6) : 0.1);
      image.close();
    }
    if (gunArt[slot].custom) return;   // player-made art wins
    gunArt[slot].frames = frames;
    gunArt[slot].durs = durs;
    gunArt[slot].fireTotal = durs.slice(1).reduce((a, b) => a + b, 0);
    gunArt[slot].idle = frames[0];
  } catch {}
}

function loadMyGun(cfg) {
  const img = new Image();
  img.onload = () => {
    const art = gunArt[cfg.slot];
    art.custom = true;
    if (cfg.mode === "single") {
      const c = document.createElement("canvas");
      c.width = img.width; c.height = img.height;
      const g = c.getContext("2d");
      g.drawImage(img, 0, 0);
      keyOutGunFrame(g, c.width, c.height);
      art[cfg.use] = c;
      art.frames = null;
      return;
    }
    const usableH = img.height * (1 - (cfg.capBottom || 0));
    const cw = img.width / cfg.cols, ch = usableH / cfg.rows;
    const inset = cfg.inset || 0;
    const cells = [];
    for (let r = 0; r < cfg.rows; r++) for (let col = 0; col < cfg.cols; col++) {
      const c = document.createElement("canvas");
      const sw = cw * (1 - inset * 2), sh = ch * (1 - inset * 2);
      c.width = Math.max(1, Math.round(sw));
      c.height = Math.max(1, Math.round(sh));
      const g = c.getContext("2d");
      g.drawImage(img, col * cw + cw * inset, r * ch + ch * inset, sw, sh, 0, 0, c.width, c.height);
      keyOutGunFrame(g, c.width, c.height);
      cells.push(c);
    }
    const frames = [cells[cfg.idle], ...cfg.fire.filter(i => i < cells.length).map(i => cells[i])];
    art.frames = frames;
    art.durs = frames.map((_, i) => i === 0 ? 0.1 : 0.07);
    art.fireTotal = art.durs.slice(1).reduce((a, b) => a + b, 0);
    art.idle = frames[0];
    art.fire = null;
  };
  img.onerror = () => {};
  img.src = "Guns/My Guns/" + cfg.file;
}

function synthSfx(kind, vol = 1) {

    const f = audio.createBiquadFilter(); f.type = "lowpass";

    src.connect(f); f.connect(out);
    out.gain.setValueAtTime(0.5, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    src.start(t); src.stop(t + 0.25);

    const o = audio.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.15);

    o.connect(out);

    o.start(t); o.stop(t + 0.21);

    const f = audio.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 4;
    f.frequency.setValueAtTime(120, t); f.frequency.exponentialRampToValueAtTime(900, t + 0.45);

  } else if (kind === "doorClose") {
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.4);

    src.connect(f); f.connect(out);

// Synth fallback music: original compositions, not the id tracks
// (those are copyrighted). In-game: a driving A-minor chug.
// Title / pause: a slow, ominous low drone.
let musicGain = null, musicNext = 0, musicStep = 0, musicSlow = false;
const RIFF_PLAY = [
  110.00, 110.00, 164.81, 110.00, 98.00, 110.00, 130.81, 110.00,
  110.00, 110.00, 146.83, 130.81, 110.00, 98.00, 82.41, 110.00,
];
const RIFF_TITLE = [   // sparse A1 drone leaning on tritone/minor colors
  55.00, 0, 0, 82.41, 0, 55.00, 77.78, 0,
  55.00, 0, 0, 87.31, 0, 55.00, 65.41, 0,
];
function musicScheduleStep(step, t, slow) {
  const freq = (slow ? RIFF_TITLE : RIFF_PLAY)[step];
  if (freq) {
    const o = audio.createOscillator(); o.type = "sawtooth";
    o.frequency.value = freq;
    const o2 = audio.createOscillator();
    o2.type = slow ? "triangle" : "square";
    o2.frequency.value = slow ? freq * 2 : freq / 2;
    const f = audio.createBiquadFilter(); f.type = "lowpass";
    const dur = slow ? 0.95 : 0.19;
    f.frequency.setValueAtTime(slow ? 500 : 900, t);
    f.frequency.exponentialRampToValueAtTime(slow ? 170 : 300, t + dur * 0.85);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(slow ? 0.42 : 0.5, t + (slow ? 0.09 : 0.006));
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05); o2.start(t); o2.stop(t + dur + 0.05);
  }
  if (!slow && step % 4 === 0) {   // kick on quarters (gameplay only)
    const o = audio.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.1);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + 0.13);
  }
  if (slow && step === 0) {   // deep distant boom once per bar on the title
    const o = audio.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.7);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + 0.85);
  }
  if (!slow && step % 2 === 1) {   // hats on the offbeats (gameplay only)
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.03);
    const f = audio.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6000;
    const g = audio.createGain();
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    src.connect(f); f.connect(g); g.connect(musicGain);
    src.start(t); src.stop(t + 0.04);
  }
}

  const wantsMusic = gameState === "play" || gameState === "title" || gameState === "paused";
  if (!audio || audio.state !== "running" || !musicOn || musicRealOk || !wantsMusic) { musicNext = 0; return; }
  if (!musicGain) {
    musicGain = audio.createGain();
    musicGain.gain.value = 0.35;
    musicGain.connect(audio.destination);
  }
  const slow = gameState !== "play";
  if (slow !== musicSlow || musicNext < audio.currentTime) {   // mode change or drift: resync
    musicSlow = slow;
    musicStep = 0;
    musicNext = audio.currentTime + 0.06;
  }
  const stepDur = slow ? 0.42 : 0.214;   // ~70 vs ~140 bpm feel
  while (musicNext < audio.currentTime + 0.3) {
    musicScheduleStep(musicStep, musicNext, slow);
    musicStep = (musicStep + 1) % 16;
    musicNext += stepDur;
  }
}, 90);

    else if (ch === "m") enemies.push(makeEnemy("lostsoul", cx, cy));

function hasLOS(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const dist = Math.hypot(dx, dy);
  const steps = Math.ceil(dist * 6);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (solidCell((x0 + dx * t) | 0, (y0 + dy * t) | 0)) return false;
  }
  return true;
}
function moveWithCollision(obj, dx, dy, radius) {
  const nx = obj.x + dx, ny = obj.y + dy;
  if (!solidCell((nx + Math.sign(dx) * radius) | 0, obj.y | 0)) obj.x = nx;
  if (!solidCell(obj.x | 0, (ny + Math.sign(dy) * radius) | 0)) obj.y = ny;

function tryUse() {
  const cs = Math.cos(player.ang), sn = Math.sin(player.ang);
  for (const reach of [0.6, 1.1]) {
    const cx = (player.x + cs * reach) | 0, cy = (player.y + sn * reach) | 0;
    const t = mapAt(cx, cy);
    if (t === 9)  { exitLevel(false); return; }
    if (t === 10) { showMsg("YOU FOUND A SECRET EXIT!"); exitLevel(true); return; }
    if (DOOR_TILES.has(t)) {
      const lock = DOOR_LOCKS[t];
      if (lock && !player.keys[lock]) {
        showMsg("YOU NEED THE " + lock.toUpperCase() + " KEYCARD");
        sfx("noway", 0.7);
        return;
      }
      const key = cy * MAP_W + cx;
      let d = doors.get(key);
      if (!d) { d = { open: 0, state: "closed", timer: 0 }; doors.set(key, d); }
      if (d.state === "closed" || d.state === "closing") {
        if (t === 14) showMsg("A SECRET DOOR GRINDS OPEN...");
        d.state = "opening"; sfx("door");
      } else if (d.state === "open") { d.state = "closing"; sfx("doorClose"); }
      return;
    }
    if (t !== 0) { sfx("noway", 0.6); return; }   // a plain wall blocks the reach
  }
  sfx("noway", 0.4);
}
function updateDoors(dt) {
  for (const [key, d] of doors) {
    if (d.state === "opening") {
      d.open += dt * 1.6;
      if (d.open >= 1) { d.open = 1; d.state = "open"; d.timer = 4; }
    } else if (d.state === "open") {
      d.timer -= dt;
      if (d.timer <= 0) {
        if (cellOccupied(key)) d.timer = 1;
        else {
          d.state = "closing";
          const cx = key % MAP_W + 0.5, cy = ((key / MAP_W) | 0) + 0.5;
          sfx("doorClose", volAt(distToPlayer(cx, cy)));
        }
      }
    } else if (d.state === "closing") {
      if (cellOccupied(key)) { d.state = "opening"; continue; }
      d.open -= dt * 1.6;
      if (d.open <= 0) { d.open = 0; d.state = "closed"; }
    }
  }
}

function damageEnemy(e, amt, dist) {
  if (e.dead || e.state === "dying" || amt <= 0) return;
  e.hp -= amt;
  if (e.hp <= 0) { e.state = "dying"; e.stateT = 0; sfx(e.sfxDie, volAt(dist)); }
  else { e.state = "pain"; e.stateT = 0; sfx(e.sfxPain, volAt(dist)); }
}

  for (const b of barrels) if (b.fuse < 0) targets.push({ o: b, r: 0.3, isBarrel: true });

}
function hurtTarget(tgt, dmg, dist) {

    tgt.o.hp -= dmg;

    const dist = Math.hypot(dx, dy);
    let da = Math.atan2(dy, dx) - player.ang;
    while (da >  Math.PI) da -= 2 * Math.PI;

    const dist = Math.hypot(dx, dy);
    let da = Math.atan2(dy, dx) - ang;
    while (da >  Math.PI) da -= 2 * Math.PI;
    while (da < -Math.PI) da += 2 * Math.PI;

    const d = Math.hypot(e.x - x, e.y - y);
    if (d < radius) damageEnemy(e, (dmg * (1 - d / radius)) | 0, distToPlayer(e.x, e.y));
  }
  for (const b of barrels)
    if (b.fuse < 0 && Math.hypot(b.x - x, b.y - y) < radius) b.fuse = 0.1 + Math.random() * 0.1;
  if (hurtSelf) {
    const pd = distToPlayer(x, y);
    if (pd < radius * 0.8) {
      player.hp -= (dmg * 0.5 * (1 - pd / (radius * 0.8))) | 0;

  const pd = distToPlayer(b.x, b.y);

  if (pd < 2.2) {
    player.hp -= (50 * (1 - pd / 2.2)) | 0;
    player.hurtFlash = 0.4; faceTimer = 0.8;
    sfx("playerPain", 0.9);
  }
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - b.x, e.y - b.y);
    if (d < 2.2) damageEnemy(e, (90 * (1 - d / 2.2)) | 0, distToPlayer(e.x, e.y));
  }
  for (const ob of barrels) {   // chain reaction
    if (ob !== b && ob.fuse < 0 && Math.hypot(ob.x - b.x, ob.y - b.y) < 1.8)
      ob.fuse = 0.12 + Math.random() * 0.15;
  }
}

// ---------------------------------------------------------
// Update
// ---------------------------------------------------------
function update(dt) {
  if (gameState !== "play") return;

  updateDoors(dt);

  // --- player movement ---
  const run = keys["ShiftLeft"] || keys["ShiftRight"] ? 1.7 : 1;
  const speed = 3.2 * run * dt;
  const turn = 2.6 * dt;
  if (keys["ArrowLeft"])  player.ang -= turn;
  if (keys["ArrowRight"]) player.ang += turn;
  let mx = 0, my = 0;
  const cos = Math.cos(player.ang), sin = Math.sin(player.ang);
  if (keys["KeyW"] || keys["ArrowUp"])   { mx += cos; my += sin; }
  if (keys["KeyS"] || keys["ArrowDown"]) { mx -= cos; my -= sin; }
  if (keys["KeyA"]) { mx += sin; my -= cos; }
  if (keys["KeyD"]) { mx -= sin; my += cos; }
  const ml = Math.hypot(mx, my);
  if (ml > 0) {
    moveWithCollision(player, mx / ml * speed, my / ml * speed, 0.25);
    player.bob += dt * 9 * run;
  }

  // --- firing ---
  fireCooldown -= dt;
  muzzle -= dt;
  gunFireT += dt;
  if ((keys["Space"] || mouseDown) && fireCooldown <= 0) {
    const wp = WEAPONS[player.weapon];
    const cost = wp.use || 0;
    if (!wp.ammoType || player.ammo[wp.ammoType] >= cost) {
      if (wp.ammoType) player.ammo[wp.ammoType] -= cost;
      fireCooldown = wp.rate; muzzle = 0.08; faceTimer = 0.6;
      gunFireT = 0;
      sfx(wp.sfx);
      if (wp.name === "SHOTGUN") setTimeout(() => sfx("sgcock", 0.8), 550);
      if (wp.melee) {
        const tgt = nearestTarget(1.4, 0.6);
        if (tgt) hurtTarget(tgt, wp.dmg + (Math.random() * wp.rnd | 0));
      } else if (wp.proj) {
        pProjectiles.push({
          x: player.x + Math.cos(player.ang) * 0.4,
          y: player.y + Math.sin(player.ang) * 0.4,
          vx: Math.cos(player.ang) * wp.pspeed,
          vy: Math.sin(player.ang) * wp.pspeed,
          wp,
        });
      } else {
        const shots = wp.pellets || 1;
        for (let s = 0; s < shots; s++)
          hitscanShot((wp.spread || 0.015) * (Math.random() * 2 - 1), wp.dmg + (Math.random() * wp.rnd | 0));
      }
    } else {
      fireCooldown = 0.3;
      sfx("noway", 0.25);
    }
  }

  // --- player projectiles ---
  for (let i = pProjectiles.length - 1; i >= 0; i--) {
    const p = pProjectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    let hit = solidCell(p.x | 0, p.y | 0);
    let victim = null;
    if (!hit) {
      for (const tgt of collectTargets()) {
        if (Math.hypot(tgt.o.x - p.x, tgt.o.y - p.y) < tgt.r + 0.15) { victim = tgt; hit = true; break; }
      }
    }
    if (!hit) continue;
    if (victim) hurtTarget(victim, p.wp.dmg + (Math.random() * p.wp.rnd | 0));
    if (p.wp.splash) {
      sfx("rocketHit", volAt(distToPlayer(p.x, p.y)));
      explodeAt(p.x, p.y, p.wp.splash, p.wp.splashDmg, p.wp.name === "ROCKET LAUNCHER");
    } else {
      sfx("fireballHit", volAt(distToPlayer(p.x, p.y)) * 0.6);
      effects.push({ x: p.x, y: p.y, t: 0.2, kind: "puff" });
    }
    pProjectiles.splice(i, 1);
  }

  // --- barrels & effects ---
  for (const b of barrels) {
    if (b.fuse >= 0) {
      b.fuse -= dt;
      if (b.fuse <= 0 && !b.boomed) { b.boomed = true; explodeBarrel(b); }
    }
  }
  barrels = barrels.filter(b => !b.boomed);
  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].t += dt;
    if (effects[i].t > 0.45) effects.splice(i, 1);
  }

  // --- liquid floors & teleporters ---
  const floorType = floorMap[(player.y | 0) * MAP_W + (player.x | 0)];
  if (floorType === 2) {
    nukeTimer -= dt;
    if (nukeTimer <= 0) {
      nukeTimer = 0.7;
      player.hp -= 5;
      player.hurtFlash = Math.max(player.hurtFlash, 0.2);
      faceTimer = 0.5;
      sfx("playerPain", 0.5);
    }
  } else nukeTimer = 0.2;
  teleCooldown -= dt;
  if (teleCooldown <= 0) {
    for (const tp of teleports) {
      if ((player.x | 0) === tp.x && (player.y | 0) === tp.y) {
        effects.push({ x: player.x, y: player.y, t: 0, kind: "telefog" });
        player.x = tp.dx + 0.5; player.y = tp.dy + 0.5;
        effects.push({ x: player.x, y: player.y, t: 0, kind: "telefog" });
        teleCooldown = 1.2;
        player.pickFlash = 0.3;
        sfx("teleport");
        break;
      }
    }
  }
  msgT = Math.max(0, msgT - dt);

  // --- enemies ---
  for (const e of enemies) {
    if (e.dead) continue;
    e.stateT += dt;
    if (e.state === "dying") {
      if (e.stateT > 0.45) {
        e.dead = true; player.kills++;
        if (e.corpse && sprites[e.corpse]) decors.push({ x: e.x, y: e.y, spr: e.corpse });
        const drop = ENEMY_DROPS[e.type];
        if (drop && Math.random() < drop.chance)
          pickups.push({ kind: "ammo", spr: drop.spr, give: drop.give, x: e.x, y: e.y });
      }
      continue;
    }
    if (e.state === "pain") {
      if (e.stateT > 0.3) { e.state = "chase"; e.stateT = 0; }
      continue;
    }
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    const los = dist < 14 && hasLOS(e.x, e.y, player.x, player.y);

    if (e.state === "idle") {
      if (los && dist < 10) { e.state = "chase"; e.stateT = 0; sfx(e.sfxSight, volAt(dist)); }
      continue;
    }
    if (e.state === "attack") {
      if (e.stateT > 0.4) { e.state = "chase"; e.stateT = 0; }
      continue;
    }
    // chase
    e.attackT -= dt;
    if (e.ranged && los && dist > 2.5 && e.attackT <= 0) {
      e.state = "attack"; e.stateT = 0; e.attackT = e.cool + Math.random() * 0.6;
      const pa = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.12;
      const ps = e.pspeed || 6;
      projectiles.push({ x: e.x, y: e.y, vx: Math.cos(pa) * ps, vy: Math.sin(pa) * ps, dmg: e.dmg, img: e.ball });
      sfx(e.atkSfx, volAt(dist));
    } else if (!e.ranged && dist < 1.1 && e.attackT <= 0) {
      e.state = "attack"; e.stateT = 0; e.attackT = e.cool;
      player.hp -= e.dmg;
      player.hurtFlash = 0.35; faceTimer = 0.8;
      sfx(e.atkSfx);
      sfx("playerPain", 0.9);
    } else if (dist > (e.ranged ? 3.5 : 0.8)) {
      if (dist < 9 && Math.random() < dt * 0.18) sfx(e.sfxAct, volAt(dist) * 0.7);
      const step = e.speed * dt;
      let vx = dx / dist, vy = dy / dist;
      if (!los) {
        const wob = Math.sin(performance.now() / 400 + e.x * 7) * 0.8;
        const tx = vx * Math.cos(wob) - vy * Math.sin(wob);
        vy = vx * Math.sin(wob) + vy * Math.cos(wob);
        vx = tx;
      }
      moveWithCollision(e, vx * step, vy * step, 0.3);
    }
  }

  // --- projectiles ---
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (solidCell(p.x | 0, p.y | 0)) {
      sfx(p.img === "rocket" ? "rocketHit" : "fireballHit", volAt(distToPlayer(p.x, p.y)) * 0.8);
      if (p.img === "rocket") effects.push({ x: p.x, y: p.y, t: 0, kind: "boom" });
      projectiles.splice(i, 1);
      continue;
    }
    if (Math.hypot(p.x - player.x, p.y - player.y) < 0.4) {
      player.hp -= p.dmg;
      player.hurtFlash = 0.35; faceTimer = 0.8;
      sfx(p.img === "rocket" ? "rocketHit" : "fireballHit");
      if (p.img === "rocket") effects.push({ x: p.x, y: p.y, t: 0, kind: "boom" });
      sfx("playerPain", 0.9);
      projectiles.splice(i, 1);
    }
  }

  // --- pickups ---
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    if (Math.hypot(p.x - player.x, p.y - player.y) < 0.6) {
      if (p.kind === "medkit") {
        if (player.hp >= 100) continue;
        player.hp = Math.min(100, player.hp + 25);
      } else if (p.kind === "ammo") {
        let took = false;
        for (const [type, n] of Object.entries(p.give)) {
          if (player.ammo[type] < AMMO_MAX[type]) {
            player.ammo[type] = Math.min(AMMO_MAX[type], player.ammo[type] + n);
            took = true;
          }
        }
        if (!took) continue;
      } else if (p.kind === "weapon") {
        for (const [type, n] of Object.entries(p.give))
          player.ammo[type] = Math.min(AMMO_MAX[type], player.ammo[type] + n);
        if (!player.weapons[p.w]) {
          player.weapons[p.w] = true;
          player.weapon = p.w;
          fireCooldown = Math.max(fireCooldown, 0.3);
          showMsg("YOU GOT THE " + WEAPONS[p.w].name + "!");
        }
      } else {   // keycard
        const color = p.kind.slice(0, -3);
        player.keys[color] = true;
        showMsg("PICKED UP THE " + color.toUpperCase() + " KEYCARD");
      }
      player.pickFlash = 0.25;
      sfx("pickup");
      pickups.splice(i, 1);
    }
  }

  player.hurtFlash = Math.max(0, player.hurtFlash - dt);
  player.pickFlash = Math.max(0, player.pickFlash - dt);
  faceTimer = Math.max(0, faceTimer - dt);

  if (player.hp <= 0) {
    player.hp = 0;
    gameState = "dead";
    sfx("playerDie");
  }
}

// ---------------------------------------------------------
// Render: walls + floor/ceiling into pixel buffer
// ---------------------------------------------------------
function shade(px, f) {
  if (f >= 1) return px;
  const r = (px & 0xff) * f, g = ((px >> 8) & 0xff) * f, b = ((px >> 16) & 0xff) * f;
  return 0xff000000 | (b << 16) | (g << 8) | r;
}

function renderWorld() {
  const dirX = Math.cos(player.ang), dirY = Math.sin(player.ang);
  const planeX = -dirY * Math.tan(FOV / 2), planeY = dirX * Math.tan(FOV / 2);
  const posX = player.x, posY = player.y;
  const half = VIEW_H / 2;
  const bobOff = (gameState === "play" ? Math.sin(player.bob) * 3 : 0) | 0;
  const horizon = half + bobOff;

  // --- floor & ceiling casting (per row) ---
  const fData = floorTex.data, cData = ceilTex.data;
  const wLiq = waterTex.data, nLiq = nukeTex.data, pPad = padTex.data;
  const liqT = performance.now() / 1000 * 0.35;
  for (let y = 0; y < VIEW_H; y++) {
    const isFloor = y > horizon;
    const p = isFloor ? (y - horizon) : (horizon - y);
    if (p <= 0) continue;
    const rowDist = half / p;
    const fog = Math.min(1, 2.1 / rowDist) * (isFloor ? 0.8 : 0.55);
    const stepX = rowDist * (2 * planeX) / W;
    const stepY = rowDist * (2 * planeY) / W;
    let fx = posX + rowDist * (dirX - planeX);
    let fy = posY + rowDist * (dirY - planeY);
    const rowBase = y * W;
    if (!isFloor) {
      for (let x = 0; x < W; x++) {
        const tx = ((fx - Math.floor(fx)) * TEX) | 0;
        const ty = ((fy - Math.floor(fy)) * TEX) | 0;
        fb[rowBase + x] = shade(cData[ty * TEX + tx], fog);
        fx += stepX; fy += stepY;
      }
    } else {
      for (let x = 0; x < W; x++) {
        const cx = fx | 0, cy = fy | 0;
        const ft = (cx >= 0 && cy >= 0 && cx < MAP_W && cy < MAP_H) ? floorMap[cy * MAP_W + cx] : 0;
        let tex = fData, u = fx, v = fy, br = fog;
        if (ft === 1)      { tex = wLiq; u += liqT; v += liqT * 0.6; br = Math.min(1, fog * 1.5); }
        else if (ft === 2) { tex = nLiq; u += liqT; v += liqT * 0.6; br = Math.min(1, fog * 1.5); }
        else if (ft === 3) { tex = pPad; br = Math.min(1, fog * 1.4); }
        const tx = ((u - Math.floor(u)) * TEX) | 0;
        const ty = ((v - Math.floor(v)) * TEX) | 0;
        fb[rowBase + x] = shade(tex[ty * TEX + tx], br);
        fx += stepX; fy += stepY;
      }
    }
  }

  // --- walls (DDA per column) ---
  for (let x = 0; x < W; x++) {
    const camX = 2 * x / W - 1;
    const rdX = dirX + planeX * camX;
    const rdY = dirY + planeY * camX;
    let mapX = posX | 0, mapY = posY | 0;
    const dX = Math.abs(1 / rdX), dY = Math.abs(1 / rdY);
    let stepX, stepY, sideX, sideY;
    if (rdX < 0) { stepX = -1; sideX = (posX - mapX) * dX; }
    else         { stepX = 1;  sideX = (mapX + 1 - posX) * dX; }
    if (rdY < 0) { stepY = -1; sideY = (posY - mapY) * dY; }
    else         { stepY = 1;  sideY = (mapY + 1 - posY) * dY; }
    let hit = 0, side = 0, doorShift = 0;
    while (!hit) {
      if (sideX < sideY) { sideX += dX; mapX += stepX; side = 0; }
      else               { sideY += dY; mapY += stepY; side = 1; }
      if (mapX >= 0 && mapY >= 0 && mapX < MAP_W && mapY < MAP_H)
        explored[mapY * MAP_W + mapX] = 1;   // fog of war: seen by this ray
      const t = mapAt(mapX, mapY);
      if (!t) continue;
      if (DOOR_TILES.has(t)) {
        // sliding door: the slab covers [0, 1-open) of the cell face
        const d = doors.get(mapY * MAP_W + mapX);
        const openness = d ? d.open : 0;
        if (openness > 0) {
          const pd = side === 0 ? sideX - dX : sideY - dY;
          let wx = side === 0 ? posY + pd * rdY : posX + pd * rdX;
          wx -= Math.floor(wx);
          if (wx + openness >= 1) continue;   // ray passes through the opening
          doorShift = openness;
        }
      }
      hit = t;
    }
    const perpDist = side === 0 ? sideX - dX : sideY - dY;
    zBuffer[x] = perpDist;

    const lineH = (VIEW_H / perpDist) | 0;
    let drawStart = Math.max(0, (horizon - lineH / 2) | 0);
    let drawEnd = Math.min(VIEW_H - 1, (horizon + lineH / 2) | 0);

    let wallX = side === 0 ? posY + perpDist * rdY : posX + perpDist * rdX;
    wallX -= Math.floor(wallX);
    if (doorShift > 0) wallX = Math.min(0.999, wallX + doorShift);   // texture slides with the door
    let texX = (wallX * TEX) | 0;
    if ((side === 0 && rdX > 0) || (side === 1 && rdY < 0)) texX = TEX - texX - 1;

    const texEntry = textures[hit === 14 ? 1 : hit] || textures[1];   // secret doors look like stone
    const tex = texEntry.data;
    const step = TEX / lineH;
    let texPos = (drawStart - horizon + lineH / 2) * step;
    let fog = Math.min(1, 2.8 / perpDist);
    if (side === 1) fog *= 0.72;
    for (let y = drawStart; y <= drawEnd; y++) {
      const texY = Math.min(TEX - 1, texPos | 0);
      texPos += step;
      fb[y * W + x] = shade(tex[texY * TEX + texX], fog);
    }
  }

  // --- sprites (enemies, pickups, projectiles), far to near ---
  const items = [];
  for (const e of enemies) {
    if (e.dead) continue;
    const hover = e.float ? e.float + Math.sin(performance.now() / 400 + e.x * 3) * 0.05 : 0;
    let img, hScale = e.scale, sink = hover;
    if (e.state === "dying") {
      img = sprites[e.pain];
      const t = Math.min(1, e.stateT / 0.45);
      hScale = e.scale * (1 - t * 0.8);
      sink = t * 0.5 + hover * (1 - t);   // floaters drop to the ground as they die
    }
    else if (e.state === "attack") img = sprites[e.attack];
    else if (e.state === "pain")   img = sprites[e.pain];
    else                           img = sprites[e.idle];
    items.push({ x: e.x, y: e.y, img, hScale, sink });
  }
  for (const p of pickups)     items.push({ x: p.x, y: p.y, img: sprites[p.spr || p.kind], hScale: 0.7, sink: 0.18 });
  for (const p of projectiles) items.push({ x: p.x, y: p.y, img: sprites[p.img] || sprites.fireball, hScale: 0.5, sink: 0 });
  for (const p of pProjectiles) items.push({ x: p.x, y: p.y, img: sprites[p.wp.proj], hScale: p.wp.proj === "bfgball" ? 0.8 : 0.45, sink: 0, bright: true });
  for (const b of barrels)     items.push({ x: b.x, y: b.y, img: sprites.barrel, hScale: 0.8, sink: 0.12 });
  for (const d of decors)      items.push({ x: d.x, y: d.y, img: sprites[d.spr] || sprites.corpse, hScale: d.spr ? 0.75 : 0.6, sink: d.spr ? 0.22 : 0.3 });
  for (const f of effects) items.push({
    x: f.x, y: f.y,
    img: f.kind === "telefog" ? sprites.telefog :
         f.kind === "puff" ? sprites.boom1 :
         (f.t < 0.18 ? sprites.boom1 : sprites.boom2),
    hScale: f.kind === "telefog" ? 1.0 : f.kind === "puff" ? 0.35 : 0.7 + f.t * 1.6,
    sink: 0, bright: true,
  });

  const invDet = 1 / (planeX * dirY - dirX * planeY);
  for (const s of items) {
    const sx = s.x - posX, sy = s.y - posY;
    s.tY = invDet * (-planeY * sx + planeX * sy);       // depth in camera space
    s.tX = invDet * (dirY * sx - dirX * sy);
    s.d2 = sx * sx + sy * sy;
  }
  items.sort((a, b) => b.d2 - a.d2);

  for (const s of items) {
    const transX = s.tX, transY = s.tY;
    if (transY <= 0.1) continue;
    const screenX = ((W / 2) * (1 + transX / transY)) | 0;
    const baseH = Math.abs((VIEW_H / transY)) | 0;
    const sprH = (baseH * s.hScale) | 0;
    const sprW = sprH;
    const vShift = ((baseH - sprH) / 2 + s.sink * baseH) | 0;
    const drawStartY = Math.max(0, (horizon - sprH / 2 + vShift) | 0);
    const drawEndY = Math.min(VIEW_H - 1, (horizon + sprH / 2 + vShift) | 0);
    const drawStartX = Math.max(0, (screenX - sprW / 2) | 0);
    const drawEndX = Math.min(W - 1, (screenX + sprW / 2) | 0);
    const fog = s.bright ? 1 : Math.min(1, 2.8 / transY);
    for (let x = drawStartX; x <= drawEndX; x++) {
      if (transY >= zBuffer[x]) continue;
      const texX = (((x - (screenX - sprW / 2)) * SPR) / sprW) | 0;
      if (texX < 0 || texX >= SPR) continue;
      for (let y = drawStartY; y <= drawEndY; y++) {
        const texY = (((y - (horizon - sprH / 2 + vShift)) * SPR) / sprH) | 0;
        if (texY < 0 || texY >= SPR) continue;
        const px = s.img[texY * SPR + texX];
        if ((px >>> 24) < 128) continue;
        fb[y * W + x] = shade(px, fog);
      }
    }
  }

  ctx.putImageData(frame, 0, 0);
}

// ---------------------------------------------------------
// Render: weapon, HUD, overlays (canvas 2D on top)
// ---------------------------------------------------------
function renderWeapon() {
  const bobX = Math.sin(player.bob) * 8;
  const bobY = Math.abs(Math.cos(player.bob)) * 6;
  const gx = W / 2 + bobX, gy = VIEW_H + bobY - (muzzle > 0 ? 6 : 0);
  const w = player.weapon;
  // real weapon art when the local Guns/gifs/ frames are loaded
  const art = gunArt[w];
  let img = null, animating = false;
  if (art.frames && gunFireT < art.fireTotal) {
    // play the firing frames (1..n) with their own timings
    let t = gunFireT, idx = 1;
    while (idx < art.frames.length - 1 && t > art.durs[idx]) { t -= art.durs[idx]; idx++; }
    img = art.frames[idx];
    animating = true;
  } else {
    img = ((muzzle > 0 || gunFireT < 0.25) && art.fire) ? art.fire : art.idle;
  }
  if (img) {
    ctx.imageSmoothingEnabled = false;
    const scale = Math.min(340 / img.width, 260 / img.height);
    const dw = img.width * scale, dh = img.height * scale;
    const dx = W / 2 - dw / 2 + bobX, dy = VIEW_H - dh + bobY + (muzzle > 0 ? -4 : 2);
    if (muzzle > 0 && !art.fire && !animating && !WEAPONS[w].melee) {   // generic flash when no firing art exists
      const col = w === 6 ? ["rgba(80,255,80,0.9)", "rgba(200,255,180,0.9)"]
               : ["rgba(255,220,80,0.9)", "rgba(255,255,200,0.9)"];
      ctx.fillStyle = col[0];
      ctx.beginPath(); ctx.ellipse(W / 2 + bobX, dy + 8, 20, 26, 0, 0, 7); ctx.fill();
      ctx.fillStyle = col[1];
      ctx.beginPath(); ctx.ellipse(W / 2 + bobX, dy + 10, 9, 13, 0, 0, 7); ctx.fill();
    }
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.imageSmoothingEnabled = true;
    return;
  }
  ctx.save();
  ctx.translate(gx, gy);
  if (muzzle > 0 && w !== 0) {   // muzzle flash (BFG/plasma get a green/blue tint)
    const col = w === 6 ? ["rgba(80,255,80,0.9)", "rgba(200,255,180,0.9)"]
             : w === 5 ? ["rgba(90,180,255,0.9)", "rgba(200,235,255,0.9)"]
             : ["rgba(255,220,80,0.9)", "rgba(255,255,200,0.9)"];
    ctx.fillStyle = col[0];
    ctx.beginPath(); ctx.ellipse(0, -86, 22, 30, 0, 0, 7); ctx.fill();
    ctx.fillStyle = col[1];
    ctx.beginPath(); ctx.ellipse(0, -84, 10, 16, 0, 0, 7); ctx.fill();
  }
  if (w === 0) {   // fist: swings forward while punching
    const px2 = muzzle > 0 ? -14 : 0, py2 = muzzle > 0 ? -26 : 0;
    ctx.fillStyle = "#c8906a";
    ctx.beginPath(); ctx.ellipse(34 + px2, -8 + py2, 15, 13, -0.3, 0, 7); ctx.fill();
    ctx.fillStyle = "#a87850";
    for (let i = 0; i < 4; i++) ctx.fillRect(22 + px2 + i * 7, -18 + py2, 5, 8);
  } else if (w === 1) {   // pistol
    ctx.fillStyle = "#23262b"; ctx.fillRect(-9, -80, 18, 46);
    ctx.fillStyle = "#3a3f46"; ctx.fillRect(-7, -80, 5, 46);
    ctx.fillStyle = "#2e3238"; ctx.fillRect(-16, -40, 32, 24);
    ctx.fillStyle = "#41464e"; ctx.fillRect(-16, -40, 32, 6);
  } else if (w === 2) {   // shotgun
    ctx.fillStyle = "#2e3238"; ctx.fillRect(-13, -92, 26, 52);
    ctx.fillStyle = "#43484f"; ctx.fillRect(-10, -92, 7, 52);
    ctx.fillStyle = "#5a4526"; ctx.fillRect(-16, -42, 32, 30);
    ctx.fillStyle = "#3a2c14"; ctx.fillRect(-16, -42, 32, 6);
  } else if (w === 3) {   // chaingun
    ctx.fillStyle = "#23262b";
    ctx.fillRect(-24, -78, 12, 44); ctx.fillRect(-6, -82, 12, 48); ctx.fillRect(12, -78, 12, 44);
    ctx.fillStyle = "#3a3f46";
    ctx.fillRect(-21, -78, 4, 44); ctx.fillRect(-3, -82, 4, 48); ctx.fillRect(15, -78, 4, 44);
    ctx.fillStyle = "#2e3238"; ctx.fillRect(-30, -36, 60, 22);
    ctx.fillStyle = "#41464e"; ctx.fillRect(-30, -36, 60, 6);
  } else if (w === 4) {   // rocket launcher
    ctx.fillStyle = "#3e4a30"; ctx.fillRect(-22, -88, 44, 60);
    ctx.fillStyle = "#28301e"; ctx.fillRect(-22, -88, 44, 10);
    ctx.fillStyle = "#15181a";
    ctx.beginPath(); ctx.ellipse(0, -84, 15, 8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#4e5c3c"; ctx.fillRect(-14, -50, 10, 22);
  } else if (w === 5) {   // plasma rifle
    ctx.fillStyle = "#3a4a5e"; ctx.fillRect(-18, -84, 36, 50);
    ctx.fillStyle = "#28343f"; ctx.fillRect(-18, -84, 36, 8);
    ctx.fillStyle = "#4fc3f7";
    ctx.fillRect(-12, -70, 24, 5); ctx.fillRect(-12, -58, 24, 5);
    ctx.fillStyle = "#23262b"; ctx.fillRect(-8, -90, 16, 8);
  } else if (w === 6) {   // BFG9000
    ctx.fillStyle = "#3e5a3e"; ctx.fillRect(-28, -86, 56, 56);
    ctx.fillStyle = "#28402a"; ctx.fillRect(-28, -86, 56, 10);
    ctx.fillStyle = "#1f8f1f";
    ctx.beginPath(); ctx.ellipse(0, -82, 17, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#a8ff70";
    ctx.beginPath(); ctx.ellipse(0, -82, 8, 4, 0, 0, 7); ctx.fill();
  } else {   // chainsaw
    ctx.save();
    ctx.rotate(-0.45);
    ctx.fillStyle = "#6a6e76"; ctx.fillRect(-8, -95, 14, 70);
    ctx.fillStyle = "#33363c";
    for (let i = 0; i < 7; i++) ctx.fillRect(6, -92 + i * 10 + (muzzle > 0 ? 4 : 0), 4, 5);
    ctx.restore();
    ctx.fillStyle = "#8a2020"; ctx.fillRect(-24, -34, 48, 22);
    ctx.fillStyle = "#5a1414"; ctx.fillRect(-24, -34, 48, 6);
  }
  // hands
  ctx.fillStyle = "#4a3524";
  ctx.beginPath();
  ctx.moveTo(-12, -16); ctx.lineTo(14, -16); ctx.lineTo(24, 4); ctx.lineTo(-2, 4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c8906a";
  ctx.beginPath(); ctx.ellipse(6, -4, 16, 12, -0.4, 0, 7); ctx.fill();
  ctx.restore();
}

function drawDigits(text, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px 'Courier New', monospace`;
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}

function renderFace(cx, cy) {
  const hp = player.hp;
  const pain = faceTimer > 0;
  ctx.fillStyle = hp > 60 ? "#c8906a" : hp > 30 ? "#c07858" : "#a85a48";
  ctx.fillRect(cx - 16, cy - 20, 32, 40);
  ctx.fillStyle = "#6a4a28";
  ctx.fillRect(cx - 16, cy - 20, 32, 8);
  faceLook = pain ? 0 : Math.sin(performance.now() / 900) * 3;
  ctx.fillStyle = "#fff";
  ctx.fillRect(cx - 11, cy - 8, 9, pain ? 8 : 6);
  ctx.fillRect(cx + 2,  cy - 8, 9, pain ? 8 : 6);
  ctx.fillStyle = "#223";
  ctx.fillRect(cx - 8 + faceLook, cy - 7, 3, pain ? 6 : 4);
  ctx.fillRect(cx + 5 + faceLook, cy - 7, 3, pain ? 6 : 4);
  if (hp <= 60) {
    ctx.strokeStyle = "#3a2a18"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 12, cy - 12); ctx.lineTo(cx - 3, cy - 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 12, cy - 12); ctx.lineTo(cx + 3, cy - 9); ctx.stroke();
  }
  ctx.fillStyle = "#502820";
  if (pain)         ctx.fillRect(cx - 6, cy + 8, 12, 7);
  else if (hp > 60) ctx.fillRect(cx - 8, cy + 10, 16, 3);
  else              { ctx.fillRect(cx - 8, cy + 9, 16, 3); ctx.fillRect(cx - 10, cy + 7, 3, 3); }
  if (hp <= 30) {
    ctx.fillStyle = "#a01010";
    ctx.fillRect(cx - 14, cy - 2, 4, 10);
    ctx.fillRect(cx + 8, cy + 4, 4, 12);
  }
}

function renderHUD() {
  ctx.fillStyle = "#2a2a2a";
  ctx.fillRect(0, VIEW_H, W, HUD_H);
  ctx.fillStyle = "#151515";
  ctx.fillRect(0, VIEW_H, W, 3);
  ctx.strokeStyle = "#111";
  for (const x of [130, 240, 315, 390, 500]) {
    ctx.beginPath(); ctx.moveTo(x, VIEW_H + 6); ctx.lineTo(x, H - 6); ctx.stroke();
  }
  const mid = VIEW_H + HUD_H / 2;
  const wpn = WEAPONS[player.weapon];
  drawDigits("AMMO", 20, mid - 14, 13, "#888");
  drawDigits(wpn.ammoType ? String(player.ammo[wpn.ammoType]) : "-", 20, mid + 10, 30, "#e03030");
  drawDigits("HEALTH", 140, mid - 14, 13, "#888");
  drawDigits(player.hp + "%", 140, mid + 10, 30, player.hp > 30 ? "#e03030" : "#ff6060");
  drawDigits("ARMS", 250, mid - 16, 13, "#888");
  for (let i = 2; i <= 8; i++) {
    const col = (i - 2) % 4, row = (i - 2) / 4 | 0;
    drawDigits(String(i), 248 + col * 15, mid + row * 18, 15, player.weapons[i - 1] ? "#e8c840" : "#555");
  }
  renderFace(345, mid);
  // collected keycards next to the face
  if (player.keys) {
    const keyColors = { blue: "#3060e0", yellow: "#d8b820", red: "#d02020" };
    let ki = 0;
    for (const color of ["blue", "yellow", "red"]) {
      if (player.keys[color]) {
        ctx.fillStyle = keyColors[color];
        ctx.fillRect(370, VIEW_H + 8 + ki * 17, 9, 13);
        ctx.fillStyle = "#eee";
        ctx.fillRect(372, VIEW_H + 10 + ki * 17, 5, 3);
      }
      ki++;
    }
  }
  drawDigits("KILLS", 405, mid - 14, 13, "#888");
  drawDigits(`${player.kills}/${totalEnemies}`, 405, mid + 10, 26, "#e03030");
  drawDigits("LEVEL", 520, mid - 14, 13, "#888");
  drawDigits(LEVELS[levelIdx] ? LEVELS[levelIdx].name.split(":")[0] : "", 520, mid + 10, 26, "#c8a020");

  // crosshair
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.fillRect(W / 2 - 1, VIEW_H / 2 - 6, 2, 4);
  ctx.fillRect(W / 2 - 1, VIEW_H / 2 + 2, 2, 4);
  ctx.fillRect(W / 2 - 6, VIEW_H / 2 - 1, 4, 2);
  ctx.fillRect(W / 2 + 2, VIEW_H / 2 - 1, 4, 2);
}

function renderMinimap() {
  const s = Math.min(6, ((VIEW_H - 20) / MAP_H) | 0), ox = 10, oy = 10;
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(ox - 2, oy - 2, MAP_W * s + 4, MAP_H * s + 4);
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (!explored[y * MAP_W + x]) continue;   // fog of war
    const t = MAP[y * MAP_W + x];
    if (t) {
      const d = DOOR_TILES.has(t) ? doorAt(x, y) : null;
      ctx.fillStyle =
        d && d.open > 0.8 ? "#4a6a30" :
        t === 4  ? "#c8a020" :
        t === 11 ? "#3060e0" : t === 12 ? "#d8b820" : t === 13 ? "#d02020" :
        t === 9 || t === 10 ? "#d02020" : "#8a8a8a";   // secret doors (14) stay wall-gray
      ctx.fillRect(ox + x * s, oy + y * s, s - 1, s - 1);
    } else if (floorMap[y * MAP_W + x] === 3) {   // teleporter pad
      ctx.fillStyle = "#40c8c8";
      ctx.fillRect(ox + x * s + 1, oy + y * s + 1, s - 3, s - 3);
    }
  }
  // discovered items (keycards deliberately not shown)
  for (const p of pickups) {
    if (p.kind !== "medkit" && p.kind !== "ammo" && p.kind !== "weapon") continue;
    if (!explored[(p.y | 0) * MAP_W + (p.x | 0)]) continue;
    ctx.fillStyle = p.kind === "medkit" ? "#e05050" : p.kind === "weapon" ? "#ff9020" : "#d8c060";
    ctx.fillRect(ox + p.x * s - 1, oy + p.y * s - 1, 3, 3);
  }
  ctx.fillStyle = "#30d030";
  ctx.beginPath();
  ctx.arc(ox + player.x * s, oy + player.y * s, 3, 0, 7);
  ctx.fill();
  ctx.strokeStyle = "#30d030";
  ctx.beginPath();
  ctx.moveTo(ox + player.x * s, oy + player.y * s);
  ctx.lineTo(ox + (player.x + Math.cos(player.ang) * 2) * s, oy + (player.y + Math.sin(player.ang) * 2) * s);
  ctx.stroke();
  ctx.font = "bold 12px 'Courier New', monospace";
  ctx.fillStyle = "#ddd";
  ctx.fillText(LEVELS[levelIdx].name, ox, oy + MAP_H * s + 14);
}

function renderOverlays() {
  if (msgT > 0 && gameState === "play") {
    ctx.textAlign = "center";
    ctx.font = "bold 17px 'Courier New', monospace";
    ctx.fillStyle = "#e8c840";
    ctx.fillText(msg, W / 2, 26);
    ctx.textAlign = "left";
  }
  if (player.hurtFlash > 0) {
    ctx.fillStyle = `rgba(200,0,0,${player.hurtFlash * 0.9})`;
    ctx.fillRect(0, 0, W, VIEW_H);
  }
  if (player.pickFlash > 0) {
    ctx.fillStyle = `rgba(220,200,60,${player.pickFlash * 0.5})`;
    ctx.fillRect(0, 0, W, VIEW_H);
  }
  if (gameState === "play") return;

  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  if (gameState === "dead") {
    ctx.font = "bold 52px 'Courier New', monospace";
    ctx.fillStyle = "#d01010";
    ctx.fillText("YOU DIED", W / 2, H / 2 - 30);
    ctx.font = "bold 20px 'Courier New', monospace";
    ctx.fillStyle = "#ccc";
    ctx.fillText(LEVELS[levelIdx].name, W / 2, H / 2 + 10);
    ctx.fillText("PRESS R TO RESTART - ESC FOR MENU", W / 2, H / 2 + 42);
  } else if (gameState === "intermission") {
    ctx.font = "bold 36px 'Courier New', monospace";
    ctx.fillStyle = "#e0a020";
    ctx.fillText(LEVELS[levelIdx].name + " FINISHED", W / 2, H / 2 - 60);
    ctx.font = "bold 22px 'Courier New', monospace";
    ctx.fillStyle = "#ccc";
    ctx.fillText(`KILLS: ${player.kills} / ${totalEnemies}`, W / 2, H / 2 - 10);
    ctx.fillText(`ITEMS LEFT: ${pickups.length}`, W / 2, H / 2 + 22);
    ctx.fillStyle = "#e0a020";
    ctx.fillText(pendingNext !== null
      ? "PRESS SPACE FOR " + LEVELS[pendingNext].name
      : "PRESS SPACE TO FINISH", W / 2, H / 2 + 70);
  } else if (gameState === "victory") {
    ctx.font = "bold 44px 'Courier New', monospace";
    ctx.fillStyle = "#e0a020";
    ctx.fillText("YOU WIN", W / 2, H / 2 - 40);
    ctx.font = "bold 20px 'Courier New', monospace";
    ctx.fillStyle = "#ccc";
    ctx.fillText("THE DEMONS ARE DEFEATED... FOR NOW", W / 2, H / 2 + 5);
    ctx.fillText("PRESS R FOR THE MENU", W / 2, H / 2 + 40);
  }
  ctx.textAlign = "left";
}

// ---------------------------------------------------------
// Menu rendering (drawn in the classic style, original art)
// ---------------------------------------------------------
function drawSkull(x, y) {
  const bob = Math.sin(performance.now() / 250) * 2;
  ctx.fillStyle = "#e0d8c8";
  ctx.fillRect(x, y + bob, 16, 12);
  ctx.fillRect(x + 3, y + 12 + bob, 10, 5);
  ctx.fillStyle = "#7a1010";
  ctx.fillRect(x + 3, y + 4 + bob, 4, 4);
  ctx.fillRect(x + 9, y + 4 + bob, 4, 4);
  ctx.fillStyle = "#8a8070";
  for (let i = 0; i < 3; i++) ctx.fillRect(x + 4 + i * 3, y + 13 + bob, 2, 3);
}
function drawMenuButtons() {
  ctx.textAlign = "center";
  for (const b of menuLayout()) {
    const sel = b.i === menuSel;
    // riveted metal plate
    const grad = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    if (sel) {
      grad.addColorStop(0, "#6a2418"); grad.addColorStop(0.5, "#8a2e1a"); grad.addColorStop(1, "#40140c");
    } else {
      grad.addColorStop(0, "#3c3c42"); grad.addColorStop(0.5, "#2a2a2f"); grad.addColorStop(1, "#17171a");
    }
    ctx.fillStyle = grad;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // bevel
    ctx.fillStyle = sel ? "#b8542e" : "#55555e";
    ctx.fillRect(b.x, b.y, b.w, 2); ctx.fillRect(b.x, b.y, 2, b.h);
    ctx.fillStyle = "#0b0b0d";
    ctx.fillRect(b.x, b.y + b.h - 2, b.w, 2); ctx.fillRect(b.x + b.w - 2, b.y, 2, b.h);
    // corner rivets
    ctx.fillStyle = sel ? "#d8834a" : "#63636c";
    for (const [rx, ry] of [[b.x + 6, b.y + 6], [b.x + b.w - 9, b.y + 6], [b.x + 6, b.y + b.h - 9], [b.x + b.w - 9, b.y + b.h - 9]])
      ctx.fillRect(rx, ry, 3, 3);
    // label
    ctx.font = "bold 22px Impact, 'Arial Black', sans-serif";
    ctx.fillStyle = "#300";
    ctx.fillText(b.label, W / 2 + 2, b.y + b.h / 2 + 8 + 2);
    ctx.fillStyle = sel ? "#ff4a2a" : "#c01812";
    ctx.fillText(b.label, W / 2, b.y + b.h / 2 + 8);
    if (sel) drawSkull(b.x - 28, b.y + 9);
  }
  ctx.textAlign = "left";
}
function drawHelp() {
  ctx.textAlign = "center";
  ctx.font = "bold 24px Impact, 'Arial Black', sans-serif";
  ctx.fillStyle = "#b01010";
  ctx.fillText("HOW TO PLAY", W / 2, 175);
  ctx.font = "bold 15px 'Courier New', monospace";
  ctx.fillStyle = "#ccc";
  const lines = [
    "WASD ........... MOVE / STRAFE",
    "MOUSE / ARROWS . TURN",
    "CLICK / SPACE .. FIRE",
    "E .............. USE DOORS + SWITCHES",
    "SHIFT .......... RUN",
    "M .............. AUTOMAP    N ... MUSIC",
    "ESC ............ PAUSE",
    "",
    "FIND THE EXIT SWITCH IN EACH LEVEL.",
    "COLORED DOORS NEED KEYCARDS.",
    "SOME WALLS HIDE SECRETS...",
    "",
    "PRESS ANY KEY TO RETURN",
  ];
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, 205 + i * 20));
  ctx.textAlign = "left";
}
function renderTitle() {
  if (menuArtOk) {
    // player-made key art, cover-fit and top-anchored so the marine stays framed
    const s = Math.max(W / menuArt.width, H / menuArt.height);
    const dw = menuArt.width * s, dh = menuArt.height * s;
    ctx.drawImage(menuArt, (W - dw) / 2, 0, dw, dh);
    // darken toward the bottom so the buttons stay readable
    const shade = ctx.createLinearGradient(0, 120, 0, H);
    shade.addColorStop(0, "rgba(0,0,0,0.05)");
    shade.addColorStop(1, "rgba(0,0,0,0.8)");
    ctx.fillStyle = shade;
    ctx.fillRect(0, 0, W, H);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#1a0202");
    grad.addColorStop(0.45, "#4a0a02");
    grad.addColorStop(1, "#0e0000");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#180404";
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, H - 40 - ((x * 7919) % 53));
    ctx.lineTo(W, H);
    ctx.closePath(); ctx.fill();
  }
  // logo
  ctx.textAlign = "center";
  const logoSize = menuArtOk ? 84 : 108, logoY = menuArtOk ? 96 : 115;
  ctx.font = `bold ${logoSize}px Impact, 'Arial Black', sans-serif`;
  ctx.fillStyle = "#2a0000";
  ctx.fillText("DOOM", W / 2 + 6, logoY + 6);
  const lg = ctx.createLinearGradient(0, logoY - 80, 0, logoY + 12);
  lg.addColorStop(0, "#ff6a20");
  lg.addColorStop(0.45, "#d01010");
  lg.addColorStop(1, "#500000");
  ctx.fillStyle = lg;
  ctx.fillText("DOOM", W / 2, logoY);
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.fillStyle = "#c8a880";
  ctx.fillText("A FAN-MADE HTML TRIBUTE", W / 2, logoY + 24);
  ctx.textAlign = "left";
  if (menuMode === "help") drawHelp();
  else drawMenuButtons();
}
function renderPauseMenu() {
  ctx.textAlign = "center";
  ctx.font = "bold 40px Impact, 'Arial Black', sans-serif";
  ctx.fillStyle = "#500"; ctx.fillText("PAUSED", W / 2 + 3, 103);
  ctx.fillStyle = "#d01010"; ctx.fillText("PAUSED", W / 2, 100);
  ctx.textAlign = "left";
  drawMenuButtons();
}

// ---------------------------------------------------------
// Main loop
// ---------------------------------------------------------
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (gameState === "title") {
    renderTitle();
  } else {
    update(dt);
    renderWorld();
    if (gameState === "play" || gameState === "paused") renderWeapon();
    renderHUD();
    if (showMap) renderMinimap();
    renderOverlays();
    if (gameState === "paused") renderPauseMenu();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
