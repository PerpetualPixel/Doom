<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DOOM.html</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #game {
    display: block;
    width: 100vw; height: 100vh;
    object-fit: contain;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
  }
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85);
    color: #d00; text-align: center;
    user-select: none;
  }
  #overlay h1 { font-size: 64px; margin: 0 0 10px; letter-spacing: 8px; text-shadow: 4px 4px 0 #400; }
  #overlay p  { color: #aaa; font-size: 18px; line-height: 1.8; }
  #overlay .key { color: #fc0; }
  #overlay.hidden { display: none; }
</style>
</head>
<body>
<canvas id="game" width="640" height="400"></canvas>
<div id="overlay">
  <h1>DOOM</h1>
  <p>
    <span class="key">CLICK</span> to enter the map (locks mouse)<br>
    <span class="key">WASD</span> move &nbsp; <span class="key">MOUSE / ARROWS</span> turn &nbsp; <span class="key">SHIFT</span> run<br>
    <span class="key">CLICK / SPACE</span> fire &nbsp; <span class="key">E</span> use doors / switches &nbsp; <span class="key">M</span> map<br>
    <span class="key">N</span> music on/off &nbsp; <span class="key">R</span> restart<br><br>
    Three levels. Find the exit switch in each.
  </p>
</div>

// falls back to synthesized WebAudio when they are not
// (e.g. on the hosted version, which ships no audio files).
// ============================================================

const W = 640, H = 400;          // internal render resolution
const HUD_H = 64;                // HUD bar height
const VIEW_H = H - HUD_H;        // 3D viewport height
const FOV = Math.PI / 3;         // 60 degrees
// Water and nukage sit in a pit this far below the walking surface, so a
// pool reads as sunk into the floor rather than painted onto it. Wall
// height is 1, so this is roughly a knee-high step.
const LIQUID_DROP = 0.18;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");

const fb = new Uint32Array(frame.data.buffer);   // ABGR little-endian
const zBuffer = new Float64Array(W);

// -----------------------------------------------------
// Optional real sprite sheets from local sprites/ folder
// (auto-sliced at runtime; procedural art is the fallback,
// and the folder is not part of the repo). Pixel access to
// local images requires http(s) - on file:// this quietly
// keeps the fallback art.
// -----------------------------------------------------
const SHEET_MAP = [];   // every monster now uses the player's own art
function sliceSheet(img) {
  const c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  const g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  let data;
  try { data = g.getImageData(0, 0, c.width, c.height); } catch { return null; }
  const d = data.data, w = c.width, h = c.height;
  const isBg = buildBgKeyer(d, w, h);
  const solid = (x, y) => {
    const i = (y * w + x) * 4;
    if (d[i + 3] < 128) return false;
    return !isBg(d[i], d[i + 1], d[i + 2]);
  };
  const rowSolid = new Array(h).fill(false);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (solid(x, y)) { rowSolid[y] = true; break; }
  const bands = [];
  for (let y = 0; y < h; y++) if (rowSolid[y]) {
    if (!bands.length || !rowSolid[y - 1]) bands.push({ y0: y, y1: y });
    bands[bands.length - 1].y1 = y;
  }
  if (!bands.length) return null;
  const band = bands[0];   // first band: front-facing frames
  const colSolid = new Array(w).fill(false);
  for (let x = 0; x < w; x++) for (let y = band.y0; y <= band.y1; y++) if (solid(x, y)) { colSolid[x] = true; break; }
  const cells = [];
  for (let x = 0; x < w; x++) if (colSolid[x]) {
    if (!cells.length || !colSolid[x - 1]) cells.push({ x0: x, x1: x });
    cells[cells.length - 1].x1 = x;
  }
  return cells.filter(cl => cl.x1 - cl.x0 > 4).map(cl => {
    // trim each cell vertically to its own content so short sprites
    // (e.g. corpses) still sit on the floor
    let cy0 = band.y1, cy1 = band.y0;
    for (let y = band.y0; y <= band.y1; y++)
      for (let x = cl.x0; x <= cl.x1; x++)
        if (solid(x, y)) {
          if (y < cy0) cy0 = y;
          if (y > cy1) cy1 = y;
          break;
        }
    if (cy1 < cy0) { cy0 = band.y0; cy1 = band.y1; }
    const cw = cl.x1 - cl.x0 + 1, ch = cy1 - cy0 + 1;
    const oc = document.createElement("canvas");
    oc.width = oc.height = SPR;
    const og = oc.getContext("2d");
    og.imageSmoothingEnabled = false;
    const sc = Math.min(SPR / cw, SPR / ch);
    og.drawImage(c, cl.x0, cy0, cw, ch, (SPR - cw * sc) / 2, SPR - ch * sc, cw * sc, ch * sc);
    const od = og.getImageData(0, 0, SPR, SPR);
    const p = od.data;
    for (let i = 0; i < p.length; i += 4)
      if (p[i + 3] > 0 && isBg(p[i], p[i + 1], p[i + 2])) p[i + 3] = 0;
    return new Uint32Array(od.data.buffer);
  });
}

// Rasterize one labeled component into a 64x64 sprite. Pixels outside
// the component are flooded in from the bounding-box edges only, so
// background-colored pixels ENCLOSED inside the sprite body survive.
function rasterizeComponent(srcCanvas, label, resolve, rootId, w, x0, y0, bw, bh) {
  const nat = document.createElement("canvas");
  nat.width = bw; nat.height = bh;
  const ng = nat.getContext("2d");
  ng.drawImage(srcCanvas, x0, y0, bw, bh, 0, 0, bw, bh);
  const nd = ng.getImageData(0, 0, bw, bh);
  const out = new Uint8Array(bw * bh);
  const isOther = (x, y) => {
    const li = label[(y0 + y) * w + (x0 + x)];
    return li === -1 || resolve(li) !== rootId;
  };
  const q = [];
  const push = (x, y) => {
    const i = y * bw + x;
    if (out[i]) return;
    if (isOther(x, y)) { out[i] = 1; q.push(i); }
  };
  for (let x = 0; x < bw; x++) { push(x, 0); push(x, bh - 1); }
  for (let y = 0; y < bh; y++) { push(0, y); push(bw - 1, y); }
  while (q.length) {
    const i = q.pop();
    const x = i % bw, y = (i / bw) | 0;
    if (x > 0) push(x - 1, y);
    if (x < bw - 1) push(x + 1, y);
    if (y > 0) push(x, y - 1);
    if (y < bh - 1) push(x, y + 1);
  }
  for (let i = 0; i < bw * bh; i++) if (out[i]) nd.data[i * 4 + 3] = 0;
  ng.putImageData(nd, 0, 0);
  const oc = document.createElement("canvas");
  oc.width = oc.height = SPR;
  const og = oc.getContext("2d");
  og.imageSmoothingEnabled = false;
  const sc = Math.min(SPR / bw, SPR / bh);
  og.drawImage(nat, 0, 0, bw, bh, (SPR - bw * sc) / 2, SPR - bh * sc, bw * sc, bh * sc);
  return new Uint32Array(og.getImageData(0, 0, SPR, SPR).data.buffer);
}

// its own blob, so frames may overlap in rows or columns. Small
// fragments (blood spray etc.) merge into the nearest large sprite.
// Returns frames sorted left-to-right.

  const c = document.createElement("canvas");

    out.gain.setValueAtTime(0.15, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.start(t); o.stop(t + 0.18);
  } else if (kind === "fireball") {
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.3);
    const f = audio.createBiquadFilter(); f.type = "bandpass";
    f.frequency.setValueAtTime(600, t); f.frequency.exponentialRampToValueAtTime(1800, t + 0.25);
    src.connect(f); f.connect(out);
    out.gain.setValueAtTime(0.2, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    src.start(t); src.stop(t + 0.3);
  } else if (kind === "door") {
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.5);
    const f = audio.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 4;
    f.frequency.setValueAtTime(120, t); f.frequency.exponentialRampToValueAtTime(900, t + 0.45);
    src.connect(f); f.connect(out);
    out.gain.setValueAtTime(0.35, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    src.start(t); src.stop(t + 0.5);
  } else if (kind === "doorClose") {
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.4);
    const f = audio.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 4;
    f.frequency.setValueAtTime(800, t); f.frequency.exponentialRampToValueAtTime(110, t + 0.35);
    src.connect(f); f.connect(out);
    out.gain.setValueAtTime(0.3, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    src.start(t); src.stop(t + 0.4);
    const o = audio.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(90, t + 0.35); o.frequency.exponentialRampToValueAtTime(45, t + 0.5);
    const og = audio.createGain(); og.gain.setValueAtTime(0.0001, t);
    og.gain.setValueAtTime(0.5, t + 0.35); og.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
    o.connect(og); og.connect(master);
    o.start(t); o.stop(t + 0.55);
  } else if (kind === "sight") {
    const o = audio.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(420, t + 0.12);
    o.frequency.exponentialRampToValueAtTime(110, t + 0.35);
    o.connect(out);
    out.gain.setValueAtTime(0.22, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    o.start(t); o.stop(t + 0.4);
  } else if (kind === "growl") {
    const o = audio.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(65, t + 0.3);
    const f = audio.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 400;
    o.connect(f); f.connect(out);
    out.gain.setValueAtTime(0.12, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.start(t); o.stop(t + 0.33);
  } else if (kind === "boom") {
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.6);
    const f = audio.createBiquadFilter(); f.type = "lowpass";
    f.frequency.setValueAtTime(1200, t); f.frequency.exponentialRampToValueAtTime(80, t + 0.55);
    src.connect(f); f.connect(out);
    out.gain.setValueAtTime(0.7, t); out.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    src.start(t); src.stop(t + 0.6);
    const o = audio.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.4);
    const og = audio.createGain();
    og.gain.setValueAtTime(0.8, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(og); og.connect(master);
    o.start(t); o.stop(t + 0.46);
  }
}

// repo. The local id OST remains a fallback, then the synth loop.

// The shipped soundtrack as a playlist the player can navigate. Levels
// still pick their own track, but prev/next moves freely from there.
const PLAYLIST = [
  { f: "alec_koff-doom-metal-trailer-493404.mp3",                            name: "DOOM METAL TRAILER" },
  { f: "alec_koff-first-person-shooter-484516.mp3",                          name: "FIRST PERSON SHOOTER" },

  { f: "nickpanek-70s-doom-metal-instrumental-dark-amp-heavy-riffs-309467.mp3", name: "70S DOOM METAL" },

const LEVEL_ROTATION = [1, 2, 3, 4, 5, 6];   // playlist slots levels cycle through
const BOSS_LEVELS = new Set([7, 16, 25]);    // E1M8, E2M8, E3M8

let musicVol = 0.5, sfxVol = 0.5;            // both start at half
let musicOn = true, musicPaused = false, musicSynth = false;
let trackIdx = 0, musicChain = [], musicChainIdx = 0;
try {
  const saved = JSON.parse(localStorage.getItem("doomAudio") || "null");
  if (saved) {
    if (typeof saved.musicVol === "number") musicVol = saved.musicVol;
    if (typeof saved.sfxVol === "number") sfxVol = saved.sfxVol;
    if (typeof saved.musicOn === "boolean") musicOn = saved.musicOn;
  }
} catch {}
function saveAudioPrefs() {
  try { localStorage.setItem("doomAudio", JSON.stringify({ musicVol, sfxVol, musicOn })); } catch {}
}

// ---------------------------------------------------------
// Automap preferences. Size is a multiplier on the cell size
// the level would otherwise get; the default is a quarter
// smaller than the map used to draw at.
// ---------------------------------------------------------
const MAP_SCALE_MIN = 0.4, MAP_SCALE_MAX = 1.6;
const MAP_ALPHA_MIN = 0.15;
let mapScale = 0.75, mapAlpha = 0.85, mapRotate = false;
try {
  const saved = JSON.parse(localStorage.getItem("doomMap") || "null");
  if (saved) {
    if (typeof saved.scale === "number") mapScale = saved.scale;
    if (typeof saved.alpha === "number") mapAlpha = saved.alpha;
    if (typeof saved.rotate === "boolean") mapRotate = saved.rotate;
  }
} catch {}
function saveMapPrefs() {
  try { localStorage.setItem("doomMap", JSON.stringify({ scale: mapScale, alpha: mapAlpha, rotate: mapRotate })); } catch {}
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
// the sliders run 0..1, so each setting maps onto that range
const getMapScale = () => (mapScale - MAP_SCALE_MIN) / (MAP_SCALE_MAX - MAP_SCALE_MIN);
const setMapScale = v => { mapScale = MAP_SCALE_MIN + clamp(v, 0, 1) * (MAP_SCALE_MAX - MAP_SCALE_MIN); saveMapPrefs(); };
const getMapAlpha = () => (mapAlpha - MAP_ALPHA_MIN) / (1 - MAP_ALPHA_MIN);
const setMapAlpha = v => { mapAlpha = MAP_ALPHA_MIN + clamp(v, 0, 1) * (1 - MAP_ALPHA_MIN); saveMapPrefs(); };
function toggleMapRotate() { mapRotate = !mapRotate; saveMapPrefs(); }
const musicEl = new Audio();
musicEl.loop = true;
musicEl.volume = musicVol;
musicEl.addEventListener("error", () => { musicChainIdx++; startChain(); });
function startChain() {
  if (musicChainIdx >= musicChain.length) { musicSynth = true; return; }
  musicSynth = false;
  musicEl.src = encodeURI(musicChain[musicChainIdx]);
  musicEl.loop = true;
  musicEl.volume = musicVol;
  if (musicOn && !musicPaused) musicEl.play().catch(() => {});
}
function playTrack(i, fallback = [], force = false) {
  const n = ((i % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
  const url = MUSIC_DIR + PLAYLIST[n].f;
  if (!force && !musicSynth && trackIdx === n && musicEl.src.endsWith(encodeURI(url))) {
    if (musicOn && !musicPaused && musicEl.paused) musicEl.play().catch(() => {});
    return;
  }
  trackIdx = n;
  musicChain = [url, ...fallback];
  musicChainIdx = 0;
  startChain();
}
const levelMusic   = idx => playTrack(BOSS_LEVELS.has(idx) ? TRACK_BOSS : LEVEL_ROTATION[idx % LEVEL_ROTATION.length],
                                     [OST_DIR + LEVELS[idx].music]);
const titleMusic   = () => playTrack(TRACK_TITLE,   [OST_DIR + MUSIC_TITLE]);
const interMusic   = () => playTrack(TRACK_TITLE,   [OST_DIR + MUSIC_INTER]);
const victoryMusic = () => playTrack(TRACK_VICTORY, [OST_DIR + MUSIC_VICTORY]);
const trackName    = () => PLAYLIST[trackIdx].name;
function musicSkip(d) {
  musicPaused = false;
  playTrack(trackIdx + d, [], true);
  showMsg(trackName());
}
function musicTogglePlay() {
  musicPaused = !musicPaused;
  if (musicPaused) musicEl.pause();
  else if (musicOn) { musicEl.play().catch(() => {}); showMsg(trackName()); }
}
function setMusicVol(v) {
  musicVol = Math.max(0, Math.min(1, v));
  musicEl.volume = musicVol;
  saveAudioPrefs();
}
function setSfxVol(v) { sfxVol = Math.max(0, Math.min(1, v)); saveAudioPrefs(); }
function toggleMusic() {
  musicOn = !musicOn;
  if (!musicOn) musicEl.pause();
  else if (!musicSynth && !musicPaused) musicEl.play().catch(() => {});
  saveAudioPrefs();
}

// Synth fallback music: original compositions, not the id tracks
// (those are copyrighted). In-game: a driving A-minor chug.
// Title / pause: a slow, ominous low drone.
let musicGain = null, musicNext = 0, musicStep = 0, musicSlow = false;
const RIFF_PLAY = [
  110.00, 110.00, 164.81, 110.00, 98.00, 110.00, 130.81, 110.00,
  110.00, 110.00, 146.83, 130.81, 110.00, 98.00, 82.41, 110.00,
];
const RIFF_TITLE = [   // sparse A1 drone leaning on tritone/minor colors
  55.00, 0, 0, 82.41, 0, 55.00, 77.78, 0,
  55.00, 0, 0, 87.31, 0, 55.00, 65.41, 0,
];
function musicScheduleStep(step, t, slow) {
  const freq = (slow ? RIFF_TITLE : RIFF_PLAY)[step];
  if (freq) {
    const o = audio.createOscillator(); o.type = "sawtooth";
    o.frequency.value = freq;
    const o2 = audio.createOscillator();
    o2.type = slow ? "triangle" : "square";
    o2.frequency.value = slow ? freq * 2 : freq / 2;
    const f = audio.createBiquadFilter(); f.type = "lowpass";
    const dur = slow ? 0.95 : 0.19;
    f.frequency.setValueAtTime(slow ? 500 : 900, t);
    f.frequency.exponentialRampToValueAtTime(slow ? 170 : 300, t + dur * 0.85);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(slow ? 0.42 : 0.5, t + (slow ? 0.09 : 0.006));
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05); o2.start(t); o2.stop(t + dur + 0.05);
  }
  if (!slow && step % 4 === 0) {   // kick on quarters (gameplay only)
    const o = audio.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.1);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + 0.13);
  }
  if (slow && step === 0) {   // deep distant boom once per bar on the title
    const o = audio.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.7);
    const g = audio.createGain();
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    o.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + 0.85);
  }
  if (!slow && step % 2 === 1) {   // hats on the offbeats (gameplay only)
    const src = audio.createBufferSource(); src.buffer = noiseBuffer(0.03);
    const f = audio.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6000;
    const g = audio.createGain();
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    src.connect(f); f.connect(g); g.connect(musicGain);
    src.start(t); src.stop(t + 0.04);
  }
}
setInterval(() => {
  const wantsMusic = gameState === "play" || gameState === "title" || gameState === "paused";
  if (!audio || audio.state !== "running" || !musicOn || musicPaused || !musicSynth || !wantsMusic) { musicNext = 0; return; }
  if (!musicGain) {
    musicGain = audio.createGain();
    musicGain.connect(audio.destination);
  }
  musicGain.gain.value = 0.7 * musicVol;   // the synth fallback follows the same slider
  const slow = gameState !== "play";
  if (slow !== musicSlow || musicNext < audio.currentTime) {   // mode change or drift: resync
    musicSlow = slow;
    musicStep = 0;
    musicNext = audio.currentTime + 0.06;
  }
  const stepDur = slow ? 0.42 : 0.214;   // ~70 vs ~140 bpm feel
  while (musicNext < audio.currentTime + 0.3) {
    musicScheduleStep(musicStep, musicNext, slow);
    musicStep = (musicStep + 1) % 16;
    musicNext += stepDur;
  }
}, 90);

function loadLevel() {

  doors.clear();

    const ch = L.rows[y][x];

    if (FLOOR_CHARS[ch]) { floorMap[y * MAP_W + x] = FLOOR_CHARS[ch]; continue; }
    const cx = x + 0.5, cy = y + 0.5;
    if      (ch === "P") { player.x = cx; player.y = cy; player.ang = 0; }
    else if (ch === "i") enemies.push(makeEnemy("imp", cx, cy));
    else if (ch === "p") enemies.push(makeEnemy("pinky", cx, cy));
    else if (ch === "n") enemies.push(makeEnemy("baron", cx, cy));
    else if (ch === "N") enemies.push(makeEnemy("knight", cx, cy));
    else if (ch === "g") enemies.push(makeEnemy("zombie", cx, cy));
    else if (ch === "Z") enemies.push(makeEnemy("sergeant", cx, cy));
    else if (ch === "o") enemies.push(makeEnemy("caco", cx, cy));
    else if (ch === "m") enemies.push(makeEnemy("lostsoul", cx, cy));
    else if (ch === "y") enemies.push(makeEnemy("cyber", cx, cy));
    else if (ch === "q") enemies.push(makeEnemy("spider", cx, cy));
    else if (ch === "h") pickups.push({ kind: "medkit", spr: "medkit", x: cx, y: cy });
    else if (AMMO_PICKUPS[ch]) {
      const ap = AMMO_PICKUPS[ch];
      pickups.push({ kind: "ammo", spr: ap.kind, give: ap.give, x: cx, y: cy });
    }
    else if (WEAPON_PICKUPS[ch]) {
      const wpk = WEAPON_PICKUPS[ch];
      pickups.push({ kind: "weapon", spr: "wpn" + wpk.w, w: wpk.w, give: wpk.give, x: cx, y: cy });
    }
    else if (ch === "b") barrels.push({ x: cx, y: cy, hp: 20, fuse: -1 });
    else if (ch === "c") decors.push({ x: cx, y: cy, kind: "corpse" });
    else if (KEY_CHARS[ch]) pickups.push({ kind: KEY_CHARS[ch] + "key", x: cx, y: cy });

    if (!telePads[src].length || !telePads[dst].length) continue;
    const [dx, dy] = telePads[dst][0];
    for (const [sx, sy] of telePads[src]) {
      teleports.push({ x: sx, y: sy, dx, dy });
      floorMap[sy * MAP_W + sx] = 3;

  player.kills = 0;
  player.eyeDrop = 0; player.bobAmp = 0; player.bob = 0;
  player.hurtFlash = 0; player.pickFlash = 0;
  gameT = 0;

}
// Thin the level's monsters down to the slice this skill uses, then hand

function applySkillToSpawns() {
  const tier = SK().spawn, fast = SK().fast;

    if (BOSSES.has(e.type)) return true;

  { name: "ULTRA-VIOLENCE",       tag: "UV",    spawn: 2, dmgTake: 1,   ammoMul: 1, fast: 1, respawn: false },
  { name: "NIGHTMARE!",           tag: "NM",    spawn: 2, dmgTake: 1,   ammoMul: 2, fast: 2, respawn: true },

function canvasCoords(e) {

const keys = {};
addEventListener("keydown", e => {
  initAudio();
  maybeTitleMusic();
  if (gameState === "title" || gameState === "paused") {
    if (menuMode === "help") { menuMode = "main"; menuSel = 0; e.preventDefault(); return; }
    const n = menuItems().length;
    if (e.code === "ArrowUp" || e.code === "KeyW")   { menuSel = (menuSel + n - 1) % n; sfx("menuBlip", 0.7); }
    if (e.code === "ArrowDown" || e.code === "KeyS") { menuSel = (menuSel + 1) % n; sfx("menuBlip", 0.7); }
    if (e.code === "ArrowLeft" || e.code === "KeyA")  menuAdjust(-1);
    if (e.code === "ArrowRight" || e.code === "KeyD") menuAdjust(1);
    if (e.code === "Enter" || e.code === "Space") menuActivate();
    if (e.code === "Escape") menuBack();
    e.preventDefault();

  keys[e.code] = true;

  if (e.code === "KeyN") toggleMusic();
  // media keys during play, so the soundtrack is controllable mid-fight
  if (e.code === "BracketLeft" || e.code === "Comma") musicSkip(-1);
  if (e.code === "BracketRight" || e.code === "Period") musicSkip(1);
  if (e.code === "Backslash") musicTogglePlay();
  if (e.code === "Escape" && gameState === "play") pauseGame();
  if (e.code === "Escape" && (gameState === "dead" || gameState === "victory")) goToTitle();
  if (e.code === "KeyE") {
    if (gameState === "play") tryUse();
    else if (gameState === "intermission") {
      nextLevel();
      fireCooldown = Math.max(fireCooldown, 0.35);

  if (e.code === "Space" && gameState === "intermission") {

  if (e.code === "KeyR") {
    if (gameState === "dead") {

      resetLoadout();
      loadLevel();
      gameState = "play";
      levelMusic(levelIdx);
    } else if (gameState === "victory") {
      goToTitle();
    }
  }
  if (gameState === "play" && e.code.startsWith("Digit")) {
    const n = +e.code.slice(5) - 1;
    if (n >= 0 && n < WEAPONS.length && player.weapons[n] && n !== player.weapon) {

      if (w.ammoType && player.ammo[w.ammoType] < (w.use || 0)) sfx("noway", 0.4);

// Helpers

function hasLOS(x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const dist = Math.hypot(dx, dy);
  const steps = Math.ceil(dist * 6);
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    if (solidCell((x0 + dx * t) | 0, (y0 + dy * t) | 0)) return false;
  }
  return true;
}
// Returns how much of the requested move actually happened, 0..1, so a
// caller can tell it has walked into something.
function moveWithCollision(obj, dx, dy, radius) {
  const x0 = obj.x, y0 = obj.y;
  const nx = obj.x + dx, ny = obj.y + dy;
  if (!solidCell((nx + Math.sign(dx) * radius) | 0, obj.y | 0)) obj.x = nx;
  if (!solidCell(obj.x | 0, (ny + Math.sign(dy) * radius) | 0)) obj.y = ny;
  const want = Math.hypot(dx, dy);
  return want < 1e-9 ? 1 : Math.hypot(obj.x - x0, obj.y - y0) / want;
}
// Monsters shoulder plain doors open, the way they do in the original.
// Locked doors stay locked and secret doors stay secret.
function monsterOpenDoor(cx, cy, distToPlayerNow) {
  if (mapAt(cx, cy) !== 4) return;
  const bank = doorBank(cx, cy);
  const lead = doorRecord(bank[0], bank);
  if (lead.state === "opening" || lead.state === "open") return;
  for (const k of bank) doorRecord(k, bank).state = "opening";
  // only doors within earshot make a noise, or a big level turns into a
  // permanent racket of doors opening somewhere you cannot see
  if (distToPlayerNow < 14) sfx("door", volAt(distToPlayerNow) * 0.7);
}
// The contiguous run of identical door tiles that one doorway is made of.
function doorBank(cx, cy) {
  const t = mapAt(cx, cy);
  const keys = [cy * MAP_W + cx];
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    let x = cx + dx, y = cy + dy;
    while (mapAt(x, y) === t) { keys.push(y * MAP_W + x); x += dx; y += dy; }
  }
  return keys;
}
function doorRecord(key, bank) {
  let d = doors.get(key);
  if (!d) { d = { open: 0, state: "closed", timer: 0 }; doors.set(key, d); }
  if (bank) d.bank = bank;
  return d;
}

    if (t === 10) { showMsg("YOU FOUND A SECRET EXIT!"); exitLevel(true); return; }

      // contiguous bank together, or a wide corridor pinches to one cell.
      const bank = doorBank(cx, cy);

      if (lead.state === "closed" || lead.state === "closing") {

        sfx("doorClose");
      }
      return;
    }
    if (t !== 0) { sfx("noway", 0.6); return; }   // a plain wall blocks the reach
  }
  sfx("noway", 0.4);
}
function updateDoors(dt) {
  for (const [key, d] of doors) {
    if (d.state === "opening") {
      d.open += dt * 1.6;
      if (d.open >= 1) { d.open = 1; d.state = "open"; d.timer = 4; }
    } else if (d.state === "open") {
      d.timer -= dt;
      if (d.timer <= 0) {
        if (bankOccupied(d, key)) d.timer = 1;
        else {
          d.state = "closing";
          const cx = key % MAP_W + 0.5, cy = ((key / MAP_W) | 0) + 0.5;
          sfx("doorClose", volAt(distToPlayer(cx, cy)));
        }
      }
    } else if (d.state === "closing") {
      if (bankOccupied(d, key)) { d.state = "opening"; continue; }
      d.open -= dt * 1.6;
      if (d.open <= 0) { d.open = 0; d.state = "closed"; }
    }
  }
}

function damageEnemy(e, amt, dist) {
  if (e.dead || e.state === "dying" || amt <= 0) return;
  e.hp -= amt;
  if (e.hp <= 0) { e.state = "dying"; e.stateT = 0; sfx(e.sfxDie, volAt(dist)); return; }
  // Every hit staggers an ordinary monster for 0.3s. A boss with that
  // rule is a statue: chaingun or plasma re-triggers the flinch faster
  // than it wears off, so it never gets a shot away. painChance 0 means
  // it never flinches - it still grunts, so hits read, and a hit still
  // wakes it.
  if (e.painChance !== undefined && Math.random() >= e.painChance) {
    if (e.state === "idle") { e.state = "chase"; e.stateT = 0; sfx(e.sfxSight, volAt(dist)); }
    else if (!(e.gruntT > 0)) { e.gruntT = 0.7; sfx(e.sfxPain, volAt(dist) * 0.7); }
    return;
  }
  e.state = "pain"; e.stateT = 0; sfx(e.sfxPain, volAt(dist));
}
function collectTargets() {
  const targets = [];
  for (const e of enemies) if (!e.dead && e.state !== "dying") targets.push({ o: e, r: 0.35, isBarrel: false });
  for (const b of barrels) if (b.fuse < 0) targets.push({ o: b, r: 0.3, isBarrel: true });
  return targets;
}
function hurtTarget(tgt, dmg, dist) {
  if (tgt.isBarrel) {
    tgt.o.hp -= dmg;
    if (tgt.o.hp <= 0 && tgt.o.fuse < 0) tgt.o.fuse = 0.02;
  } else {
    damageEnemy(tgt.o, dmg, dist !== undefined ? dist : distToPlayer(tgt.o.x, tgt.o.y));
  }
}
function nearestTarget(maxDist, maxAng) {
  let best = null, bd = maxDist;
  for (const tgt of collectTargets()) {
    const dx = tgt.o.x - player.x, dy = tgt.o.y - player.y;
    const dist = Math.hypot(dx, dy);
    let da = Math.atan2(dy, dx) - player.ang;
    while (da >  Math.PI) da -= 2 * Math.PI;
    while (da < -Math.PI) da += 2 * Math.PI;
    if (dist < bd && Math.abs(da) < maxAng) { best = tgt; bd = dist; }
  }
  return best;
}
// The order the original falls back through when a weapon runs out.
const AUTO_SWITCH = [5, 3, 2, 1, 7, 4, 6, 0];
function switchToArmedWeapon() {
  for (const n of AUTO_SWITCH) {
    if (n === player.weapon || !player.weapons[n]) continue;
    const w = WEAPONS[n];
    if (w.ammoType && player.ammo[w.ammoType] < (w.use || 0)) continue;
    player.weapon = n;
    fireCooldown = Math.max(fireCooldown, 0.3);
    gunFireT = 99;
    sfx(n === 7 ? "sawup" : "sgcock", 0.7);
    return true;
  }
  return false;
}
function hitscanShot(jitter, dmg) {
  const ang = player.ang + jitter;
  let best = null, bestDist = Infinity;
  for (const tgt of collectTargets()) {
    const dx = tgt.o.x - player.x, dy = tgt.o.y - player.y;
    const dist = Math.hypot(dx, dy);
    let da = Math.atan2(dy, dx) - ang;
    while (da >  Math.PI) da -= 2 * Math.PI;
    while (da < -Math.PI) da += 2 * Math.PI;
    if (Math.abs(da) < Math.atan2(tgt.r, dist) && dist < bestDist && hasLOS(player.x, player.y, tgt.o.x, tgt.o.y)) {
      best = tgt; bestDist = dist;
    }
  }
  if (best) hurtTarget(best, dmg, bestDist);
}
function explodeAt(x, y, radius, dmg, hurtSelf) {
  effects.push({ x, y, t: 0, kind: "boom" });
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - x, e.y - y);
    if (d < radius) damageEnemy(e, (dmg * (1 - d / radius)) | 0, distToPlayer(e.x, e.y));
  }
  for (const b of barrels)
    if (b.fuse < 0 && Math.hypot(b.x - x, b.y - y) < radius) b.fuse = 0.1 + Math.random() * 0.1;
  if (hurtSelf) {
    const pd = distToPlayer(x, y);
    if (pd < radius * 0.8) {
      player.hp -= dmgToPlayer((dmg * 0.5 * (1 - pd / (radius * 0.8))) | 0);
      player.hurtFlash = 0.35; faceTimer = 0.8;
      sfx("playerPain", 0.8);
    }
  }
}
function explodeBarrel(b) {
  effects.push({ x: b.x, y: b.y, t: 0, kind: "boom" });
  const pd = distToPlayer(b.x, b.y);
  sfx("barrel", volAt(pd));
  if (pd < 2.2) {
    player.hp -= dmgToPlayer((50 * (1 - pd / 2.2)) | 0);
    player.hurtFlash = 0.4; faceTimer = 0.8;
    sfx("playerPain", 0.9);
  }
  for (const e of enemies) {
    if (e.dead) continue;
    const d = Math.hypot(e.x - b.x, e.y - b.y);
    if (d < 2.2) damageEnemy(e, (90 * (1 - d / 2.2)) | 0, distToPlayer(e.x, e.y));
  }
  for (const ob of barrels) {   // chain reaction
    if (ob !== b && ob.fuse < 0 && Math.hypot(ob.x - b.x, ob.y - b.y) < 1.8)
      ob.fuse = 0.12 + Math.random() * 0.15;
  }
}

// ---------------------------------------------------------
// Update
// ---------------------------------------------------------
function update(dt) {
  if (gameState !== "play") return;
  gameT += dt;

  updateDoors(dt);

  // --- player movement ---
  const run = keys["ShiftLeft"] || keys["ShiftRight"] ? 1.7 : 1;
  const speed = 3.2 * run * dt;
  const turn = 2.6 * dt;
  if (keys["ArrowLeft"])  player.ang -= turn;
  if (keys["ArrowRight"]) player.ang += turn;
  let mx = 0, my = 0;
  const cos = Math.cos(player.ang), sin = Math.sin(player.ang);
  if (keys["KeyW"] || keys["ArrowUp"])   { mx += cos; my += sin; }
  if (keys["KeyS"] || keys["ArrowDown"]) { mx -= cos; my -= sin; }
  if (keys["KeyA"]) { mx += sin; my -= cos; }
  if (keys["KeyD"]) { mx -= sin; my += cos; }
  const ml = Math.hypot(mx, my);
  if (ml > 0) {
    moveWithCollision(player, mx / ml * speed, my / ml * speed, 0.25);
    player.bob += dt * 9 * run;
  }
  // Freezing the bob mid-stride leaves the weapon hanging off to one side.
  // Fading its amplitude instead lets the gun settle back to centre.
  player.bobAmp += ((ml > 0 ? 1 : 0) - player.bobAmp) * Math.min(1, dt * 8);
  if (player.ang > Math.PI) player.ang -= 2 * Math.PI;
  else if (player.ang < -Math.PI) player.ang += 2 * Math.PI;

  // --- firing ---
  fireCooldown -= dt;
  muzzle -= dt;
  gunFireT += dt;
  if ((keys["Space"] || mouseDown) && fireCooldown <= 0) {
    const wp = WEAPONS[player.weapon];
    const cost = wp.use || 0;
    if (!wp.ammoType || player.ammo[wp.ammoType] >= cost) {
      if (wp.ammoType) player.ammo[wp.ammoType] -= cost;
      fireCooldown = wp.rate; muzzle = 0.08; faceTimer = 0.6;
      gunFireT = 0;
      sfx(wp.sfx);
      if (wp.name === "SHOTGUN") setTimeout(() => {
        if (gameState === "play" && WEAPONS[player.weapon].name === "SHOTGUN") sfx("sgcock", 0.8);
      }, 550);
      if (wp.melee) {
        const tgt = nearestTarget(1.4, 0.6);
        if (tgt) hurtTarget(tgt, wp.dmg + (Math.random() * wp.rnd | 0));
      } else if (wp.proj) {
        pProjectiles.push({
          x: player.x + Math.cos(player.ang) * 0.4,
          y: player.y + Math.sin(player.ang) * 0.4,
          vx: Math.cos(player.ang) * wp.pspeed,
          vy: Math.sin(player.ang) * wp.pspeed,
          wp,
        });
      } else {
        const shots = wp.pellets || 1;
        for (let s = 0; s < shots; s++)
          hitscanShot((wp.spread || 0.015) * (Math.random() * 2 - 1), wp.dmg + (Math.random() * wp.rnd | 0));
      }
    } else if (!switchToArmedWeapon()) {
      fireCooldown = 0.3;
      sfx("noway", 0.25);
    }
  }
  // dry after that shot? change weapon now rather than on the next trigger
  const held = WEAPONS[player.weapon];
  if (held.ammoType && player.ammo[held.ammoType] < (held.use || 0)) switchToArmedWeapon();

  // --- player projectiles ---
  for (let i = pProjectiles.length - 1; i >= 0; i--) {
    const p = pProjectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    let hit = solidCell(p.x | 0, p.y | 0);
    let victim = null;
    if (!hit) {
      for (const tgt of collectTargets()) {
        if (Math.hypot(tgt.o.x - p.x, tgt.o.y - p.y) < tgt.r + 0.15) { victim = tgt; hit = true; break; }
      }
    }
    if (!hit) continue;
    if (victim) hurtTarget(victim, p.wp.dmg + (Math.random() * p.wp.rnd | 0));
    if (p.wp.splash) {
      sfx("rocketHit", volAt(distToPlayer(p.x, p.y)));
      explodeAt(p.x, p.y, p.wp.splash, p.wp.splashDmg, p.wp.name === "ROCKET LAUNCHER");
    } else {
      sfx("fireballHit", volAt(distToPlayer(p.x, p.y)) * 0.6);
      effects.push({ x: p.x, y: p.y, t: 0.2, kind: "puff" });
    }
    pProjectiles.splice(i, 1);
  }

  // --- barrels & effects ---
  for (const b of barrels) {
    if (b.fuse >= 0) {
      b.fuse -= dt;
      if (b.fuse <= 0 && !b.boomed) { b.boomed = true; explodeBarrel(b); }
    }
  }
  barrels = barrels.filter(b => !b.boomed);
  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].t += dt;
    if (effects[i].t > 0.45) effects.splice(i, 1);
  }

  // --- liquid floors & teleporters ---
  const floorType = floorMap[(player.y | 0) * MAP_W + (player.x | 0)];
  if (floorType === 2) {
    nukeTimer -= dt;
    if (nukeTimer <= 0) {
      nukeTimer = 0.7;
      player.hp -= dmgToPlayer(5);
      player.hurtFlash = Math.max(player.hurtFlash, 0.2);
      faceTimer = 0.5;
      sfx("playerPain", 0.5);
    }
  } else nukeTimer = 0.2;
  teleCooldown -= dt;
  if (teleCooldown <= 0) {
    for (const tp of teleports) {
      if ((player.x | 0) === tp.x && (player.y | 0) === tp.y) {
        effects.push({ x: player.x, y: player.y, t: 0, kind: "telefog" });
        player.x = tp.dx + 0.5; player.y = tp.dy + 0.5;
        effects.push({ x: player.x, y: player.y, t: 0, kind: "telefog" });
        teleCooldown = 1.2;
        player.pickFlash = 0.3;
        sfx("teleport");
        break;
      }
    }
  }
  msgT = Math.max(0, msgT - dt);

  // Step down into a pool and back out again, rather than snapping.
  const standingIn = floorMap[(player.y | 0) * MAP_W + (player.x | 0)];
  const wantDrop = (standingIn === 1 || standingIn === 2) ? LIQUID_DROP : 0;
  player.eyeDrop += (wantDrop - player.eyeDrop) * Math.min(1, dt * 12);

  // --- enemies ---
  for (const e of enemies) {
    if (e.dead) {
      // Nightmare: they get back up where they fell in
      if (e.respawnT > 0 && (e.respawnT -= dt) <= 0) respawnEnemy(e);
      continue;
    }
    e.stateT += dt;
    if (e.gruntT > 0) e.gruntT -= dt;
    if (e.state === "dying") {
      if (e.stateT > 0.45) {
        e.dead = true; player.kills++;
        if (SK().respawn) e.respawnT = RESPAWN_DELAY;
        // On Nightmare the same monster dies over and over on the same
        // tile, so cap the corpse trail and don't stack a second identical
        // drop where one is already lying uncollected.
        if (e.corpse && sprites[e.corpse]) {
          decors.push({ x: e.x, y: e.y, spr: e.corpse, fromKill: true });
          if (decors.length > MAX_CORPSES) {
            const oldest = decors.findIndex(d => d.fromKill);
            if (oldest >= 0) decors.splice(oldest, 1);
          }
        }
        const drop = ENEMY_DROPS[e.type];
        const alreadyThere = SK().respawn &&
          pickups.some(pk => pk.spr === drop?.spr && Math.hypot(pk.x - e.x, pk.y - e.y) < 0.9);
        if (drop && !alreadyThere && Math.random() < drop.chance)
          pickups.push({ kind: "ammo", spr: drop.spr, give: drop.give, x: e.x, y: e.y });
      }
      continue;
    }
    if (e.state === "pain") {
      if (e.stateT > 0.3) { e.state = "chase"; e.stateT = 0; }
      continue;
    }
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    const los = dist < 14 && hasLOS(e.x, e.y, player.x, player.y);

    if (e.state === "idle") {
      if (los && dist < 10) { e.state = "chase"; e.stateT = 0; sfx(e.sfxSight, volAt(dist)); }
      continue;
    }
    if (e.state === "attack") {
      if (e.stateT > 0.4) { e.state = "chase"; e.stateT = 0; }
      continue;
    }
    // chase
    e.attackT -= dt;
    // How close a shooter will let you get before it stops firing.
    // Ordinary monsters hold you off at arm's length; a boss has no
    // safe pocket to hide in, so hugging it no longer defangs it.
    const minR = e.minRange !== undefined ? e.minRange : 2.5;
    if (e.ranged && los && dist > minR && e.attackT <= 0) {
      e.state = "attack"; e.stateT = 0; e.attackT = e.cool + Math.random() * 0.6;
      const base = Math.atan2(dy, dx);
      const ps = e.pspeed || 6;
      const shots = e.volley || 1, spread = e.spread || 0.12;
      for (let s = 0; s < shots; s++) {
        const pa = base + (shots === 1 ? (Math.random() - 0.5) * spread : (s - (shots - 1) / 2) * spread);
        projectiles.push({ x: e.x, y: e.y, vx: Math.cos(pa) * ps, vy: Math.sin(pa) * ps, dmg: e.dmg, img: e.ball });
      }
      sfx(e.atkSfx, volAt(dist));
    } else if (!e.ranged && dist < 1.1 && e.attackT <= 0) {
      e.state = "attack"; e.stateT = 0; e.attackT = e.cool;
      player.hp -= dmgToPlayer(e.dmg);
      player.hurtFlash = 0.35; faceTimer = 0.8;
      sfx(e.atkSfx);
      sfx("playerPain", 0.9);
    } else if (dist > (e.ranged ? minR + 1 : 0.8)) {
      if (dist < 9 && Math.random() < dt * 0.18) sfx(e.sfxAct, volAt(dist) * 0.7);
      const step = e.speed * dt;
      let vx = dx / dist, vy = dy / dist;
      if (!los) {
        const wob = Math.sin(gameT * 2.5 + e.x * 7) * 0.8;
        const tx = vx * Math.cos(wob) - vy * Math.sin(wob);
        vy = vx * Math.sin(wob) + vy * Math.cos(wob);
        vx = tx;
      }
      // Walking straight at the player wedges a monster on any corner
      // between the two of them. When one stops making progress it picks
      // a side and commits to it for a moment, which walks it round the
      // obstacle instead of grinding against it.
      if (e.detourT > 0) {
        e.detourT -= dt;
        const a = e.detour * 1.15;
        const tx = vx * Math.cos(a) - vy * Math.sin(a);
        vy = vx * Math.sin(a) + vy * Math.cos(a);
        vx = tx;
      }
      monsterOpenDoor((e.x + vx * 0.55) | 0, (e.y + vy * 0.55) | 0, dist);
      if (moveWithCollision(e, vx * step, vy * step, 0.3) < 0.35 && e.detourT <= 0) {
        e.detour = (e.x * 7 + e.y * 13 + gameT) % 2 < 1 ? 1 : -1;
        e.detourT = 0.5 + (e.x * 3 % 1) * 0.7;
      }
    }
  }

  // --- projectiles ---
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (solidCell(p.x | 0, p.y | 0)) {
      sfx(p.img === "rocket" ? "rocketHit" : "fireballHit", volAt(distToPlayer(p.x, p.y)) * 0.8);
      if (p.img === "rocket") effects.push({ x: p.x, y: p.y, t: 0, kind: "boom" });
      projectiles.splice(i, 1);
      continue;
    }
    if (Math.hypot(p.x - player.x, p.y - player.y) < 0.4) {
      player.hp -= dmgToPlayer(p.dmg);
      player.hurtFlash = 0.35; faceTimer = 0.8;
      sfx(p.img === "rocket" ? "rocketHit" : "fireballHit");
      if (p.img === "rocket") effects.push({ x: p.x, y: p.y, t: 0, kind: "boom" });
      sfx("playerPain", 0.9);
      projectiles.splice(i, 1);
    }
  }

  // --- pickups ---
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    if (Math.hypot(p.x - player.x, p.y - player.y) < 0.6) {
      if (p.kind === "medkit") {
        if (player.hp >= 100) continue;
        player.hp = Math.min(100, player.hp + 25);
      } else if (p.kind === "ammo") {
        let took = false;
        for (const [type, n] of Object.entries(p.give)) {
          if (player.ammo[type] < AMMO_MAX[type]) {
            player.ammo[type] = Math.min(AMMO_MAX[type], player.ammo[type] + n * SK().ammoMul);
            took = true;
          }
        }
        if (!took) continue;
      } else if (p.kind === "weapon") {
        for (const [type, n] of Object.entries(p.give))
          player.ammo[type] = Math.min(AMMO_MAX[type], player.ammo[type] + n * SK().ammoMul);
        if (!player.weapons[p.w]) {
          player.weapons[p.w] = true;
          player.weapon = p.w;
          fireCooldown = Math.max(fireCooldown, 0.3);
          showMsg("YOU GOT THE " + WEAPONS[p.w].name + "!");
        }
      } else {   // keycard
        const color = p.kind.slice(0, -3);
        player.keys[color] = true;
        showMsg("PICKED UP THE " + color.toUpperCase() + " KEYCARD");
      }
      player.pickFlash = 0.25;
      sfx("pickup");
      pickups.splice(i, 1);
    }
  }

  player.hurtFlash = Math.max(0, player.hurtFlash - dt);
  player.pickFlash = Math.max(0, player.pickFlash - dt);
  faceTimer = Math.max(0, faceTimer - dt);

  if (player.hp <= 0) {
    player.hp = 0;
    gameState = "dead";
    sfx("playerDie");
  }
}

// ---------------------------------------------------------
// Render: walls + floor/ceiling into pixel buffer
// ---------------------------------------------------------
function shade(px, f) {
  if (f >= 1) return px;
  const r = (px & 0xff) * f, g = ((px >> 8) & 0xff) * f, b = ((px >> 16) & 0xff) * f;
  return 0xff000000 | (b << 16) | (g << 8) | r;
}

function renderWorld() {
  const dirX = Math.cos(player.ang), dirY = Math.sin(player.ang);
  const planeX = -dirY * Math.tan(FOV / 2), planeY = dirX * Math.tan(FOV / 2);
  const posX = player.x, posY = player.y;
  const half = VIEW_H / 2;
  const bobOff = (gameState === "play" ? Math.sin(player.bob) * 3 * player.bobAmp : 0) | 0;
  const horizon = half + bobOff;
  // Eye height above the walking surface. Wading into a pool lowers it,
  // which is what makes the step down read as a step rather than a
  // texture swap. Everything projected off the floor - the floor itself,
  // the ceiling, wall tops and bottoms, sprite feet - keys off this.
  const eyeH = 0.5 - player.eyeDrop;

  // --- floor & ceiling casting (per row) ---
  const fData = floorTex.data, cData = ceilTex.data;
  const wLiq = waterTex.data, nLiq = nukeTex.data, pPad = padTex.data;
  const liqT = gameT * 0.35;
  const liqAt = (x, y) => (x >= 0 && y >= 0 && x < MAP_W && y < MAP_H)
    ? (floorMap[y * MAP_W + x] === 1 || floorMap[y * MAP_W + x] === 2) : false;
  const RIM = 0.11;   // width of the shaded lip inside a pool's edge
  for (let y = 0; y < VIEW_H; y++) {
    const isFloor = y > horizon;
    const p = isFloor ? (y - horizon) : (horizon - y);
    if (p <= 0) continue;
    const rowDist = VIEW_H * (isFloor ? eyeH : 1 - eyeH) / p;
    const fog = Math.min(1, 2.1 / rowDist) * (isFloor ? 0.8 : 0.55);
    const stepX = rowDist * (2 * planeX) / W;
    const stepY = rowDist * (2 * planeY) / W;
    let fx = posX + rowDist * (dirX - planeX);
    let fy = posY + rowDist * (dirY - planeY);
    const rowBase = y * W;
    if (!isFloor) {
      for (let x = 0; x < W; x++) {
        const tx = ((fx - Math.floor(fx)) * TEX) | 0;
        const ty = ((fy - Math.floor(fy)) * TEX) | 0;
        fb[rowBase + x] = shade(cData[ty * TEX + tx], fog);
        fx += stepX; fy += stepY;
      }
    } else {
      // The sunken plane is further away for the same screen row, so the
      // same pixel is cast twice: once against the surface you walk on,
      // once against the bottom of the pit. Ground wins wherever there is
      // ground, because it is nearer. Over a pool the ray carries on down
      // to the liquid - and where it runs out past the far edge of the
      // pool before it gets there, what we are looking at is the inside
      // wall of the pit.
      const sunkDist = VIEW_H * (eyeH + LIQUID_DROP) / p;
      const sStepX = sunkDist * (2 * planeX) / W;
      const sStepY = sunkDist * (2 * planeY) / W;
      let sx = posX + sunkDist * (dirX - planeX);
      let sy = posY + sunkDist * (dirY - planeY);
      const sunkFog = Math.min(1, 2.1 / sunkDist) * 0.8;
      for (let x = 0; x < W; x++) {
        const cx = fx | 0, cy = fy | 0;
        const ft = (cx >= 0 && cy >= 0 && cx < MAP_W && cy < MAP_H) ? floorMap[cy * MAP_W + cx] : 0;
        let tex = fData, u = fx, v = fy, br = fog;
        if (ft === 3) { tex = pPad; br = Math.min(1, fog * 1.4); }
        else if (ft === 0) {
          // a shaded curb on the dry side of every pool edge, so the pool
          // is visibly walled off from the floor it sits in
          const cu = fx - cx, cv = fy - cy;
          if ((cu < RIM && liqAt(cx - 1, cy)) || (cu > 1 - RIM && liqAt(cx + 1, cy)) ||
              (cv < RIM && liqAt(cx, cy - 1)) || (cv > 1 - RIM && liqAt(cx, cy + 1)))
            br *= 0.5;
        }
        else if (ft === 1 || ft === 2) {
          const scx = sx | 0, scy = sy | 0;
          const fs = (scx >= 0 && scy >= 0 && scx < MAP_W && scy < MAP_H) ? floorMap[scy * MAP_W + scx] : 0;
          if (fs === 1 || fs === 2) {
            tex = fs === 1 ? wLiq : nLiq;
            u = sx + liqT; v = sy + liqT * 0.6;
            br = Math.min(1, sunkFog * 1.5);
            // a shaded lip just inside the pool's edge, so the pool reads
            // as contained rather than as a puddle lying on the floor
            const eu = sx - scx, ev = sy - scy;
            if ((eu < RIM && !liqAt(scx - 1, scy)) || (eu > 1 - RIM && !liqAt(scx + 1, scy)) ||
                (ev < RIM && !liqAt(scx, scy - 1)) || (ev > 1 - RIM && !liqAt(scx, scy + 1)))
              br *= 0.45;
          } else {
            // the inside wall of the pit, on its far side: stained by
            // whatever is pooled in it, so a narrow channel still reads as
            // liquid in shadow rather than as a black slot in the floor
            tex = ft === 1 ? wLiq : nLiq;
            u = sx; v = sy; br = fog * 0.42;
          }
        }
        const tx = ((u - Math.floor(u)) * TEX) | 0;
        const ty = ((v - Math.floor(v)) * TEX) | 0;
        fb[rowBase + x] = shade(tex[ty * TEX + tx], br);
        fx += stepX; fy += stepY; sx += sStepX; sy += sStepY;
      }
    }
  }

  // --- walls (DDA per column) ---
  for (let x = 0; x < W; x++) {
    const camX = 2 * x / W - 1;
    const rdX = dirX + planeX * camX;
    const rdY = dirY + planeY * camX;
    let mapX = posX | 0, mapY = posY | 0;
    const dX = Math.abs(1 / rdX), dY = Math.abs(1 / rdY);
    let stepX, stepY, sideX, sideY;
    if (rdX < 0) { stepX = -1; sideX = (posX - mapX) * dX; }
    else         { stepX = 1;  sideX = (mapX + 1 - posX) * dX; }
    if (rdY < 0) { stepY = -1; sideY = (posY - mapY) * dY; }
    else         { stepY = 1;  sideY = (mapY + 1 - posY) * dY; }
    let hit = 0, side = 0, doorShift = 0;
    while (!hit) {
      if (sideX < sideY) { sideX += dX; mapX += stepX; side = 0; }
      else               { sideY += dY; mapY += stepY; side = 1; }
      if (mapX >= 0 && mapY >= 0 && mapX < MAP_W && mapY < MAP_H)
        explored[mapY * MAP_W + mapX] = 1;   // fog of war: seen by this ray
      const t = mapAt(mapX, mapY);
      if (!t) continue;
      if (DOOR_TILES.has(t)) {
        // sliding door: the slab covers [0, 1-open) of the cell face
        const d = doors.get(mapY * MAP_W + mapX);
        const openness = d ? d.open : 0;
        if (openness > 0) {
          const pd = side === 0 ? sideX - dX : sideY - dY;
          let wx = side === 0 ? posY + pd * rdY : posX + pd * rdX;
          wx -= Math.floor(wx);
          if (wx + openness >= 1) continue;   // ray passes through the opening
          doorShift = openness;
        }
      }
      hit = t;
    }
    const perpDist = side === 0 ? sideX - dX : sideY - dY;
    zBuffer[x] = perpDist;

    const lineH = (VIEW_H / perpDist) | 0;
    const wallTop = horizon - lineH * (1 - eyeH), wallBot = horizon + lineH * eyeH;
    let drawStart = Math.max(0, wallTop | 0);
    let drawEnd = Math.min(VIEW_H - 1, wallBot | 0);

    let wallX = side === 0 ? posY + perpDist * rdY : posX + perpDist * rdX;
    wallX -= Math.floor(wallX);
    if (doorShift > 0) wallX = Math.min(0.999, wallX + doorShift);   // texture slides with the door
    let texX = (wallX * TEX) | 0;
    if ((side === 0 && rdX > 0) || (side === 1 && rdY < 0)) texX = TEX - texX - 1;

    const texEntry = textures[hit === 14 ? 1 : hit] || textures[1];   // secret doors look like stone
    const tex = texEntry.data;
    const step = TEX / lineH;
    let texPos = (drawStart - wallTop) * step;
    let fog = Math.min(1, 2.8 / perpDist);
    if (side === 1) fog *= 0.72;
    for (let y = drawStart; y <= drawEnd; y++) {
      const texY = Math.min(TEX - 1, texPos | 0);
      texPos += step;
      fb[y * W + x] = shade(tex[texY * TEX + texX], fog);
    }
  }

  // --- sprites (enemies, pickups, projectiles), far to near ---
  // Anything standing in a pool stands on the bottom of it, not on the
  // rim, so it drops by the same step the floor does.
  const liquidSink = (x, y) => liqAt(x | 0, y | 0) ? LIQUID_DROP : 0;
  const items = [];
  const animPick = (entry, phase) =>
    Array.isArray(entry) ? entry[Math.min(entry.length - 1, Math.max(0, Math.floor(phase * entry.length)))] : entry;
  for (const e of enemies) {
    if (e.dead) continue;
    const hover = e.float ? e.float + Math.sin(gameT * 2.5 + e.x * 3) * 0.05 : 0;
    let img, hScale = e.scale, sink = hover;
    if (e.state === "dying") {
      const t = Math.min(1, e.stateT / 0.45);
      const seq = e.death && sprites[e.death];
      if (Array.isArray(seq) && seq.length) {
        img = animPick(seq, t);          // art carries the fall: no squash
        sink = hover * (1 - t);
      } else {
        img = animPick(sprites[e.pain], 0);
        hScale = e.scale * (1 - t * 0.8);
        sink = t * 0.5 + hover * (1 - t);   // floaters drop as they die
      }
    }
    else if (e.state === "attack") img = animPick(sprites[e.attack], Math.min(0.999, e.stateT / 0.4));
    else if (e.state === "pain")   img = animPick(sprites[e.pain], 0);
    else {
      // walk cycle while chasing, first frame when idle
      const walking = e.state === "chase";
      const phase = walking ? (gameT * 7.7 + e.x * 7) % 1 : 0;
      img = animPick(sprites[e.idle], phase);
    }
    if (img) items.push({ x: e.x, y: e.y, img, hScale, sink: sink + liquidSink(e.x, e.y), lightFloor: e.lightFloor });
  }
  for (const p of pickups)     items.push({ x: p.x, y: p.y, img: sprites[p.spr || p.kind], hScale: 0.7, sink: 0.18 + liquidSink(p.x, p.y) });
  for (const p of projectiles) items.push({ x: p.x, y: p.y, img: sprites[p.img] || sprites.fireball, hScale: 0.5, sink: 0 });
  for (const p of pProjectiles) items.push({ x: p.x, y: p.y, img: sprites[p.wp.proj], hScale: p.wp.proj === "bfgball" ? 0.8 : 0.45, sink: 0, bright: true });
  for (const b of barrels)     items.push({ x: b.x, y: b.y, img: sprites.barrel, hScale: 0.8, sink: 0.12 + liquidSink(b.x, b.y) });
  // enemy corpses draw squashed low and wide, flat against the floor
  // enemy corpses draw squashed low and wide, flat against the floor
  for (const d of decors) {
    const raw = sprites[d.spr] || sprites.corpse;
    const img = Array.isArray(raw) ? raw[raw.length - 1] : raw;
    if (img) items.push({ x: d.x, y: d.y, img, hScale: d.spr ? 0.34 : 0.6, aspect: d.spr ? 1.9 : 1, sink: (d.spr ? 0.03 : 0.3) + liquidSink(d.x, d.y) });
  }
  for (const f of effects) items.push({
    x: f.x, y: f.y,
    img: f.kind === "telefog" ? sprites.telefog :
         f.kind === "puff" ? sprites.boom1 :
         (f.t < 0.18 ? sprites.boom1 : sprites.boom2),
    hScale: f.kind === "telefog" ? 1.0 : f.kind === "puff" ? 0.35 : 0.7 + f.t * 1.6,
    sink: 0, bright: true,
  });

  const invDet = 1 / (planeX * dirY - dirX * planeY);
  for (const s of items) {
    const sx = s.x - posX, sy = s.y - posY;
    s.tY = invDet * (-planeY * sx + planeX * sy);       // depth in camera space
    s.tX = invDet * (dirY * sx - dirX * sy);
    s.d2 = sx * sx + sy * sy;
  }
  items.sort((a, b) => b.d2 - a.d2);

  for (const s of items) {
    const transX = s.tX, transY = s.tY;
    if (transY <= 0.1) continue;
    const screenX = ((W / 2) * (1 + transX / transY)) | 0;
    const baseH = Math.abs((VIEW_H / transY)) | 0;
    const sprH = (baseH * s.hScale) | 0;
    const sprW = (sprH * (s.aspect || 1)) | 0;
    const vShift = (baseH * eyeH - sprH / 2 + s.sink * baseH) | 0;
    const drawStartY = Math.max(0, (horizon - sprH / 2 + vShift) | 0);
    const drawEndY = Math.min(VIEW_H - 1, (horizon + sprH / 2 + vShift) | 0);
    const drawStartX = Math.max(0, (screenX - sprW / 2) | 0);
    const drawEndX = Math.min(W - 1, (screenX + sprW / 2) | 0);
    // distance fog would sink the near-black boss art into a dark
    // arena floor; a light floor keeps the thing you must aim at visible
    const fog = s.bright ? 1 : Math.max(s.lightFloor || 0, Math.min(1, 2.8 / transY));
    for (let x = drawStartX; x <= drawEndX; x++) {
      if (transY >= zBuffer[x]) continue;
      const texX = (((x - (screenX - sprW / 2)) * SPR) / sprW) | 0;
      if (texX < 0 || texX >= SPR) continue;
      for (let y = drawStartY; y <= drawEndY; y++) {
        const texY = (((y - (horizon - sprH / 2 + vShift)) * SPR) / sprH) | 0;
        if (texY < 0 || texY >= SPR) continue;
        const px = s.img[texY * SPR + texX];
        if ((px >>> 24) < 128) continue;
        fb[y * W + x] = shade(px, fog);
      }
    }
  }

  ctx.putImageData(frame, 0, 0);
}

// ---------------------------------------------------------
// Render: weapon, HUD, overlays (canvas 2D on top)
// ---------------------------------------------------------
function renderWeapon() {
  const bobX = Math.sin(player.bob) * 8 * player.bobAmp;
  const bobY = Math.abs(Math.cos(player.bob)) * 6 * player.bobAmp;
  const gx = W / 2 + bobX, gy = VIEW_H + bobY - (muzzle > 0 ? 6 : 0);
  const w = player.weapon;
  // real weapon art when the local Guns/gifs/ frames are loaded
  const art = gunArt[w];
  let img = null, animating = false;
  if (art.frames && gunFireT < art.fireTotal) {
    // play the firing frames (1..n) with their own timings
    let t = gunFireT, idx = 1;
    while (idx < art.frames.length - 1 && t > art.durs[idx]) { t -= art.durs[idx]; idx++; }
    img = art.frames[idx];
    animating = true;
  } else {
    img = ((muzzle > 0 || gunFireT < 0.25) && art.fire) ? art.fire : art.idle;
  }
  if (img) {
    ctx.imageSmoothingEnabled = false;
    // one uniform on-screen size for every weapon, judged by the gun
    // content itself rather than the image frame
    const scale = (art.scale || Math.min(260 / img.width, 140 / img.height)) * (art.zoom || 1);
    const dw = img.width * scale, dh = img.height * scale;
    const dx = W / 2 - dw / 2 + bobX, dy = VIEW_H - dh + bobY + (muzzle > 0 ? -4 : 2);
    if (muzzle > 0 && !art.fire && !animating && !WEAPONS[w].melee) {   // generic flash when no firing art exists
      const col = w === 6 ? ["rgba(80,255,80,0.9)", "rgba(200,255,180,0.9)"]
               : ["rgba(255,220,80,0.9)", "rgba(255,255,200,0.9)"];
      ctx.fillStyle = col[0];
      ctx.beginPath(); ctx.ellipse(W / 2 + bobX, dy + 8, 20, 26, 0, 0, 7); ctx.fill();
      ctx.fillStyle = col[1];
      ctx.beginPath(); ctx.ellipse(W / 2 + bobX, dy + 10, 9, 13, 0, 0, 7); ctx.fill();
    }
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.imageSmoothingEnabled = true;
    return;
  }
  ctx.save();
  ctx.translate(gx, gy);
  if (muzzle > 0 && w !== 0) {   // muzzle flash (BFG/plasma get a green/blue tint)
    const col = w === 6 ? ["rgba(80,255,80,0.9)", "rgba(200,255,180,0.9)"]
             : w === 5 ? ["rgba(90,180,255,0.9)", "rgba(200,235,255,0.9)"]
             : ["rgba(255,220,80,0.9)", "rgba(255,255,200,0.9)"];
    ctx.fillStyle = col[0];
    ctx.beginPath(); ctx.ellipse(0, -86, 22, 30, 0, 0, 7); ctx.fill();
    ctx.fillStyle = col[1];
    ctx.beginPath(); ctx.ellipse(0, -84, 10, 16, 0, 0, 7); ctx.fill();
  }
  if (w === 0) {   // fist: swings forward while punching
    const px2 = muzzle > 0 ? -14 : 0, py2 = muzzle > 0 ? -26 : 0;
    ctx.fillStyle = "#c8906a";
    ctx.beginPath(); ctx.ellipse(34 + px2, -8 + py2, 15, 13, -0.3, 0, 7); ctx.fill();
    ctx.fillStyle = "#a87850";
    for (let i = 0; i < 4; i++) ctx.fillRect(22 + px2 + i * 7, -18 + py2, 5, 8);
  } else if (w === 1) {   // pistol
    ctx.fillStyle = "#23262b"; ctx.fillRect(-9, -80, 18, 46);
    ctx.fillStyle = "#3a3f46"; ctx.fillRect(-7, -80, 5, 46);
    ctx.fillStyle = "#2e3238"; ctx.fillRect(-16, -40, 32, 24);
    ctx.fillStyle = "#41464e"; ctx.fillRect(-16, -40, 32, 6);
  } else if (w === 2) {   // shotgun
    ctx.fillStyle = "#2e3238"; ctx.fillRect(-13, -92, 26, 52);
    ctx.fillStyle = "#43484f"; ctx.fillRect(-10, -92, 7, 52);
    ctx.fillStyle = "#5a4526"; ctx.fillRect(-16, -42, 32, 30);
    ctx.fillStyle = "#3a2c14"; ctx.fillRect(-16, -42, 32, 6);
  } else if (w === 3) {   // chaingun
    ctx.fillStyle = "#23262b";
    ctx.fillRect(-24, -78, 12, 44); ctx.fillRect(-6, -82, 12, 48); ctx.fillRect(12, -78, 12, 44);
    ctx.fillStyle = "#3a3f46";
    ctx.fillRect(-21, -78, 4, 44); ctx.fillRect(-3, -82, 4, 48); ctx.fillRect(15, -78, 4, 44);
    ctx.fillStyle = "#2e3238"; ctx.fillRect(-30, -36, 60, 22);
    ctx.fillStyle = "#41464e"; ctx.fillRect(-30, -36, 60, 6);
  } else if (w === 4) {   // rocket launcher
    ctx.fillStyle = "#3e4a30"; ctx.fillRect(-22, -88, 44, 60);
    ctx.fillStyle = "#28301e"; ctx.fillRect(-22, -88, 44, 10);
    ctx.fillStyle = "#15181a";
    ctx.beginPath(); ctx.ellipse(0, -84, 15, 8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#4e5c3c"; ctx.fillRect(-14, -50, 10, 22);
  } else if (w === 5) {   // plasma rifle
    ctx.fillStyle = "#3a4a5e"; ctx.fillRect(-18, -84, 36, 50);
    ctx.fillStyle = "#28343f"; ctx.fillRect(-18, -84, 36, 8);
    ctx.fillStyle = "#4fc3f7";
    ctx.fillRect(-12, -70, 24, 5); ctx.fillRect(-12, -58, 24, 5);
    ctx.fillStyle = "#23262b"; ctx.fillRect(-8, -90, 16, 8);
  } else if (w === 6) {   // BFG9000
    ctx.fillStyle = "#3e5a3e"; ctx.fillRect(-28, -86, 56, 56);
    ctx.fillStyle = "#28402a"; ctx.fillRect(-28, -86, 56, 10);
    ctx.fillStyle = "#1f8f1f";
    ctx.beginPath(); ctx.ellipse(0, -82, 17, 9, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#a8ff70";
    ctx.beginPath(); ctx.ellipse(0, -82, 8, 4, 0, 0, 7); ctx.fill();
  } else {   // chainsaw
    ctx.save();
    ctx.rotate(-0.45);
    ctx.fillStyle = "#6a6e76"; ctx.fillRect(-8, -95, 14, 70);
    ctx.fillStyle = "#33363c";
    for (let i = 0; i < 7; i++) ctx.fillRect(6, -92 + i * 10 + (muzzle > 0 ? 4 : 0), 4, 5);
    ctx.restore();
    ctx.fillStyle = "#8a2020"; ctx.fillRect(-24, -34, 48, 22);
    ctx.fillStyle = "#5a1414"; ctx.fillRect(-24, -34, 48, 6);
  }
  // hands
  ctx.fillStyle = "#4a3524";
  ctx.beginPath();
  ctx.moveTo(-12, -16); ctx.lineTo(14, -16); ctx.lineTo(24, 4); ctx.lineTo(-2, 4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c8906a";
  ctx.beginPath(); ctx.ellipse(6, -4, 16, 12, -0.4, 0, 7); ctx.fill();
  ctx.restore();
}

function drawDigits(text, x, y, size, color, align) {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px 'Courier New', monospace`;
  ctx.textBaseline = "middle";
  ctx.textAlign = align || "left";
  ctx.fillText(text, x, y);
  ctx.textAlign = "left";
}

function renderFace(cx, cy) {
  const hp = player.hp;
  const pain = faceTimer > 0;
  ctx.fillStyle = hp > 60 ? "#c8906a" : hp > 30 ? "#c07858" : "#a85a48";
  ctx.fillRect(cx - 16, cy - 20, 32, 40);
  ctx.fillStyle = "#6a4a28";
  ctx.fillRect(cx - 16, cy - 20, 32, 8);
  faceLook = pain ? 0 : Math.sin(performance.now() / 900) * 3;
  ctx.fillStyle = "#fff";
  ctx.fillRect(cx - 11, cy - 8, 9, pain ? 8 : 6);
  ctx.fillRect(cx + 2,  cy - 8, 9, pain ? 8 : 6);
  ctx.fillStyle = "#223";
  ctx.fillRect(cx - 8 + faceLook, cy - 7, 3, pain ? 6 : 4);
  ctx.fillRect(cx + 5 + faceLook, cy - 7, 3, pain ? 6 : 4);
  if (hp <= 60) {
    ctx.strokeStyle = "#3a2a18"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 12, cy - 12); ctx.lineTo(cx - 3, cy - 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 12, cy - 12); ctx.lineTo(cx + 3, cy - 9); ctx.stroke();
  }
  ctx.fillStyle = "#502820";
  if (pain)         ctx.fillRect(cx - 6, cy + 8, 12, 7);
  else if (hp > 60) ctx.fillRect(cx - 8, cy + 10, 16, 3);
  else              { ctx.fillRect(cx - 8, cy + 9, 16, 3); ctx.fillRect(cx - 10, cy + 7, 3, 3); }
  if (hp <= 30) {
    ctx.fillStyle = "#a01010";
    ctx.fillRect(cx - 14, cy - 2, 4, 10);
    ctx.fillRect(cx + 8, cy + 4, 4, 12);
  }
}

function renderHUD() {
  ctx.fillStyle = "#2a2a2a";
  ctx.fillRect(0, VIEW_H, W, HUD_H);
  ctx.fillStyle = "#151515";
  ctx.fillRect(0, VIEW_H, W, 3);
  ctx.strokeStyle = "#111";
  for (const x of [130, 240, 315, 390]) {
    ctx.beginPath(); ctx.moveTo(x, VIEW_H + 6); ctx.lineTo(x, H - 6); ctx.stroke();
  }
  const mid = VIEW_H + HUD_H / 2;
  const wpn = WEAPONS[player.weapon];
  drawDigits("AMMO", 20, mid - 14, 13, "#888");
  drawDigits(wpn.ammoType ? String(player.ammo[wpn.ammoType]) : "-", 20, mid + 10, 30, "#e03030");
  drawDigits("HEALTH", 140, mid - 14, 13, "#888");
  drawDigits(player.hp + "%", 140, mid + 10, 30, player.hp > 30 ? "#e03030" : "#ff6060");
  drawDigits("ARMS", 250, mid - 16, 13, "#888");
  for (let i = 2; i <= 8; i++) {
    const col = (i - 2) % 4, row = (i - 2) / 4 | 0;
    drawDigits(String(i), 248 + col * 15, mid + row * 18, 15, player.weapons[i - 1] ? "#e8c840" : "#555");
  }
  renderFace(345, mid);
  // collected keycards next to the face
  if (player.keys) {
    const keyColors = { blue: "#3060e0", yellow: "#d8b820", red: "#d02020" };
    let ki = 0;
    for (const color of ["blue", "yellow", "red"]) {
      if (player.keys[color]) {
        ctx.fillStyle = keyColors[color];
        ctx.fillRect(370, VIEW_H + 8 + ki * 17, 9, 13);
        ctx.fillStyle = "#eee";
        ctx.fillRect(372, VIEW_H + 10 + ki * 17, 5, 3);
      }
      ki++;
    }
  }
  // no kill tally here - counting corpses mid-fight is the exit
  // screen's job; the bar carries what you act on
  const levelMid = (390 + W) / 2;
  drawDigits("LEVEL", levelMid, mid - 14, 13, "#888", "center");
  drawDigits(LEVELS[levelIdx] ? LEVELS[levelIdx].name.split(":")[0] : "", levelMid, mid + 10, 26, "#c8a020", "center");

  // crosshair
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.fillRect(W / 2 - 1, VIEW_H / 2 - 6, 2, 4);
  ctx.fillRect(W / 2 - 1, VIEW_H / 2 + 2, 2, 4);
  ctx.fillRect(W / 2 - 6, VIEW_H / 2 - 1, 4, 2);
  ctx.fillRect(W / 2 + 2, VIEW_H / 2 - 1, 4, 2);
}

function renderMinimap() {
  // mapScale 1 is the size the automap used to draw at; the panel keeps
  // the level's proportions either way, so the size slider means the same
  // thing whether the map is held north-up or turned with the player
  const base = Math.min(6, ((VIEW_H - 20) / MAP_H) | 0);
  // however big the slider asks for, the panel still has to fit on screen
  const fits = Math.min((W - 24) / MAP_W, (VIEW_H - 34) / MAP_H);
  const s = Math.min(base * mapScale, fits), ox = 10, oy = 10;
  const pw = MAP_W * s, ph = MAP_H * s;
  const dot = Math.max(1, s - 1), pad = Math.max(1, s - 3);
  const mark = Math.max(2, s * 0.55);        // markers shrink with the map
  const item = Math.max(2, s * 0.6);
  ctx.save();
  ctx.globalAlpha = mapAlpha;
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(ox - 2, oy - 2, pw + 4, ph + 4);
  ctx.save();
  if (mapRotate) {
    // the panel becomes a window onto the level, turned so you face up
    ctx.beginPath(); ctx.rect(ox, oy, pw, ph); ctx.clip();
    ctx.translate(ox + pw / 2, oy + ph / 2);
    ctx.rotate(-player.ang - Math.PI / 2);
    ctx.translate(-player.x * s, -player.y * s);
  } else {
    ctx.translate(ox, oy);
  }
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    if (!explored[y * MAP_W + x]) continue;   // fog of war
    const t = MAP[y * MAP_W + x];
    if (t) {
      const d = DOOR_TILES.has(t) ? doorAt(x, y) : null;
      ctx.fillStyle =
        d && d.open > 0.8 ? "#4a6a30" :
        t === 4  ? "#c8a020" :
        t === 11 ? "#3060e0" : t === 12 ? "#d8b820" : t === 13 ? "#d02020" :
        t === 9 || t === 10 ? "#d02020" : "#8a8a8a";   // secret doors (14) stay wall-gray
      ctx.fillRect(x * s, y * s, dot, dot);
    } else if (floorMap[y * MAP_W + x] === 3) {   // teleporter pad
      ctx.fillStyle = "#40c8c8";
      ctx.fillRect(x * s + 1, y * s + 1, pad, pad);
    }
  }
  // discovered items (keycards deliberately not shown)
  for (const p of pickups) {
    if (p.kind !== "medkit" && p.kind !== "ammo" && p.kind !== "weapon") continue;
    if (!explored[(p.y | 0) * MAP_W + (p.x | 0)]) continue;
    ctx.fillStyle = p.kind === "medkit" ? "#e05050" : p.kind === "weapon" ? "#ff9020" : "#d8c060";
    ctx.fillRect(p.x * s - item / 2, p.y * s - item / 2, item, item);
  }
  ctx.fillStyle = "#30d030";
  ctx.beginPath();
  ctx.arc(player.x * s, player.y * s, mark, 0, 7);
  ctx.fill();
  ctx.strokeStyle = "#30d030";
  ctx.lineWidth = Math.max(1, s * 0.25);
  ctx.beginPath();
  ctx.moveTo(player.x * s, player.y * s);
  ctx.lineTo((player.x + Math.cos(player.ang) * 2.5) * s, (player.y + Math.sin(player.ang) * 2.5) * s);
  ctx.stroke();
  ctx.lineWidth = 1;
  ctx.restore();
  ctx.textAlign = "left";
  ctx.font = "bold 12px 'Courier New', monospace";
  ctx.fillStyle = "#ddd";
  ctx.fillText(LEVELS[levelIdx].name + (mapRotate ? "" : "   N\u2191"), ox, oy + ph + 14);
  ctx.restore();
}

function renderOverlays() {
  if (msgT > 0 && gameState === "play") {
    ctx.textAlign = "center";
    ctx.font = "bold 17px 'Courier New', monospace";
    ctx.fillStyle = "#e8c840";
    ctx.fillText(msg, W / 2, 26);
    ctx.textAlign = "left";
  }
  if (player.hurtFlash > 0) {
    ctx.fillStyle = `rgba(200,0,0,${player.hurtFlash * 0.9})`;
    ctx.fillRect(0, 0, W, VIEW_H);
  }
  if (player.pickFlash > 0) {
    ctx.fillStyle = `rgba(220,200,60,${player.pickFlash * 0.5})`;
    ctx.fillRect(0, 0, W, VIEW_H);
  }
  if (gameState === "play") return;

  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  if (gameState === "dead") {
    ctx.font = "bold 52px 'Courier New', monospace";
    ctx.fillStyle = "#d01010";
    ctx.fillText("YOU DIED", W / 2, H / 2 - 30);
    ctx.font = "bold 20px 'Courier New', monospace";
    ctx.fillStyle = "#ccc";
    ctx.fillText(LEVELS[levelIdx].name, W / 2, H / 2 + 10);
    ctx.fillText("PRESS R TO RESTART - ESC FOR MENU", W / 2, H / 2 + 42);
  } else if (gameState === "intermission") {
    ctx.font = "bold 36px 'Courier New', monospace";
    ctx.fillStyle = "#e0a020";
    ctx.fillText(LEVELS[levelIdx].name + " FINISHED", W / 2, H / 2 - 60);
    ctx.font = "bold 22px 'Courier New', monospace";
    ctx.fillStyle = "#ccc";
    ctx.fillText(`KILLS: ${player.kills} / ${totalEnemies}`, W / 2, H / 2 - 10);
    ctx.fillText(`ITEMS LEFT: ${pickups.length}`, W / 2, H / 2 + 22);
    ctx.font = "bold 16px 'Courier New', monospace";
    ctx.fillStyle = "#8a8a8a";
    ctx.fillText(`SKILL: ${SK().name}`, W / 2, H / 2 + 48);
    ctx.font = "bold 22px 'Courier New', monospace";
    ctx.fillStyle = "#e0a020";
    ctx.fillStyle = "#e0a020";
    ctx.fillText(pendingNext !== null
      ? "PRESS SPACE FOR " + LEVELS[pendingNext].name
      : "PRESS SPACE TO FINISH", W / 2, H / 2 + 78);
  } else if (gameState === "victory") {
    ctx.font = "bold 44px 'Courier New', monospace";
    ctx.fillStyle = "#e0a020";
    ctx.fillText("YOU WIN", W / 2, H / 2 - 40);
    ctx.font = "bold 20px 'Courier New', monospace";
    ctx.fillStyle = "#ccc";
    ctx.fillText("THE DEMONS ARE DEFEATED... FOR NOW", W / 2, H / 2 + 5);
    ctx.fillText("PRESS R FOR THE MENU", W / 2, H / 2 + 40);
  }
  ctx.textAlign = "left";
}

// ---------------------------------------------------------
// Menu rendering (drawn in the classic style, original art)
// ---------------------------------------------------------
function drawSkull(x, y) {
  const bob = Math.sin(performance.now() / 250) * 2;
  ctx.fillStyle = "#e0d8c8";
  ctx.fillRect(x, y + bob, 16, 12);
  ctx.fillRect(x + 3, y + 12 + bob, 10, 5);
  ctx.fillStyle = "#7a1010";
  ctx.fillRect(x + 3, y + 4 + bob, 4, 4);
  ctx.fillRect(x + 9, y + 4 + bob, 4, 4);
  ctx.fillStyle = "#8a8070";
  for (let i = 0; i < 3; i++) ctx.fillRect(x + 4 + i * 3, y + 13 + bob, 2, 3);
}
function sliderTrack(b) {
  return { x: b.x + 150, y: b.y + b.h / 2 - 5, w: 120, h: 10 };
}
function drawTransportIcon(act, cx, cy) {
  const s = 6;
  const tri = (x, dir) => {
    ctx.beginPath();
    ctx.moveTo(x + (dir > 0 ? -s / 2 : s / 2), cy - s);
    ctx.lineTo(x + (dir > 0 ? -s / 2 : s / 2), cy + s);
    ctx.lineTo(x + (dir > 0 ? s : -s), cy);
    ctx.closePath();
    ctx.fill();
  };
  if (act === "prev") { ctx.fillRect(cx - 8, cy - s, 2, s * 2); tri(cx + 5, -1); }
  else if (act === "next") { ctx.fillRect(cx + 6, cy - s, 2, s * 2); tri(cx - 5, 1); }
  else if (musicPaused) tri(cx - 2, 1);
  else { ctx.fillRect(cx - 5, cy - s, 3, s * 2); ctx.fillRect(cx + 2, cy - s, 3, s * 2); }
}
function drawMenuButtons() {
  ctx.textAlign = "center";
  for (const b of menuLayout()) {
    const sel = b.i === menuSel;
    // riveted metal plate
    const grad = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
    if (sel) {
      grad.addColorStop(0, "#6a2418"); grad.addColorStop(0.5, "#8a2e1a"); grad.addColorStop(1, "#40140c");
    } else {
      grad.addColorStop(0, "#3c3c42"); grad.addColorStop(0.5, "#2a2a2f"); grad.addColorStop(1, "#17171a");
    }
    ctx.fillStyle = grad;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // bevel
    ctx.fillStyle = sel ? "#b8542e" : "#55555e";
    ctx.fillRect(b.x, b.y, b.w, 2); ctx.fillRect(b.x, b.y, 2, b.h);
    ctx.fillStyle = "#0b0b0d";
    ctx.fillRect(b.x, b.y + b.h - 2, b.w, 2); ctx.fillRect(b.x + b.w - 2, b.y, 2, b.h);
    // corner rivets
    ctx.fillStyle = sel ? "#d8834a" : "#63636c";
    for (const [rx, ry] of [[b.x + 6, b.y + 6], [b.x + b.w - 9, b.y + 6], [b.x + 6, b.y + b.h - 9], [b.x + b.w - 9, b.y + b.h - 9]])
      ctx.fillRect(rx, ry, 3, 3);
    if (b.kind === "slider") {
      // label left, bar right
      ctx.textAlign = "left";
      ctx.font = "bold 17px Impact, 'Arial Black', sans-serif";
      ctx.fillStyle = "#300";
      ctx.fillText(b.label, b.x + 15, b.y + b.h / 2 + 7 + 2);
      ctx.fillStyle = sel ? "#ff4a2a" : "#c01812";
      ctx.fillText(b.label, b.x + 13, b.y + b.h / 2 + 7);
      const t = sliderTrack(b), v = b.get();
      ctx.fillStyle = "#0d0d10";
      ctx.fillRect(t.x, t.y, t.w, t.h);
      ctx.fillStyle = sel ? "#c9421f" : "#7a2a18";
      ctx.fillRect(t.x, t.y, t.w * v, t.h);
      ctx.fillStyle = sel ? "#ffb08a" : "#9a9aa4";       // knob
      ctx.fillRect(t.x + t.w * v - 3, t.y - 3, 6, t.h + 6);
      ctx.font = "bold 13px 'Courier New', monospace";
      ctx.fillStyle = "#bbb";
      ctx.textAlign = "right";
      ctx.fillText(Math.round(v * 100) + "%", b.x + b.w - 10, b.y + b.h / 2 + 5);
      ctx.textAlign = "center";
    } else if (b.kind === "player") {
      ctx.textAlign = "left";
      ctx.font = "bold 12px 'Courier New', monospace";
      ctx.fillStyle = "#8a8a92";
      ctx.fillText(musicPaused ? "PAUSED" : "NOW PLAYING", b.x + 13, b.y + 14);
      ctx.font = "bold 13px 'Courier New', monospace";
      ctx.fillStyle = sel ? "#ff8a5a" : "#c8b090";
      const nm = trackName();
      ctx.fillText(nm.length > 20 ? nm.slice(0, 19) + "…" : nm, b.x + 13, b.y + 29);
      for (const p of playerButtons(b)) {
        ctx.fillStyle = "#0e0e12";
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = sel ? "#7a3a24" : "#4a4a52";
        ctx.fillRect(p.x, p.y, p.w, 1); ctx.fillRect(p.x, p.y, 1, p.h);
        ctx.fillStyle = sel ? "#ffa070" : "#b0b0ba";
        drawTransportIcon(p.act, p.x + p.w / 2, p.y + p.h / 2);
      }
      ctx.textAlign = "center";
    } else {
      ctx.font = "bold 22px Impact, 'Arial Black', sans-serif";
      ctx.fillStyle = "#300";
      ctx.fillText(b.label, W / 2 + 2, b.y + b.h / 2 + 8 + 2);
      ctx.fillStyle = sel ? "#ff4a2a" : "#c01812";
      ctx.fillText(b.label, W / 2, b.y + b.h / 2 + 8);
    }
    if (sel) drawSkull(b.x - 28, b.y + 9);
  }
  ctx.textAlign = "left";
}
function drawHelp() {
  ctx.textAlign = "center";
  ctx.font = "bold 24px Impact, 'Arial Black', sans-serif";
  ctx.fillStyle = "#b01010";
  ctx.fillText("HOW TO PLAY", W / 2, 175);
  ctx.font = "bold 15px 'Courier New', monospace";
  ctx.fillStyle = "#ccc";
  const lines = [
    "WASD ........... MOVE / STRAFE",
    "MOUSE / ARROWS . TURN",
    "CLICK / SPACE .. FIRE",
    "E .............. USE DOORS + SWITCHES",
    "SHIFT .......... RUN",
    "M .............. AUTOMAP    N ... MUSIC",
    "                 (SIZE / OPACITY / ROTATE IN OPTIONS)",
    "[ ] ............ PREV / NEXT TRACK",
    "ESC ............ PAUSE + OPTIONS",
    "",
    "FIND THE EXIT SWITCH IN EACH LEVEL.",
    "COLORED DOORS NEED KEYCARDS.",
    "SOME WALLS HIDE SECRETS...",
    "",
    "PRESS ANY KEY TO RETURN",
  ];
  lines.forEach((ln, i) => ctx.fillText(ln, W / 2, 205 + i * 20));
  ctx.textAlign = "left";
}
function renderTitle() {
  if (menuArtOk) {
    // player-made key art, cover-fit and top-anchored so the marine stays framed
    const s = Math.max(W / menuArt.width, H / menuArt.height);
    const dw = menuArt.width * s, dh = menuArt.height * s;
    ctx.drawImage(menuArt, (W - dw) / 2, 0, dw, dh);
    // darken toward the bottom so the buttons stay readable
    const shade = ctx.createLinearGradient(0, 120, 0, H);
    shade.addColorStop(0, "rgba(0,0,0,0.05)");
    shade.addColorStop(1, "rgba(0,0,0,0.8)");
    ctx.fillStyle = shade;
    ctx.fillRect(0, 0, W, H);
  } else {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#1a0202");
    grad.addColorStop(0.45, "#4a0a02");
    grad.addColorStop(1, "#0e0000");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#180404";
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, H - 40 - ((x * 7919) % 53));
    ctx.lineTo(W, H);
    ctx.closePath(); ctx.fill();
  }
  // logo
  ctx.textAlign = "center";
  const logoSize = menuArtOk ? 84 : 108, logoY = menuArtOk ? 96 : 115;
  ctx.font = `bold ${logoSize}px Impact, 'Arial Black', sans-serif`;
  ctx.fillStyle = "#2a0000";
  ctx.fillText("DOOM", W / 2 + 6, logoY + 6);
  const lg = ctx.createLinearGradient(0, logoY - 80, 0, logoY + 12);
  lg.addColorStop(0, "#ff6a20");
  lg.addColorStop(0.45, "#d01010");
  lg.addColorStop(1, "#500000");
  ctx.fillStyle = lg;
  ctx.fillText("DOOM", W / 2, logoY);
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.fillStyle = "#c8a880";
  ctx.fillText("A FAN-MADE HTML TRIBUTE", W / 2, logoY + 24);
  ctx.textAlign = "left";
  if (menuMode === "help") drawHelp();
  else drawMenuButtons();
}
function renderPauseMenu() {
  ctx.textAlign = "center";
  ctx.font = "bold 40px Impact, 'Arial Black', sans-serif";
  ctx.fillStyle = "#500"; ctx.fillText("PAUSED", W / 2 + 3, 103);
  ctx.fillStyle = "#d01010"; ctx.fillText("PAUSED", W / 2, 100);
  ctx.textAlign = "left";
  drawMenuButtons();
}

// ---------------------------------------------------------
// Main loop
// ---------------------------------------------------------
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (gameState === "title") {
    renderTitle();
  } else {
    update(dt);
    renderWorld();
    if (gameState === "play" || gameState === "paused") renderWeapon();
    renderHUD();
    if (showMap) renderMinimap();
    renderOverlays();
    if (gameState === "paused") renderPauseMenu();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
